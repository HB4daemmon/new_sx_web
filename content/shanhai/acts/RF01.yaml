index: 5
story:
  title: 终局渡劫段：天门独渡
  goal: 击败唯一劫相，让天门回流重新有出口
  prelude: 昆仑前门在身后合拢，天门的回流凝成劫相。此刻没有新补给，也没有人能替你承受这一渡。
  ordinary_route: 你独自踏上最后的天阶，水气与雷火沿封闭回路逼近。
  battle_after:
    final: 终战已结束，天门之外没有第五幕或后续整备。
  boss_before: 水气与雷火在门内凝成劫相。你身后是四幕走过的旧路，眼前只有这一渡。
  boss_after: 此战后不再整备；终局只结算本局实际战果与行迹。
  passage: 天门之外没有第五幕；结果按这次真实胜负和已发生行迹收束。
  defeat: 你未能越过天门劫相；回流仍被锁在门内，归路没有打开。
  victory: 天门回流终于有了出口。云阶下，水声一程程向海退去；潮口、断桥、火海与昆仑旧路连成归途。你收起兵刃，循着来路下山。这一次，水与你都有了归处。
  boss_variants:
    EN-F1: 雷劫化身散作细雨，封口的雷纹终于熄灭。
    EN-F2: 昼夜劫相消散，天门中的明暗重新分开，回卷的水气缓缓落下。
