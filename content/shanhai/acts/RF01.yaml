status: design_target
summary: 独自渡过唯一劫相，胜后让天门回流重新有出口。
description: 天门将水气与雷火困成回流。你只带入四幕真实留下的构筑与余力，独自迎向本局抽中的唯一劫相；击败它才会打开归路，终段不追加成长。
