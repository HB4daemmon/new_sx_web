  title: 终局渡劫段：天门独渡
  goal: 用当前主修、已选天赋、实际持有法宝、当前气血和资源击败唯一终战。
  prelude: 昆仑前门在身后合拢，女娲补住天裂的一线；天门的雷光从云隙中落下。
  ordinary_route: 你沿最后一段天阶独自上行，门后的风声和雷声在同一刻静了下来。
  battle_after:
    final: 雷火在天门外散开，云层短暂露出一片无声的天光。
  boss_before: 天门中央悬着一道未落的雷痕，终战的两道劫相在光幕后轮流显形。
  boss_after: 雷声远去，天门落下一束清光，胜负都在这一刻定下。
  passage: 天门之后只剩结局，长阶的回声随着云海一同合拢。
