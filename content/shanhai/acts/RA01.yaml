      - {type: C, id: EN-A1-C1}
      - {type: E, id: RE001}
      - {type: C, id: EN-A1-C2}
      - {type: R, id: R-A1-01}
      - {type: E, id: RE002}
      - {type: S, id: SHOP-A1-01}
      - {type: C, id: EN-A1-C3}
      - {type: E, id: RE004}
      - {type: C, id: EN-A1-C4}
      - {type: L, id: EN-A1-L1}
      - {type: B, id: EN-A1-B1}
    count: {C: 4, E: 3, L: 1, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 5, 8], core_replaces: E, fallback: ordinary_event}
  - id: elite
    name: 精英
    summary: 用第二场精英替换一场普通战，换取更多稀有质量机会并承担真实损耗。
    nodes:
      - {type: C, id: EN-A1-C1}
      - {type: E, id: RE003}
      - {type: C, id: EN-A1-C2}
      - {type: R, id: R-A1-02}
      - {type: L, id: EN-A1-L1}
      - {type: E, id: RE005}
      - {type: S, id: SHOP-A1-02}
      - {type: L, id: EN-A1-L2}
      - {type: E, id: RE006}
      - {type: C, id: EN-A1-C3}
      - {type: B, id: EN-A1-B1}
    count: {C: 3, E: 3, L: 2, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 6, 9], core_replaces: E, fallback: ordinary_event}
  - id: tracking
    name: 追踪
    summary: 用一个事件位显示人物线或独立机缘，核心内部内容不增加节点。
    nodes:
      - {type: C, id: EN-A1-C1}
      - {type: K, id: RK001, candidate_ids: [RK001, RK003, RK013], fallback: ordinary_event}
      - {type: C, id: EN-A1-C2}
      - {type: E, id: RE007}
      - {type: L, id: EN-A1-L1}
      - {type: R, id: R-A1-03}
      - {type: C, id: EN-A1-C3}
      - {type: S, id: SHOP-A1-03}
      - {type: E, id: RE008}
      - {type: C, id: EN-A1-C4}
      - {type: B, id: EN-A1-B2}
    count: {C: 4, E: 2, K: 1, L: 1, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2], core_replaces: E, fallback: ordinary_event}
  - id: saving
    name: 省钱
    summary: 跳过商店，以普通事件补足十一节点，不获得免费库存或强制购买。
    nodes:
      - {type: C, id: EN-A1-C1}
      - {type: E, id: RE001}
      - {type: C, id: EN-A1-C2}
      - {type: R, id: R-A1-04}
      - {type: E, id: RE002}
      - {type: L, id: EN-A1-L1}
      - {type: E, id: RE004}
      - {type: E, id: RE005}
      - {type: C, id: EN-A1-C3}
      - {type: C, id: EN-A1-C4}
      - {type: B, id: EN-A1-B1}
    count: {C: 4, E: 4, L: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 5, 7, 8], core_replaces: E, fallback: ordinary_event}
  - id: rush
    name: 硬闯
    summary: 跳过休整，以普通事件补位；不发隐藏回血，保留商店的有限购买机会。
    nodes:
      - {type: C, id: EN-A1-C1}
      - {type: E, id: RE001}
      - {type: C, id: EN-A1-C2}
      - {type: E, id: RE002}
      - {type: S, id: SHOP-A1-04}
      - {type: L, id: EN-A1-L1}
      - {type: E, id: RE004}
      - {type: E, id: RE005}
      - {type: C, id: EN-A1-C3}
      - {type: C, id: EN-A1-C4}
      - {type: B, id: EN-A1-B1}
    count: {C: 4, E: 4, L: 1, S: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 4, 7, 8], core_replaces: E, fallback: ordinary_event}
  - id: avoid
    name: 避险
    summary: 用普通战替换精英，获得第五场普通战机会，放弃稀有精英奖励。
    nodes:
      - {type: C, id: EN-A1-C1}
      - {type: E, id: RE001}
      - {type: C, id: EN-A1-C2}
      - {type: R, id: R-A1-05}
      - {type: E, id: RE002}
      - {type: S, id: SHOP-A1-05}
      - {type: C, id: EN-A1-C3}
      - {type: E, id: RE004}
      - {type: C, id: EN-A1-C4}
      - {type: C, id: EN-A1-C1}
      - {type: B, id: EN-A1-B2}
    count: {C: 5, E: 3, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 5, 8], core_replaces: E, fallback: ordinary_event}
