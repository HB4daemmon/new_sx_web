kind: act
id: RA01
name: 潮口立身
status: design_target
summary: 在潮口建立第一套能持续前进的构筑。
description: 山海潮刚露出通向昆仑的断续石阶，主角从一门普通功法起步，在潮声、药篓与第一场首领战之间决定先补输出、保气血还是承担风险。
tags: [act, act1, tide_gate, foundation, original]
source:
  basis: original
  reference: null
  note: 四幕主线、地点、路线调度与奖励数值是游戏原创首测输入；神话人物关系仅通过已登记事件和人物线接入，不把本幕文案当作原典事实。
balance:
  target:
    node_count: 11
    common_battles: 4
    ordinary_events: 3
    elite_battles: 1
    shop_nodes: 1
    rest_nodes: 1
    boss_battles: 1
    reference_hp: 625
  measured: null
index: 1
story:
  title: 第一幕：潮口立身
  goal: 在潮口建立能持续前进的基础构筑，击败潮口首领后才算站稳第一块通向昆仑的石阶。
  prelude: 潮水退开半步，露出通向潮门的断续石阶；药篓、旧碑和远处的潮门前哨在雾里逐一显形。
  ordinary_route: 你沿着药篓、旧碑和潮门前哨前行，石阶尽头的水雾里浮出一座旧门。
  battle_after:
    common: 潮声暂低，石阶在脚下重新露出一截。
    elite: 石卫退入潮雾，前方的水门亮起一线冷光。
    boss: 潮门震动了一次，向上的石阶在雾后显出。
  boss_before: 潮门前的两道首领遗影轮流守住石阶，水雾把旧门和断桥隔在身后。
  boss_after: 水雾从潮门上退去，通往断桥的石阶在潮声里缓缓抬升。
  passage: 你踏上第二段石阶，潮声变成桥下回音，断桥的影子已经压到眼前。
  boss_variants:
    EN-A1-B1: 共工遗影撞开潮门，碎水沿着石阶奔向断桥。
    EN-A1-B2: 河伯试潮遗影收拢回流，潮口在短暂的寂静中让出道路。
  core_relationships:
    RS01: [RK001, RK002]
    RS02: [RK003, RK004]
    RS03: [RK005, RK006]
    RS04: [RK007, RK008]
    RS05: [RK009, RK010]
    RS06: [RK011, RK012]
  relationship_notes:
    RS01: 神农以分药建立医药承诺，回访时用药棚风险兑现，不是随机人物名。
    RS02: 精卫把筑堤与后段清礁连成一次追踪，初遇让出眼前选择，回访才有试炼。
    RS03: 后羿要求携带明目珠到后段，关系核心是器物前置与试射，不是抽到名字就领奖。
    RS04: 禹把让出修为与后段守堤绑定，承诺失败不追回已放弃的成长。
    RS05: 哪吒的两阵结构把初遇过阵和后段续阵分成两个事件位，第一阵不是免费法宝。
    RS06: 铁扇公主的短风与火伤承诺指向后段风止石，火器奖励只在明示风险后结算。
  independent_core_echo: RK013
  no_core_requirement: true
