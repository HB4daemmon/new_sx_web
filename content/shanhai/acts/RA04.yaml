kind: act
id: RA04
name: 昆仑前门
status: design_target
summary: 在昆仑天门前完成最后整备，保留真实赢来的构筑并放下未兑现的承诺。
description: 云层已经能看见昆仑前门，主角只有一幕的节点把法宝、灵石、气血和换法机会收束成可渡劫的真实状态；任何核心人物都不是入场条件。
tags: [act, act4, kunlun_gate, final_preparation, original]
source:
  basis: original
  reference: null
  note: 昆仑前门主线、路线调度与奖励数值是游戏原创首测输入；神话意象只作为原创终局外壳，不把人物关系或终战门槛冒充原典流程。
balance:
  target:
    node_count: 11
    common_battles: 4
    ordinary_events: 3
    elite_battles: 1
    shop_nodes: 1
    rest_nodes: 1
    boss_battles: 1
    reference_hp: 1150
  measured: null
index: 4
story:
  title: 第四幕：昆仑前门
  goal: 完成渡劫前最后整备，击败昆仑前门首领后以真实带入状态进入天门独渡。
  prelude: 火海之后，云阶把昆仑前门推到眼前；雷门、旧关和门前的石兽在云中若隐若现。
  ordinary_route: 你沿着云阶、雷门和旧关前进，最后一段石路在天门的冷光下收束。
  battle_after:
    common: 云阶再升一层，雷门后的天光从石缝里落下。
    elite: 门前的石兽退入云中，旧关的铜铃在风里响了一声。
    boss: 昆仑前门的云雾裂开，天门在更高处露出轮廓。
  boss_before: 昆仑前门的最后一道门槛由两道首领遗影守住，云海在门后翻涌。
  boss_after: 云门向两侧退开，天门的雷光穿过长阶，前方只剩一条向上的路。
  passage: 你把云阶下的回声留在身后，独自走向天门的光。
  boss_variants:
    EN-A4-B1: 陆吾守门伏在云阶尽头，前门石兽向两旁退开。
    EN-A4-B2: 开明镇阶抬首望向天门，九重门影在云中依次点亮。
  core_relationships:
    RS01: [RK001, RK002]
    RS02: [RK003, RK004]
    RS03: [RK005, RK006]
    RS04: [RK007, RK008]
    RS05: [RK009, RK010]
    RS06: [RK011, RK012]
  relationship_notes:
    RS01: 神农回访只在药棚承诺有效时出现，未兑现不转成终战补给。
    RS02: 精卫清礁关系以风险和前置事实收束，错过回访不阻断昆仑前门。
    RS03: 后羿在风口以明目珠和试射完成关系回声，奖励仍按 RK006 实际胜利结算。
    RS04: 禹的守堤回访只兑现已让出的成长选择，不替主角自动恢复气血。
    RS05: 哪吒第二阵承接初遇事实，收手与失败都不会生成第三个事件节点。
    RS06: 铁扇公主以火伤换借风资格，传奇火器不是人物名出现后的附送奖励。
  independent_core_echo: RK016
  no_core_requirement: true
