      - {type: C, id: EN-A4-C3}
      - {type: S, id: SHOP-A4-03}
      - {type: E, id: RE035}
      - {type: C, id: EN-A4-C4}
      - {type: B, id: EN-A4-B2}
    count: {C: 4, E: 2, K: 1, L: 1, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2], core_replaces: E, fallback: ordinary_event}
  - id: saving
    name: 省钱
    summary: 跳过商店，以普通事件补位，把灵石留给最后一次合法换法或准备。
    nodes:
