      - {type: C, id: EN-A4-C3}
      - {type: C, id: EN-A4-C4}
      - {type: B, id: EN-A4-B1}
    count: {C: 4, E: 4, L: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 5, 7, 8], core_replaces: E, fallback: ordinary_event}
  - id: rush
    name: 硬闯
    summary: 跳过休整保留商店，明确不获得首领前隐藏恢复。
    nodes:
      - {type: C, id: EN-A4-C1}
      - {type: E, id: RE028}
      - {type: C, id: EN-A4-C2}
      - {type: E, id: RE029}
      - {type: S, id: SHOP-A4-04}
      - {type: L, id: EN-A4-L1}
      - {type: E, id: RE030}
      - {type: E, id: RE031}
