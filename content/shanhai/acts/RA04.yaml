      - {type: B, id: EN-A4-B1}
    count: {C: 4, E: 4, L: 1, S: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 4, 7, 8], core_replaces: E, fallback: ordinary_event}
  - id: avoid
    name: 避险
    summary: 放弃精英稀有机会，用第五场普通战把最后的短板留给公共奖励。
    nodes:
      - {type: C, id: EN-A4-C1}
      - {type: E, id: RE028}
      - {type: C, id: EN-A4-C2}
      - {type: R, id: R-A4-05}
