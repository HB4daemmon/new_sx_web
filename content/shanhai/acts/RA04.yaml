  target:
    target_realm: n4
    cumulative_xp: 2040_or_more_if_earned
    reference_hp: 1150
    coins: runtime_state_after_rewards_and_purchases
    current_hp: runtime_state
    max_hp: runtime_state
    selected_artifacts: actual_owned_only
    final_battle_entry: exact_runtime_state
  risk:
    - B4的真实240 XP在胜利后仍可正常满足突破并选择天赋，不因进入RF01被禁止。
    - n4不是自动赋予；未达到2040累计修为时保留当前境界。
    - RF01不补商店、休整、准备、法宝、XP、灵石或免费突破。
