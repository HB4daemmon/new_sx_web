entry_snapshot:
  target:
    realm: n2
    cumulative_xp: 600_or_more_from_real_rewards
    next_breakthrough_requirement: 600
    reference_hp: 950
    coins: runtime_state_from_RA02
    current_hp: runtime_state
    max_hp: runtime_state
    current_method: one_owned_method
    artifact_layers: actual_owned_only
  risk:
    - 火海普通战、精英和首领的压力是首测目标，不把旧200HP算例当正式伤害。
    - 换法必须在合法整备位一次确认，预览和支付不额外增加节点，也不回血。
    - RK015等独立机缘有明确前置时才显示，否则回退普通事件。
exit_snapshot:
  target:
    target_realm: n3
    cumulative_xp: 1200_or_more_if_earned
    reference_hp: 950
    coins: runtime_state_after_rewards_and_purchases
    current_hp: runtime_state
    max_hp: runtime_state
    selected_artifacts: actual_owned_only
  risk:
    - n3仍是实际修为达到累计门槛后的目标，不由幕末或火海首领自动授予。
    - 最大气血变化不回填当前气血，跨幕不补血，未走商店不获得免费库存。
    - 未完成的核心风险与奖励不会带入终段，也不会在下一幕补发。
