schema_version: 1
content_version: shanhai-content-0.1
kind: act
id: RA03
name: 火海取舍
status: design_target
summary: 在火海压力与换法机会之间决定继续放大当前构筑还是为后段承担转型成本。
description: 潮水退到山根，火海与旧经阁把每一点气血、护盾和灵石的机会成本放大；核心人物缺席时，公共事件仍把路指向昆仑。
tags: [act, act3, fire_sea, tradeoff, method_switch, original]
source:
  basis: original
  reference: null
  note: 火海主线、路线调度与奖励数值是游戏原创首测输入；人物线、独立机缘和法本前置仅引用现有内容记录，不声称古籍时间线或能力为事实。
balance:
  target:
    node_count: 11
    common_battles: 4
    ordinary_events: 3
    elite_battles: 1
    shop_nodes: 1
    rest_nodes: 1
    boss_battles: 1
    reference_hp: 950
  measured: null
index: 3
story:
  title: 第三幕：火海取舍
  goal: 在火海和旧经阁的连续压力中决定继续强化当前构筑或承担换法成本，并击败火海首领。
  prelude: 断桥后的山腹喷出火光，旧经阁的残门与器殿在火道两侧交替出现。
  ordinary_route: 你沿着火道、器殿和余烬驿站前进，灰烬深处不时露出通向经阁的旧阶。
  battle_after:
    common: 火道暂时安静，余烬从石缝里向着旧经阁飘去。
    elite: 火墙退开一线，器殿的冷光在高处闪过。
    boss: 炉门的火色渐暗，云影穿过山腹上方的裂口。
  boss_before: 旧经阁出口被两道首领遗影守住，火墙和云影在门前交叠。
  boss_after: 火焰退入山腹，灰烬后的云阶向昆仑前门延伸。
  passage: 你把火海留在身后，云层压低，昆仑前门的轮廓从灰烬中升起。
  boss_variants:
    EN-A3-B1: 毕方烈羽收拢最后一圈火光，山腹上方落下一道灰白云阶。
    EN-A3-B2: 祝融试火熄灭炉门，余烬在通往昆仑的风里逐片冷却。
  core_relationships:
    RS01: [RK001, RK002]
    RS02: [RK003, RK004]
    RS03: [RK005, RK006]
    RS04: [RK007, RK008]
    RS05: [RK009, RK010]
    RS06: [RK011, RK012]
  relationship_notes:
    RS01: 神农回访在火海只处理已建立的药棚承诺，失败不补发稀有药器。
    RS02: 精卫清礁回访把前段承诺转成公开非致命风险，公共路线仍可独立通关。
    RS03: 后羿线在本幕只保留前置与故事回声，真正试射仍由第四幕 RK006 承接。
    RS04: 禹线把让出的修为转成后段守堤资格，事件不会给普通战固定包作为补偿。
    RS05: 哪吒的两阵关系要求初遇胜利事实，未成立时本幕 K 位回退普通事件。
    RS06: 铁扇公主的借风关系保留火伤成本，不能因抽到火属性法宝就视为完成承诺。
  independent_core_echo: RK015
  no_core_requirement: true
