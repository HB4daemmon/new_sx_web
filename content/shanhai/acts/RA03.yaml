      - {type: E, id: RE025}
      - {type: L, id: EN-A3-L1}
      - {type: R, id: R-A3-03}
      - {type: C, id: EN-A3-C3}
      - {type: S, id: SHOP-A3-03}
      - {type: E, id: RE026}
      - {type: C, id: EN-A3-C4}
      - {type: B, id: EN-A3-B2}
    count: {C: 4, E: 2, K: 1, L: 1, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2], core_replaces: E, fallback: ordinary_event}
  - id: saving
    name: 省钱
    summary: 跳过商店，以普通事件补足节点，保留灵石给可能的换法或事件代价。
    nodes:
      - {type: C, id: EN-A3-C1}
      - {type: E, id: RE019}
      - {type: C, id: EN-A3-C2}
      - {type: R, id: R-A3-04}
      - {type: E, id: RE020}
      - {type: L, id: EN-A3-L1}
      - {type: E, id: RE022}
      - {type: E, id: RE023}
      - {type: C, id: EN-A3-C3}
      - {type: C, id: EN-A3-C4}
      - {type: B, id: EN-A3-B1}
    count: {C: 4, E: 4, L: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 5, 7, 8], core_replaces: E, fallback: ordinary_event}
  - id: rush
    name: 硬闯
    summary: 跳过休整保留商店，普通事件不转化为隐藏治疗或额外准备。
    nodes:
      - {type: C, id: EN-A3-C1}
      - {type: E, id: RE019}
      - {type: C, id: EN-A3-C2}
      - {type: E, id: RE020}
      - {type: S, id: SHOP-A3-04}
      - {type: L, id: EN-A3-L1}
      - {type: E, id: RE022}
      - {type: E, id: RE023}
      - {type: C, id: EN-A3-C3}
      - {type: C, id: EN-A3-C4}
      - {type: B, id: EN-A3-B1}
    count: {C: 4, E: 4, L: 1, S: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 4, 7, 8], core_replaces: E, fallback: ordinary_event}
  - id: avoid
    name: 避险
    summary: 放弃精英稀有机会，用第五场普通战保住火海的节点节奏。
    nodes:
      - {type: C, id: EN-A3-C1}
      - {type: E, id: RE019}
      - {type: C, id: EN-A3-C2}
      - {type: R, id: R-A3-05}
      - {type: E, id: RE020}
      - {type: S, id: SHOP-A3-05}
      - {type: C, id: EN-A3-C3}
      - {type: E, id: RE022}
      - {type: C, id: EN-A3-C4}
      - {type: C, id: EN-A3-C1}
      - {type: B, id: EN-A3-B2}
    count: {C: 5, E: 3, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 5, 8], core_replaces: E, fallback: ordinary_event}
