      - {type: C, id: EN-A2-C1}
      - {type: E, id: RE013}
      - {type: C, id: EN-A2-C2}
      - {type: R, id: R-A2-02}
      - {type: L, id: EN-A2-L1}
      - {type: E, id: RE014}
      - {type: S, id: SHOP-A2-02}
      - {type: L, id: EN-A2-L2}
      - {type: E, id: RE015}
      - {type: C, id: EN-A2-C3}
      - {type: B, id: EN-A2-B1}
    count: {C: 3, E: 3, L: 2, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 6, 9], core_replaces: E, fallback: ordinary_event}
  - id: tracking
    name: 追踪
    summary: 用一个事件位追踪一条人物线或独立机缘，不增加第二个核心节点。
