entry_snapshot:
  target:
    realm: n1
    cumulative_xp: 120_or_more_from_real_rewards
    next_breakthrough_requirement: 480
    reference_hp: 775
    coins: runtime_state_from_RA01
    current_hp: runtime_state
    max_hp: runtime_state
    current_method: one_owned_method
    artifact_layers: actual_owned_only
  risk:
    - 跨幕不回血，上一幕的当前气血直接进入断桥。
    - 已取得法宝的战斗属性对尚未开打的战斗立即有效；行旅属性从下一个真实节点起效，不能追补过往节点。
    - 人物线回访必须有初遇和承诺事实，失败或错过时回退普通事件。
exit_snapshot:
  target:
    target_realm: n2
    cumulative_xp: 600_or_more_if_earned
    reference_hp: 775
    coins: runtime_state_after_rewards_and_purchases
    current_hp: runtime_state
    max_hp: runtime_state
    selected_artifacts: actual_owned_only
  risk:
    - n2只是达到累计修为后的可选目标，不因击败首领自动赋予。
    - 换法不回血、不继承怒气、护盾或战斗状态，也不免费重洗天赋。
    - 未选稀有候选、未完成核心和跳过商店库存均不跨幕补发。
