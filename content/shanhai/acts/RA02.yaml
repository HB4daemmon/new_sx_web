      - {type: C, id: EN-A2-C2}
      - {type: E, id: RE016}
      - {type: L, id: EN-A2-L1}
      - {type: R, id: R-A2-03}
      - {type: C, id: EN-A2-C3}
      - {type: S, id: SHOP-A2-03}
      - {type: E, id: RE017}
      - {type: C, id: EN-A2-C4}
      - {type: B, id: EN-A2-B2}
    count: {C: 4, E: 2, K: 1, L: 1, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2], core_replaces: E, fallback: ordinary_event}
  - id: saving
    name: 省钱
    summary: 不进商店，用普通事件补位，把灵石留给换法或核心付石路线。
    nodes:
      - {type: C, id: EN-A2-C1}
      - {type: E, id: RE010}
      - {type: C, id: EN-A2-C2}
      - {type: R, id: R-A2-04}
      - {type: E, id: RE011}
      - {type: L, id: EN-A2-L1}
      - {type: E, id: RE012}
      - {type: E, id: RE013}
      - {type: C, id: EN-A2-C3}
      - {type: C, id: EN-A2-C4}
      - {type: B, id: EN-A2-B1}
    count: {C: 4, E: 4, L: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 5, 7, 8], core_replaces: E, fallback: ordinary_event}
  - id: rush
    name: 硬闯
    summary: 跳过休整保留商店，普通事件不提供隐藏恢复。
    nodes:
      - {type: C, id: EN-A2-C1}
      - {type: E, id: RE010}
      - {type: C, id: EN-A2-C2}
      - {type: E, id: RE011}
      - {type: S, id: SHOP-A2-04}
      - {type: L, id: EN-A2-L1}
      - {type: E, id: RE012}
      - {type: E, id: RE013}
      - {type: C, id: EN-A2-C3}
      - {type: C, id: EN-A2-C4}
      - {type: B, id: EN-A2-B1}
    count: {C: 4, E: 4, L: 1, S: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 4, 7, 8], core_replaces: E, fallback: ordinary_event}
  - id: avoid
    name: 避险
    summary: 用普通战替换精英，放弃稀有精英机会换取更稳定的第五场普通战。
    nodes:
      - {type: C, id: EN-A2-C1}
      - {type: E, id: RE010}
      - {type: C, id: EN-A2-C2}
      - {type: R, id: R-A2-05}
      - {type: E, id: RE011}
