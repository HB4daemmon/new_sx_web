      - {type: C, id: EN-A2-C1}
      - {type: E, id: RE010}
      - {type: C, id: EN-A2-C2}
      - {type: R, id: R-A2-01}
      - {type: E, id: RE011}
      - {type: S, id: SHOP-A2-01}
