schema_version: 1
content_version: shanhai-content-0.1
kind: act
id: RA02
name: 断桥试法
status: design_target
summary: 在断桥连续损耗中检验功法与法宝是否已经形成稳定组合。
description: 潮路抬升成断桥，前一幕的选择在药棚、旧炉和浮桥边留下痕迹；主角可以追一次核心机缘，也可以只靠普通事件、斗法和精英继续试法。
tags: [act, act2, broken_bridge, method_trial, original]
source:
  basis: original
  reference: null
  note: 断桥主线、路线调度与奖励数值是游戏原创首测输入；人物线只引用已登记事件，不把人物关系或法宝来源写成未经核验的原典事实。
balance:
  target:
    node_count: 11
    common_battles: 4
    ordinary_events: 3
    elite_battles: 1
    shop_nodes: 1
    rest_nodes: 1
    boss_battles: 1
    reference_hp: 775
  measured: null
index: 2
story:
  title: 第二幕：断桥试法
  goal: 让功法与法宝形成稳定组合，承受连续节点的资源损耗并击败断桥首领。
  prelude: 潮口石阶接成悬空断桥，断缆、旧炉和浮桥在风里彼此相连；山腹深处透出一线火光。
  ordinary_route: 你沿着断缆、旧炉和浮桥向前，断碑上的旧字在脚边一块块亮起。
  battle_after:
    common: 断桥木板在身后轻响，远处的火光沿桥缝向前蔓延。
    elite: 桥守退开半步，旧炉里的火星照出一条更窄的路。
    boss: 合流点的风突然停住，桥端露出通往火海的红光。
  boss_before: 断桥唯一的合流点被两道首领遗影守住，桥下水声与山腹火光同时逼近。
  boss_after: 断桥重新承住脚步，前方落下几粒火星，山腹的门在远处张开。
  passage: 你从断桥另一端望见山腹火海，云影在火光上方缓慢移动。
  boss_variants:
    EN-A2-B1: 相柳残蜕试阵，九道水影沿断桥回卷后沉入火海。
    EN-A2-B2: 刑天战意试炼，断桥上的鼓声停下，只留下向火海延伸的脚印。
  core_relationships:
    RS01: [RK001, RK002]
    RS02: [RK003, RK004]
    RS03: [RK005, RK006]
    RS04: [RK007, RK008]
    RS05: [RK009, RK010]
    RS06: [RK011, RK012]
  relationship_notes:
    RS01: 神农的后段药棚只认第一幕真实留下的承诺，未初遇时本幕不伪造回访。
    RS02: 精卫的清礁回访不在断桥凭空生成，调度器只为已登记的人物线保留后续资格。
    RS03: 后羿的明目珠前置先验证实际持有，再把第四幕试射作为同一条线的第二遇。
    RS04: 禹的治水承诺以放弃一笔真实修为为代价，断桥公共事件不能同时复制奖励。
    RS05: 哪吒只在初遇第一阵事实成立后显示第二阵，内部战不增加地图节点。
    RS06: 铁扇公主的火伤承诺跨幕保存，不把火海普通事件的名字当作人物关系。
  independent_core_echo: RK014
  no_core_requirement: true
