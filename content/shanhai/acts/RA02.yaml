      - {type: E, id: RE012}
      - {type: C, id: EN-A2-C4}
      - {type: L, id: EN-A2-L1}
      - {type: B, id: EN-A2-B1}
    count: {C: 4, E: 3, L: 1, S: 1, R: 1, B: 1}
    core_slot_policy: {eligible_event_slots: [2, 5, 8], core_replaces: E, fallback: ordinary_event}
  - id: elite
    name: 精英
    summary: 以第二场精英替换一场普通战，提前承担断桥压力换稀有质量。
