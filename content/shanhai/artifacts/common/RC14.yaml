    consumes: []
    replaces: []
    limit: {scope: round, count: 1}
    text: 集齐3层后，每轮首次成功给已有燃烧的敌人施加中毒时，该次新增中毒层的伤害系数额外提高0.04；持续伤害结算不会再次触发。
