status: design_target
summary: 攻击 +2；每层自身中毒伤害 +6%；普攻施毒1层，怒技引爆全部预存自身毒层，造成剩余伤害的1.1倍；核心定位
description: 蛇纹瓶放大自身施加的中毒；核心规则让普攻施加1层毒，怒技消费行动开始前敌人身上由自身施加的全部中毒层，按剩余结算次数造成1.1倍伤害。本次怒技新加的毒层不参与引爆。核心定位仅作描述，可与最多3件其他法宝一同装备；未装备时无属性或效果。
