summary: 支援定位；镜映右侧法宝本次触发输出
description: 镜器复制紧邻右侧已装备法宝在本次触发中实际产生的伤害、治疗、护盾、怒气和状态输出；镜映先结算，右侧法宝仍按正常条件触发。无需右侧法宝满层；若被镜映的输出来自觉醒，该觉醒仍须满足自身条件。镜器不复制基础属性、静态数值或规则改写、行旅、消耗本身或镜映产生的次级触发。右侧无装备或本次没有可触发的上述输出时，镜器无效。镜器自身的双生、疾行铭刻可作用于镜映，右侧法宝的铭刻不会转移给镜器。
