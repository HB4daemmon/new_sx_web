summary: 核心定位；融合养气玉与回春瓶，积疗成爆
description: 累计两次合炼进度后消耗养气玉与回春瓶各一层。每场合格胜利增加一次进度；至少取得一场真实胜利后，也可付灵石催化一次。战斗开始和胜利结算时都须持有每种材料至少一层，事件战胜利也计数。装备者所有来源的有效治疗与溢疗分别按实际数值1:1积为甘露，最多储存自身最大气血的50%；镜映复制的治疗不再计入。每个自身存活主动作完成时，甘露达到最大气血的20%便消耗全部甘露，对敌方造成储量0.8倍的不可暴击派生伤害；每个主动作至多爆发一次。伤害来源归本壶，可由左侧相邻的昆仑镜镜映一次；自身合法铭刻按原输出规则结算。融合传奇不进入随机获取池。
