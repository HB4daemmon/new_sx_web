description: 敌方主动作实际扣除自身气血后，额外获得10点怒气，并将本次实际损失累积为血勇，最多储至自身最大气血的10%。下个对敌方造成实际气血伤害的普攻或怒技结束时，消耗全部血勇追加一次等量、不可暴击的派生反击；本场最多反击一次。纯护盾吸收、中毒、燃烧、反震、自伤与镜映伤害不回怒也不储血勇。装备后可与最多4件其他法宝一同装备；未装备时不提供属性或效果。
