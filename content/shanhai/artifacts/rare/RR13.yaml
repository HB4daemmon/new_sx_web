name: 截脉针
status: design_target
summary: 攻击 +8；普攻削怒，并将每次实际削怒等额转为自身怒气和护盾；支援定位
description: 普攻首段基础攻击命中后尝试削减敌方最多10点怒气；每轮我方削怒总量仍受20点上限与敌方抗性约束。每个开场或轮尾结算窗口中，持有者所有来源实际削去的怒气（包括其他功法与法宝）均按100%返还为自身怒气，并另生成等量护盾；返怒受自身怒气上限约束，护盾受护盾上限约束。无怒可削或削怒被完全抵御时不返还、不造盾。镜映与铭刻遵循各自输出复制规则。装备后可与最多4件其他法宝一同装备；未装备时不提供属性或效果。
