    text: 普攻首段基础攻击命中后请求削怒10点，在本轮结束时受我方每轮20点总上限、敌方削怒抗性和敌方当前怒气限制。每个开场或轮尾结算窗口内，按持有者所有来源的最终实际削去总量100%返还怒气，并生成等量护盾；自身怒气与护盾上限照常生效，不按请求量虚增。回怒与造盾不会再次请求削怒，镜映与铭刻按现有输出复制规则结算。
