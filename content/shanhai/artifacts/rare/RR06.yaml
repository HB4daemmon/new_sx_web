description: 每完成一次普通战、精英战或首领战节点，恢复最大气血的8%。每场战斗首次被敌方主动作实际扣除气血后，再恢复最大气血的4%；只有这次治疗实际恢复了气血，才给敌人施加1层、持续2轮的燃烧。护盾完全吸收、持续伤害、反震及镜映伤害不触发受创回春；治疗仍可与甘露盏、琉璃法印和五毒经等规则联动。装备后可与最多4件其他法宝一同装备；未装备时不提供属性或效果。
