schema_version: 1
content_version: shanhai-content-0.1
kind: method
id: RKF04
name: 御火诀
status: design_target
summary: 以火焰攻击和燃烧持续伤害压制敌方的火修功法。
description: 御火诀用普攻和怒技造成火焰伤害并施加燃烧；天赋可强化燃烧、消耗燃烧造成伤害或转为护盾。燃烧不会暴击。
tags: [method, common, attack, burn, direct]
source:
  basis: original
  reference: null
  note: 游戏原创功法；燃烧参数、耗火出口和护身收益均为首测设计输入，不声称已实装或已平衡。
balance:
  target:
    D: 100
    L: 100
    H: 100
    P: 100
    P_by_tier: [100, 125, 150, 175, 200]
  measured: null
rarity: common
role: 火修
stat_focus:
  primary: attack
  secondary: [defense, max_hp]
  damage_from: attack
  burn_from: attack
  survival_from: [defense, max_hp]
mechanic: null
acquisition:
  start: true
  pools: [method_common]
actions:
  basic:
    name: 引火灼身
    quick: 火伤并施加燃烧
    effects:
      - id: RKF04-BASIC-DAMAGE
        trigger: basic_action
        operation: damage
        target: enemy
        params:
          attack_ratio: 0.95
          segments: 1
          can_crit: true
          damage_kind: direct
          element: fire
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 按攻击的0.95倍造成一段可暴击火焰直接伤害；燃烧伤害另行结算。
      - id: RKF04-BASIC-BURN
        trigger: action_end
        operation: apply_status
        target: enemy
        params:
          status: burn
          stacks: 1
          max_stacks: 10
          duration_rounds: 3
          attack_ratio_per_stack: 0.08
          snapshot: attack
          tick_at: round_end_before_rage
          can_crit: false
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 引火灼身命中后施加1层燃烧，持续3轮；燃烧伤害在每轮结束时结算。
  rage:
    name: 炎心爆发
    quick: 怒技火伤并叠燃烧
    effects:
      - id: RKF04-RAGE-DAMAGE
        trigger: rage_action
        operation: damage
        target: enemy
        params:
          attack_ratio: 1.55
          segments: 1
          can_crit: true
          damage_kind: direct
          element: fire
          rage_cost: locked_action_cost
        requires: []
        consumes: [rage_locked_action_cost]
        replaces: []
        limit: {scope: action, count: 1}
        text: 消耗本次怒技所需的怒气后，按攻击的1.55倍造成一段可暴击火焰直接伤害。
      - id: RKF04-RAGE-BURN
        trigger: action_end
        operation: apply_status
        target: enemy
        params:
          status: burn
          stacks: 2
          max_stacks: 10
          duration_rounds: 3
          attack_ratio_per_stack: 0.08
          snapshot: attack
          tick_at: round_end_before_rage
          can_crit: false
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 炎心爆发命中后施加2层燃烧，持续3轮；怒技不会因此获得普攻回怒或额外行动。
passives:
  - id: RKF04-PASSIVE-BURN
    trigger: always
    operation: modify_effect
    target: self
    params:
      mode: add_ratio
      status: burn
      attack_ratio_per_stack_add: 0.02
      applies_to: method_burn_only
      snapshot: attack
      preserves_public_status_rules: true
      can_crit: false
    requires: []
    consumes: []
    replaces: []
    limit: {scope: permanent, count: 1}
    text: 御火诀施加的每层燃烧每次结算时额外造成攻击0.02倍的伤害；燃烧不会暴击，层数和持续时间仍按各项效果说明计算。
travel:
  - id: RKF04-TRAVEL-BATTLE-COINS
    trigger: battle_node_complete
    operation: grant_resource
    target: run
    params:
      resource: coins
      amount: 3
      basis: flat
      node_types: [combat, elite, boss]
      once_per_node: true
      combat_trigger: false
    requires: [real_battle_node_completed_alive]
    consumes: []
    replaces: []
    limit: {scope: node, count: 1}
    text: 存活完成普通战、精英战或首领战节点后获得3枚灵石；每个战斗节点只获得一次。
talents:
  - id: RKF04-J1-A
    tier: 1
    branch: A
    name: 余火绵延
    quick: 燃烧持续加长
    category: enhance
    effects:
      - id: RKF04-J1-A-BURN-DURATION
        trigger: action_end
        operation: modify_effect
        target: enemy
        params:
          mode: add_input
          effect_ids: [RKF04-BASIC-BURN, RKF04-RAGE-BURN]
          duration_rounds_add: 1
          status: burn
          refresh_policy: add_new_layer_only
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 御火诀新施加的燃烧持续时间增加1轮；已结束的燃烧不会恢复，燃烧层数仍受上限约束。
  - id: RKF04-J1-B
    tier: 1
    branch: B
    name: 炽击入骨
    quick: 普攻火伤提高
    category: enhance
    effects:
      - id: RKF04-J1-B-BASIC-DAMAGE
        trigger: basic_action
        operation: modify_effect
        target: self
        params:
          mode: add_ratio
          effect_id: RKF04-BASIC-DAMAGE
          damage_ratio_add: 0.15
          damage_scope: base_direct_segment
          excludes: [burn]
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 引火灼身造成的直接火焰伤害提高15%；不提高燃烧或其他追加伤害。
  - id: RKF04-J1-C
    tier: 1
    branch: C
    name: 炉心护脉
    quick: 普攻后按防御造盾
    category: enhance
    effects:
      - id: RKF04-J1-C-SHIELD
        trigger: action_end
        operation: shield
        target: self
        params:
          action: basic_action
          defense_ratio: 0.20
          max_hp_ratio: 0
          timing: after_damage_and_burn_application
          cap_ratio: 1
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 引火灼身完成后获得防御0.20倍的护盾。
  - id: RKF04-J2-A
    tier: 2
    branch: A
    name: 长燃不灭
    quick: 燃烧层数上限提高
    category: enhance
    effects:
      - id: RKF04-J2-A-BURN-CAP
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: add_input
          status: burn
          max_stacks_add: 2
          method_burn_only: true
          public_base_max_stacks: 10
          duration_unchanged: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 御火诀施加的燃烧最多叠加12层；每层的持续时间和结算次数不变。
  - id: RKF04-J2-B
    tier: 2
    branch: B
    name: 灰烬回气
    quick: 燃烧命中返怒
    category: cycle
    effects:
      - id: RKF04-J2-B-RAGE
        trigger: dot_resolved
        operation: rage_gain
        target: self
        params:
          status: burn
          amount: 5
          once_per_round: true
          requires_positive_actual_damage: true
          record_at: round_end
          no_extra_action: true
        requires: [positive_actual_burn_damage]
        consumes: []
        replaces: []
        limit: {scope: round, count: 1}
        text: 御火诀施加的燃烧每轮首次对气血或护盾造成伤害时，额外获得5点怒气；每轮最多触发一次，未造成伤害时不触发。
  - id: RKF04-J2-C
    tier: 2
    branch: C
    name: 怒火穿心
    quick: 怒技火伤提高
    category: enhance
    effects:
      - id: RKF04-J2-C-RAGE-DAMAGE
        trigger: rage_action
        operation: modify_effect
        target: self
        params:
          mode: add_ratio
          effect_id: RKF04-RAGE-DAMAGE
          damage_ratio_add: 0.22
          damage_scope: base_direct_segment
          excludes: [burn]
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 炎心爆发造成的直接火焰伤害提高22%；不提高燃烧或其他追加伤害。
  - id: RKF04-J3-A
    tier: 3
    branch: A
    name: 焚尽爆燃
    quick: 怒技耗火增伤
    category: convert
    effects:
      - id: RKF04-J3-A-CONSUME-BURN
        trigger: rage_action
        operation: consume_status
        target: enemy
        params:
          status: burn
          max_stacks: 3
          damage_per_stack_attack_ratio: 0.18
          damage_kind: derived
          can_crit: false
          recursive: false
          preserve_base_rage_damage: true
          no_new_burn: true
          consume_once: true
          if_no_burn: base_rage_only
          consume_key: burn_up_to_3_stacks
          outlet_group: burn_to_rage_damage
        requires: [burn_available]
        consumes: [burn_up_to_3_stacks]
        replaces: [RKF04-RAGE-BURN]
        limit: {scope: action, count: 1}
        text: 怒技不再施加燃烧，改为先消耗敌方已有的最多3层燃烧；每消耗1层，额外造成攻击0.18倍的火焰伤害。没有燃烧可消耗时，仍造成怒技原有伤害。
  - id: RKF04-J3-B
    tier: 3
    branch: B
    name: 火铠护身
    quick: 有燃烧时减伤
    category: enhance
    effects:
      - id: RKF04-J3-B-REDUCE
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: incoming_multiplier
          source: enemy_direct
          multiplier: 0.88
          condition: enemy_has_burn
          excludes: [burn, poison, event_damage]
          duration_reads_current_status: true
        requires: [enemy_has_method_burn]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 敌方至少有1层御火诀施加的燃烧时，受到的直接攻击伤害降低12%；燃烧、中毒和事件扣血不受影响。
  - id: RKF04-J3-C
    tier: 3
    branch: C
    name: 烈焰追身
    quick: 普攻怒技多叠燃烧
    category: enhance
    effects:
      - id: RKF04-J3-C-BURN-STACK
        trigger: action_end
        operation: modify_effect
        target: enemy
        params:
          mode: add_input
          effect_ids: [RKF04-BASIC-BURN, RKF04-RAGE-BURN]
          stacks_add: 1
          status: burn
          obey_max_stacks: true
          no_refresh_old_layers: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技施加燃烧时，额外增加1层；仍受燃烧层数上限限制，不会刷新已有燃烧或重复触发此效果。
  - id: RKF04-J4-A
    tier: 4
    branch: A
    name: 焚天火脉
    quick: 怒技变为两段火伤
    category: enhance
    effects:
      - id: RKF04-J4-A-RAGE-SEGMENTS
        trigger: rage_action
        operation: modify_effect
        target: self
        params:
          mode: replace_segments
          effect_id: RKF04-RAGE-DAMAGE
          segments: 2
          attack_ratio_per_segment: 0.88
          can_crit: true
          total_ratio: 1.76
          burn_effect_unchanged: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 炎心爆发改为同一次怒技内造成两段火焰伤害，每段为攻击的0.88倍且可暴击；两段仍只算一次行动，燃烧只施加一次。
  - id: RKF04-J4-B
    tier: 4
    branch: B
    name: 火种不灭
    quick: 燃烧持续大幅延长
    category: enhance
    effects:
      - id: RKF04-J4-B-BURN-DURATION
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: add_input
          status: burn
          duration_rounds_add: 2
          method_burn_only: true
          refresh_old_layers: false
          tick_order: public_rule
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 御火诀新施加的燃烧持续时间再增加2轮；已施加的燃烧不会延长，每层仍分别结算和消失。
  - id: RKF04-J4-C
    tier: 4
    branch: C
    name: 赤焰成盾
    quick: 燃烧伤害转护盾
    category: convert
    effects:
      - id: RKF04-J4-C-SHIELD
        trigger: dot_resolved
        operation: shield
        target: self
        params:
          status: burn
          source: actual_burn_damage
          actual_damage_ratio: 0.30
          read_only: true
          consume_burn: false
          cap_ratio: 1
          no_recursive_dot: true
        requires: [positive_actual_burn_damage]
        consumes: []
        replaces: []
        limit: {scope: round, count: 1}
        text: 御火诀施加的燃烧每轮造成伤害后，获得相当于该次伤害30%的护盾；燃烧不会因此消失。
routes:
  - name: 长燃不灭
    summary: 提高燃烧层数和持续时间，以持续伤害压制敌人；代价是战斗过短时，尚未结算的燃烧伤害不会计入输出。
    talents: [RKF04-J1-A, RKF04-J2-A, RKF04-J3-B, RKF04-J4-B]
  - name: 耗火爆燃
    summary: 以怒技消耗已有燃烧换取额外伤害，并强化怒技本身；代价是被消耗的燃烧不再造成后续伤害。
    talents: [RKF04-J1-B, RKF04-J2-C, RKF04-J3-A, RKF04-J4-A]
  - name: 火盾护身
    summary: 普攻先获得护盾，敌人带有燃烧时降低所受直接伤害，并在燃烧造成伤害后获得护盾；代价是燃烧没有造成伤害时，无法触发燃烧转护盾。
    talents: [RKF04-J1-C, RKF04-J2-B, RKF04-J3-C, RKF04-J4-C]
