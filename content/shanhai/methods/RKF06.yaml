schema_version: 1
content_version: shanhai-content-0.1
kind: method
id: RKF06
name: 五毒经
status: design_target
summary: 叠加中毒并以毒压制敌手的持续战斗功法。
description: 普攻与怒技造成直接伤害并施加中毒；天赋可强化毒伤、削弱敌方或增强续战能力。
tags: [method, rare, poison, original]
source:
  basis: original
  reference: null
  note: 游戏原创功法与能力，不声称古籍存在这些战斗效果。
balance:
  target:
    P_by_tier: [110, 137.5, 165, 192.5, 220]
    D: 104.5
    L: 95
    H: 100
    P: 110
  measured: null
rarity: rare
role: 毒师
stat_focus: [attack, max_hp]
mechanic: null
acquisition:
  start: false
  pools: [method_rare]
actions:
  basic:
    name: 蚀骨引毒
    quick: 一击并叠一层中毒
    effects:
      - id: RKF06-BASIC-DAMAGE
        trigger: basic_action
        operation: damage
        target: enemy
        params: {attack_ratio: 0.9, segments: 1, can_crit: true, damage_kind: direct}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 按攻击的0.90倍造成一段可暴击直接伤害。
      - id: RKF06-BASIC-POISON
        trigger: basic_hit
        operation: apply_status
        target: enemy
        params: {status: poison, stacks: 1, duration_rounds: 3, max_stacks: 10, refresh: false, snapshot: true, attack_ratio_per_stack: 0.08, ignores_defense: true, hits_shield: true, only_if_damage_actual: true}
        requires: [effective_basic_base_hit]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻命中后施加1层中毒；每层伤害按施加时的攻击计算，并在每轮结束时结算。
  rage:
    name: 五毒蚀心
    quick: 重击并叠两层中毒
    effects:
      - id: RKF06-RAGE-DAMAGE
        trigger: rage_action
        operation: damage
        target: enemy
        params: {attack_ratio: 1.3, segments: 1, can_crit: true, damage_kind: direct, rage_cost: locked_action_cost}
        requires: []
        consumes: [rage_locked_action_cost]
        replaces: []
        limit: {scope: action, count: 1}
        text: 按攻击的1.30倍造成一段可暴击直接伤害；怒技不会获得普攻的基础回怒。
      - id: RKF06-RAGE-POISON
        trigger: rage_action
        operation: apply_status
        target: enemy
        params: {status: poison, stacks: 2, duration_rounds: 3, max_stacks: 10, refresh: false, snapshot: true, attack_ratio_per_stack: 0.08, ignores_defense: true, hits_shield: true, after_effect: RKF06-RAGE-DAMAGE}
        requires: [RKF06-RAGE-DAMAGE]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技命中后施加2层中毒；已有的中毒层不会因此消失。
passives:
  - id: RKF06-PASSIVE-TOXIN-RESIST
    trigger: battle_start
    operation: modify_stat
    target: self
    params: {stat: defense, mode: add, amount: 8, duration: battle, snapshot: battle_start}
    requires: []
    consumes: []
    replaces: []
    limit: {scope: battle, count: 1}
    text: 每场战斗开始时防御提高8。
travel:
  - id: RKF06-TRAVEL-XP
    trigger: node_complete
    operation: grant_resource
    target: run
    params: {resource: xp, amount: 6, basis: flat, only_if_alive: true}
    requires: [real_node_completed_alive]
    consumes: []
    replaces: []
    limit: {scope: node, count: 1}
    text: 选择五毒经为主修，存活完成节点后额外获得6点修为。
  - id: RKF06-TRAVEL-COST
    trigger: event_cost_paid
    operation: reduce_event_cost
    target: run
    params: {resource: hp, mode: multiply, multiplier: 0.85, max_reduction_ratio: 0.08, timing: before_payment, active_event_cost: true, one_cost_per_event: true}
    requires: [active_hp_event_cost_paid]
    consumes: []
    replaces: []
    limit: {scope: node, count: 1}
    text: 主动选择扣除气血的行旅选项时，该事件首次气血代价降低15%；最多减免：第1幕50点、第2幕62点、第3幕76点、第4幕92点。
talents:
  - id: RKF06-J1-A
    tier: 1
    branch: A
    name: 百毒入脉
    quick: 基础动作多叠一层毒
    category: enhance
    effects:
      - id: RKF06-J1-A-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF06-BASIC-POISON, RKF06-RAGE-POISON], field: params.stacks, mode: add, value: 1}
        requires: [RKF06-BASIC-POISON, RKF06-RAGE-POISON]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 普攻和怒技各自施加的中毒层数增加1；中毒仍最多叠加10层。
  - id: RKF06-J1-B
    tier: 1
    branch: B
    name: 毒伤蚀心
    quick: 中毒每层伤害提高
    category: enhance
    effects:
      - id: RKF06-J1-B-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF06-BASIC-POISON, RKF06-RAGE-POISON], field: params.attack_ratio_per_stack, mode: add, value: 0.02}
        requires: [RKF06-BASIC-POISON, RKF06-RAGE-POISON]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 五毒经施加的每层中毒伤害增加攻击0.02倍；只提高持续毒伤。
  - id: RKF06-J1-C
    tier: 1
    branch: C
    name: 毒息延绵
    quick: 中毒持续多一轮
    category: cycle
    effects:
      - id: RKF06-J1-C-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF06-BASIC-POISON, RKF06-RAGE-POISON], field: params.duration_rounds, mode: add, value: 1}
        requires: [RKF06-BASIC-POISON, RKF06-RAGE-POISON]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 五毒经新施加的每层中毒多持续1轮；每层中毒分别结算伤害和消失。
  - id: RKF06-J2-A
    tier: 2
    branch: A
    name: 腐骨穿脉
    quick: 普攻怒技直接伤害提高
    category: enhance
    effects:
      - id: RKF06-J2-A-BASIC
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF06-BASIC-DAMAGE], field: params.attack_ratio, mode: add, value: 0.1}
        requires: [RKF06-BASIC-DAMAGE]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 五毒经普攻直接伤害提高攻击的0.10倍。
      - id: RKF06-J2-A-RAGE
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF06-RAGE-DAMAGE], field: params.attack_ratio, mode: add, value: 0.1}
        requires: [RKF06-RAGE-DAMAGE]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 五毒经怒技直接伤害提高攻击的0.10倍。
  - id: RKF06-J2-B
    tier: 2
    branch: B
    name: 五毒缠身
    quick: 中毒敌人再施虚弱
    category: enhance
    effects:
      - id: RKF06-J2-B-WEAKNESS
        trigger: direct_hit
        operation: apply_status
        target: enemy
        params: {status: weakness, stacks: 1, duration_rounds: 2, max_stacks: 5, refresh: false, condition: {enemy_status: poison, min_stacks: 1}, only_once_per_action: true}
        requires: [enemy_has_poison]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技命中中毒的敌方时，额外施加1层虚弱；不因中毒层数增加而重复施加。
  - id: RKF06-J2-C
    tier: 2
    branch: C
    name: 毒雾护体
    quick: 毒敌在场时造盾
    category: enhance
    effects:
      - id: RKF06-J2-C-SHIELD
        trigger: action_end
        operation: shield
        target: self
        params: {defense_ratio: 0.24, condition: {enemy_status: poison, min_stacks: 1}, max_per_action: 1}
        requires: [enemy_has_poison]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技结束时，若敌方仍有中毒，获得防御0.24倍的护盾。
  - id: RKF06-J3-A
    tier: 3
    branch: A
    name: 毒潮翻涌
    quick: 怒技再叠两层毒
    category: enhance
    effects:
      - id: RKF06-J3-A-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF06-RAGE-POISON], field: params.stacks, mode: add, value: 2}
        requires: [RKF06-RAGE-POISON]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 五毒经怒技施加的中毒层数增加2；不会额外增加行动或普攻回怒。
  - id: RKF06-J3-B
    tier: 3
    branch: B
    name: 蚀骨减攻
    quick: 毒敌额外施加虚弱
    category: enhance
    effects:
      - id: RKF06-J3-B-WEAKNESS
        trigger: direct_hit
        operation: apply_status
        target: enemy
        params: {status: weakness, stacks: 1, duration_rounds: 2, max_stacks: 5, refresh: false, condition: {enemy_status: poison, min_stacks: 1}, only_once_per_action: true}
        requires: [enemy_has_poison]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技命中中毒的敌方时，额外施加1层虚弱；虚弱最多叠加5层。
  - id: RKF06-J3-C
    tier: 3
    branch: C
    name: 吞毒回元
    quick: 消耗毒层治疗自身
    category: convert
    effects:
      - id: RKF06-J3-C-CONSUME
        trigger: direct_hit
        operation: consume_status
        target: enemy
        params: {status: poison, max_stacks: 2, consume_once_per_action: true, preexisting_only: true, record_key: rkf06_consumed_poison, consume_key: poison_up_to_2_stacks, outlet_group: poison_to_survival}
        requires: [poison_available]
        consumes: [poison_up_to_2_stacks]
        replaces: []
        limit: {scope: action, count: 1}
        text: 每次普攻或怒技最多消耗敌方已有的2层中毒；行动中新增的中毒不会被这次消耗。
      - id: RKF06-J3-C-HEAL
        trigger: direct_hit
        operation: heal
        target: self
        params: {basis: max_hp, source: consumed_status, record_key: rkf06_consumed_poison, amount_per_stack: 0.05, max_amount_ratio: 0.1, effective_only: true}
        requires: [RKF06-J3-C-CONSUME]
        consumes: [RKF06-J3-C-CONSUME]
        replaces: []
        limit: {scope: action, count: 1}
        text: 每消耗1层中毒，恢复最大气血5%的气血；超过气血上限的部分不触发其他效果。
  - id: RKF06-J4-A
    tier: 4
    branch: A
    name: 万毒归宗
    quick: 中毒持续伤害再提高
    category: enhance
    effects:
      - id: RKF06-J4-A-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF06-BASIC-POISON, RKF06-RAGE-POISON], field: params.attack_ratio_per_stack, mode: add, value: 0.04}
        requires: [RKF06-BASIC-POISON, RKF06-RAGE-POISON]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 五毒经施加的每层中毒伤害再增加攻击0.04倍。
  - id: RKF06-J4-B
    tier: 4
    branch: B
    name: 毒海封生
    quick: 毒敌额外破甲
    category: enhance
    effects:
      - id: RKF06-J4-B-ARMOR
        trigger: direct_hit
        operation: apply_status
        target: enemy
        params: {status: armor_break, stacks: 1, duration_rounds: 2, max_stacks: 5, refresh: false, condition: {enemy_status: poison, min_stacks: 1}, only_once_per_action: true}
        requires: [enemy_has_poison]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技命中中毒的敌方时，额外施加1层破甲；破甲会降低敌方受到后续直接攻击时的防御。
  - id: RKF06-J4-C
    tier: 4
    branch: C
    name: 毒尽护生
    quick: 毒敌在场时护盾更厚
    category: enhance
    effects:
      - id: RKF06-J4-C-SHIELD
        trigger: action_end
        operation: shield
        target: self
        params: {defense_ratio: 0.28, max_hp_ratio: 0.04, condition: {enemy_status: poison, min_stacks: 1}, max_per_action: 1}
        requires: [enemy_has_poison]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技结束时，若敌方带有中毒，获得防御0.28倍加最大气血0.04倍的护盾。
routes:
  - name: 叠毒蚀骨
    summary: 迅速堆高毒层并提高每层中毒伤害；代价是需要时间让中毒反复造成伤害。
    talents: [RKF06-J1-A, RKF06-J2-A, RKF06-J3-A, RKF06-J4-A]
  - name: 毒压减攻
    summary: 以虚弱和破甲压低敌人有效输出并保持直接段压力；代价是必须先让敌人带毒，短战覆盖较低。
    talents: [RKF06-J1-B, RKF06-J2-B, RKF06-J3-B, RKF06-J4-B]
  - name: 耗毒续命
    summary: 用毒层换取治疗与护盾，适合较长战斗中的主动续战；代价是消费毒层会降低后续持续伤害。
    talents: [RKF06-J1-C, RKF06-J2-C, RKF06-J3-C, RKF06-J4-C]
