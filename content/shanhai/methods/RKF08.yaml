schema_version: 1
content_version: shanhai-content-0.2
kind: method
id: RKF08
name: 太阴经
status: design_target
summary: 以虚弱、破甲和已有毒火引动月印，压制敌方节奏的阴咒功法。
description: 普攻施加虚弱，怒技施加破甲；每次主动作结束时，敌方身上的中毒、燃烧、虚弱与破甲各可引动一枚月印，造成派生伤害并请求削怒。天赋另可强化压制、负面转伤或耗弱成盾。
tags: [method, rare, curse, original]
source:
  basis: original
  reference: null
  note: 游戏原创阴咒能力，不声称古籍存在这些战斗效果。
balance:
  target:
    P_by_tier: [110, 137.5, 165, 192.5, 220]
    D: 99
    L: 90
    H: 100
    P: 110
  measured: null
rarity: rare
role: 咒师
stat_focus: [attack, defense]
mechanic: null
acquisition:
  start: false
  pools: [method_rare]
companion:
  name: 月影咒灵
  quick: 主修功法的主动作实际施加虚弱或破甲后，追加攻击0.24倍的不可暴击派生阴伤
  trigger: debuff
  effect: {kind: damage, value: 0.24}
  pair_bonuses: []
actions:
  basic:
    name: 幽月蚀心
    quick: 直接阴伤并施加虚弱
    effects:
      - id: RKF08-BASIC-DAMAGE
        trigger: basic_action
        operation: damage
        target: enemy
        params: {attack_ratio: 0.9, segments: 1, can_crit: true, damage_kind: direct}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 按攻击的0.90倍造成一段可暴击直接阴伤。
      - id: RKF08-BASIC-WEAKNESS
        trigger: basic_hit
        operation: apply_status
        target: enemy
        params: {status: weakness, stacks: 1, duration_rounds: 2, max_stacks: 5, refresh: false, only_if_damage_actual: true}
        requires: [effective_basic_base_hit]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻命中后施加1层虚弱，降低敌方后续攻击的伤害。
  rage:
    name: 太阴破妄
    quick: 重击并施加破甲
    effects:
      - id: RKF08-RAGE-DAMAGE
        trigger: rage_action
        operation: damage
        target: enemy
        params: {attack_ratio: 1.3, segments: 1, can_crit: true, damage_kind: direct, rage_cost: locked_action_cost}
        requires: []
        consumes: [rage_locked_action_cost]
        replaces: []
        limit: {scope: action, count: 1}
        text: 按攻击的1.30倍造成一段可暴击直接阴伤；怒技不会获得普攻的基础回怒。
      - id: RKF08-RAGE-ARMOR
        trigger: rage_action
        operation: apply_status
        target: enemy
        params: {status: armor_break, stacks: 2, duration_rounds: 2, max_stacks: 5, refresh: false, after_effect: RKF08-RAGE-DAMAGE}
        requires: [RKF08-RAGE-DAMAGE]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技命中后施加2层破甲，降低敌方受到后续直接攻击时的防御；破甲本身不造成伤害。
passives:
  - id: RKF08-PASSIVE-MOON-GUARD
    trigger: battle_start
    operation: modify_stat
    target: self
    params: {stat: defense, mode: add, amount: 8, duration: battle, snapshot: battle_start}
    requires: []
    consumes: []
    replaces: []
    limit: {scope: battle, count: 1}
    text: 每场战斗开始时防御提高8。
  - id: RKF08-V2-RESONANCE
    trigger: always
    operation: modify_effect
    target: self
    params: {resonance: moon_hex, attack_ratio: 0.2, drain_per_kind: 2}
    requires: []
    consumes: []
    replaces: []
    limit: {scope: permanent, count: 1}
    text: 每次完成主动作时，对敌方当前存活的中毒、燃烧、虚弱、破甲每种不同减益各放出一枚攻击0.2倍的派生月印，并为每种登记2点怒气削减请求；最多四种，不消费或刷新减益。削怒仍受公共抗性、向下取整和每目标每轮上限约束。
travel:
  - id: RKF08-TRAVEL-REFUND
    trigger: event_cost_paid
    operation: grant_resource
    target: self
    params: {resource: hp, amount: 0.08, basis: reference_hp, refund_cap: actual_paid_hp, active_event_cost: true, condition: {event_cost_resource: hp, player_survived: true}, timing: after_payment}
    requires: [active_hp_event_cost_paid_and_survived]
    consumes: []
    replaces: []
    limit: {scope: node, count: 1}
    text: 主动支付气血代价后若仍存活，返还实际扣除量与本幕上限中较低者；返还上限为第1幕50点、第2幕62点、第3幕76点、第4幕92点。死亡时不返还气血，也不产生怒气。
talents:
  - id: RKF08-J1-A
    tier: 1
    branch: A
    name: 月蚀初临
    quick: 普攻多施一层虚弱
    category: enhance
    effects:
      - id: RKF08-J1-A-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF08-BASIC-WEAKNESS], field: params.stacks, mode: add, value: 1}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 太阴经普攻施加的虚弱层数增加1；虚弱仍最多叠加5层。
  - id: RKF08-J1-B
    tier: 1
    branch: B
    name: 阴锋凝神
    quick: 怒技直接伤害提高
    category: enhance
    effects:
      - id: RKF08-J1-B-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF08-RAGE-DAMAGE], field: params.attack_ratio, mode: add, value: 0.15}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 太阴经怒技直接伤害提高攻击的0.15倍。
  - id: RKF08-J1-C
    tier: 1
    branch: C
    name: 太阴敛息
    quick: 命中减益敌人额外回怒
    category: cycle
    effects:
      - id: RKF08-J1-C-RAGE
        trigger: action_end
        operation: rage_gain
        target: self
        params: {amount: 8, source: talent, condition: {enemy_has_actual_debuff: true}, once_per_action: true, additive_to_public_sources: true, record_at: round_end, no_extra_action: true}
        requires: [enemy_has_actual_debuff]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技结束时，若敌方仍处于虚弱或破甲状态，额外获得8点怒气。
  - id: RKF08-J2-A
    tier: 2
    branch: A
    name: 摄气封脉
    quick: 普攻削减敌怒十点
    category: cycle
    effects:
      - id: RKF08-J2-A-DRAIN
        trigger: basic_hit
        operation: rage_drain
        target: enemy
        params: {amount: 10, stage: register_request, source: basic_hit, first_basic_segment: true, public_resistance: true, round_target_cap: 20, does_not_cancel_locked_action: true}
        requires: [effective_basic_base_hit]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻的第一段基础攻击命中后，使敌方本轮怒气减少10点；削怒会受敌方抗性影响并向下取整，来自我方的削怒每轮最多减少20点。不会改变敌方本轮已经选定的行动。
  - id: RKF08-J2-B
    tier: 2
    branch: B
    name: 阴蚀入骨
    quick: 减益目标受到本门增伤
    category: enhance
    effects:
      - id: RKF08-J2-B-BASIC
        trigger: basic_action
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF08-BASIC-DAMAGE], field: params.attack_ratio, mode: add, value: 0.18, condition: {enemy_has_actual_debuff: true}}
        requires: [enemy_has_actual_debuff]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻开始时，若敌方处于虚弱或破甲状态，本次普攻直接伤害提高攻击的0.18倍；两种状态同时存在时不重复叠加。
      - id: RKF08-J2-B-RAGE
        trigger: rage_action
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF08-RAGE-DAMAGE], field: params.attack_ratio, mode: add, value: 0.18, condition: {enemy_has_actual_debuff: true}}
        requires: [enemy_has_actual_debuff]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技开始时，若敌方处于虚弱或破甲状态，本次怒技直接伤害提高攻击的0.18倍；两种状态同时存在时不重复叠加。
  - id: RKF08-J2-C
    tier: 2
    branch: C
    name: 月华护体
    quick: 怒技结束按防御造盾
    category: enhance
    effects:
      - id: RKF08-J2-C-SHIELD
        trigger: rage_action
        operation: shield
        target: self
        params: {defense_ratio: 0.35, after_effect: RKF08-RAGE-DAMAGE, preserves_armor_break: true}
        requires: [RKF08-RAGE-DAMAGE]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技造成伤害并施加破甲后，获得防御0.35倍的护盾。
  - id: RKF08-J3-A
    tier: 3
    branch: A
    name: 寒月锁魄
    quick: 减益敌人再削怒八点
    category: cycle
    effects:
      - id: RKF08-J3-A-DRAIN
        trigger: action_end
        operation: rage_drain
        target: enemy
        params: {amount: 8, stage: register_request, condition: {enemy_has_actual_debuff: true}, public_resistance: true, round_target_cap: 20, does_not_cancel_locked_action: true}
        requires: [enemy_has_actual_debuff]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技结束时，若敌方仍处于虚弱或破甲状态，使其本轮怒气减少8点；削怒受每轮20点上限和敌方抗性影响。
  - id: RKF08-J3-B
    tier: 3
    branch: B
    name: 负面转锋
    quick: 实际施加减益后补直接伤害
    category: convert
    effects:
      - id: RKF08-J3-B-DAMAGE
        trigger: direct_hit
        operation: damage
        target: enemy
        params: {attack_ratio: 0.28, segments: 1, can_crit: false, damage_kind: derived, condition: {actual_debuff_applied_this_action: true}, once_per_action: true, recursive: false}
        requires: [actual_debuff_applied_this_action]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技实际施加虚弱或破甲后，追加一段攻击0.28倍的伤害；追加伤害不会再次触发此效果。
  - id: RKF08-J3-C
    tier: 3
    branch: C
    name: 幽月成盾
    quick: 命中减益敌人后造盾
    category: enhance
    effects:
      - id: RKF08-J3-C-SHIELD
        trigger: action_end
        operation: shield
        target: self
        params: {defense_ratio: 0.24, condition: {enemy_has_actual_debuff: true}, max_per_action: 1}
        requires: [enemy_has_actual_debuff]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技命中处于虚弱或破甲状态的敌方后，获得防御0.24倍的护盾。
  - id: RKF08-J4-A
    tier: 4
    branch: A
    name: 破甲追命
    quick: 破甲敌人受到怒技增伤
    category: enhance
    effects:
      - id: RKF08-J4-A-MODIFY
        trigger: rage_action
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF08-RAGE-DAMAGE], field: params.attack_ratio, mode: add, value: 0.28, condition: {enemy_status: armor_break, min_stacks: 1}}
        requires: [enemy_has_armor_break]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技开始时若敌方至少有1层破甲，本次怒技直接伤害提高攻击的0.28倍。
  - id: RKF08-J4-B
    tier: 4
    branch: B
    name: 削怒回元
    quick: 破甲敌人命中后回怒
    category: cycle
    effects:
      - id: RKF08-J4-B-RAGE
        trigger: direct_hit
        operation: rage_gain
        target: self
        params: {amount: 10, source: talent, condition: {enemy_status: armor_break, min_stacks: 1}, once_per_action: true, additive_to_public_sources: true, record_at: round_end, no_extra_action: true}
        requires: [enemy_has_armor_break]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技命中处于破甲状态的敌方后，额外获得10点怒气；每次行动最多触发一次。
  - id: RKF08-J4-C
    tier: 4
    branch: C
    name: 月沉无伤
    quick: 减益敌人时提高防御
    category: enhance
    effects:
      - id: RKF08-J4-C-DEFENSE
        trigger: always
        operation: modify_stat
        target: self
        params: {stat: defense, mode: add, amount: 12, duration: conditional_battle, condition: {enemy_has_actual_debuff: true}, dynamic: true}
        requires: [enemy_has_actual_debuff]
        consumes: []
        replaces: []
        limit: {scope: battle, count: 1}
        text: 敌方处于虚弱或破甲状态时，防御提高12；两种状态都消失后，加成也会消失。
routes:
  - name: 寒月压制
    summary: 以普攻压制并让每种不同减益引动月印和削怒请求；代价是削怒受公共抗性和每轮上限约束。
    talents: [RKF08-J1-A, RKF08-J2-A, RKF08-J3-A, RKF08-J4-B]
  - name: 负面转伤
    summary: 让虚弱和破甲的实际覆盖转成额外直接段，并引动不同减益对应的月印；代价是缺少实际减益时增伤与月印都会减少。
    talents: [RKF08-J1-B, RKF08-J2-B, RKF08-J3-B, RKF08-J4-A]
  - name: 耗弱成盾
    summary: 以虚弱和破甲换取护盾和防御加成，并让敌方不同减益引动月印；代价是状态消失后对应收益也会减少。
    talents: [RKF08-J1-C, RKF08-J2-C, RKF08-J3-C, RKF08-J4-C]
