schema_version: 1
content_version: shanhai-content-0.1
kind: method
id: RKF01
name: 金刚功
status: design_target
summary: 以防御造盾、承伤反击并把护盾转为攻势的护法功法。
description: 金刚功以普攻和怒技攻击敌方，并按防御获得护盾；护盾能反击敌方攻击，天赋可强化护盾、怒技或反击。
tags: [method, common, defense, shield, direct]
source:
  basis: original
  reference: null
  note: 游戏原创功法；职业定位、效果和数值均为首测设计输入，不声称古籍出处或已平衡。
balance:
  target:
    D: 90
    L: 90
    H: 100
    P: 100
    P_by_tier: [100, 125, 150, 175, 200]
  measured: null
rarity: common
role: 护法
stat_focus:
  primary: defense
  secondary: [attack, max_hp]
  damage_from: attack
  shield_from: defense
  shield_bonus_from: max_hp
mechanic: null
acquisition:
  start: true
  pools: [method_common]
actions:
  basic:
    name: 金刚镇岳
    quick: 攻击并按防御造盾
    effects:
      - id: RKF01-BASIC-DAMAGE
        trigger: basic_action
        operation: damage
        target: enemy
        params:
          attack_ratio: 0.95
          segments: 1
          can_crit: true
          damage_kind: direct
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 按攻击的0.95倍对敌方造成一段可暴击直接伤害。
      - id: RKF01-BASIC-SHIELD
        trigger: action_end
        operation: shield
        target: self
        params:
          action: basic_action
          defense_ratio: 0.42
          max_hp_ratio: 0
          cap_ratio: 1
          timing: after_damage
          source: defense
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻完成后获得相当于防御0.42倍的护盾。
  rage:
    name: 撼岳怒印
    quick: 怒技攻击并按防御造盾
    effects:
      - id: RKF01-RAGE-DAMAGE
        trigger: rage_action
        operation: damage
        target: enemy
        params:
          attack_ratio: 1.35
          segments: 1
          can_crit: true
          damage_kind: direct
          rage_cost: locked_action_cost
        requires: []
        consumes: [rage_locked_action_cost]
        replaces: []
        limit: {scope: action, count: 1}
        text: 消耗本次怒技所需的怒气后，按攻击的1.35倍对敌方造成一段可暴击直接伤害。
      - id: RKF01-RAGE-SHIELD
        trigger: action_end
        operation: shield
        target: self
        params:
          action: rage_action
          defense_ratio: 0.55
          max_hp_ratio: 0
          cap_ratio: 1
          timing: after_damage
          source: defense
          consumes_existing_shield: false
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技完成后获得相当于防御0.55倍的护盾，不消耗已有护盾。
passives:
  - id: RKF01-PASSIVE-RECOIL
    trigger: shield_absorbed
    operation: damage
    target: enemy
    params:
      defense_ratio: 0.38
      segments: 1
      can_crit: false
      damage_kind: derived
      trigger_when: positive_direct_damage_absorbed
      max_per_enemy_action: 1
      excludes: [dot, reflection, self_damage, event_damage]
      no_reentry: true
    requires: []
    consumes: []
    replaces: []
    limit: {scope: action, count: 1}
    text: 护盾吸收敌方主动直接攻击时，反击造成防御0.38倍的伤害；每次敌方行动最多触发一次，反击不会再次触发此效果。
travel:
  - id: RKF01-TRAVEL-XP
    trigger: rest_complete
    operation: grant_resource
    target: run
    params:
      resource: xp
      amount: 24
      basis: flat
      once_per_node: true
      combat_trigger: false
    requires: [real_rest_completed_alive]
    consumes: []
    replaces: []
    limit: {scope: node, count: 1}
    text: 完成休整节点后额外获得24点修为，每个休整节点只触发一次。
  - id: RKF01-TRAVEL-SHIELD
    trigger: rest_complete
    operation: prepare_next_battle
    target: run
    params:
      preparation: shield
      amount: 0.12
      basis: reference_hp
      expires: next_battle
      once_per_node: true
      combat_trigger: false
    requires: [real_rest_completed]
    consumes: []
    replaces: []
    limit: {scope: node, count: 1}
    text: 完成休整后，为下一场战斗准备护盾；第1幕75点、第2幕93点、第3幕114点、第4幕138点，仅在下一场战斗生效。
talents:
  - id: RKF01-J1-A
    tier: 1
    branch: A
    name: 金刚厚壁
    quick: 普攻怒技加盾
    category: enhance
    effects:
      - id: RKF01-J1-A-SHIELD
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: add_ratio
          effect_ids: [RKF01-BASIC-SHIELD, RKF01-RAGE-SHIELD]
          shield_ratio_add: 0.18
          applies_to: shield_generated
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 普攻和怒技获得的护盾量各提高18%，可与其他护盾加成叠加。
  - id: RKF01-J1-B
    tier: 1
    branch: B
    name: 镇岳回气
    quick: 普攻积怒加快
    category: cycle
    effects:
      - id: RKF01-J1-B-RAGE
        trigger: action_end
        operation: rage_gain
        target: self
        params:
          action: basic_action
          amount: 10
          base_public_gain: 25
          action_must_complete: true
          record_at: round_end
          no_extra_action: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 每次普攻完成后，除普攻原有的25点回怒外，再获得10点怒气；即使没有命中也会触发。
  - id: RKF01-J1-C
    tier: 1
    branch: C
    name: 降魔劲骨
    quick: 普攻伤害提高
    category: enhance
    effects:
      - id: RKF01-J1-C-DAMAGE
        trigger: basic_action
        operation: modify_effect
        target: self
        params:
          mode: add_ratio
          effect_id: RKF01-BASIC-DAMAGE
          damage_ratio_add: 0.16
          damage_scope: base_direct_segment
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 金刚镇岳的直接伤害提高16%；不提高盾返、燃烧或其他追加伤害。
  - id: RKF01-J2-A
    tier: 2
    branch: A
    name: 玄甲承锋
    quick: 持盾时加防
    category: enhance
    effects:
      - id: RKF01-J2-A-DEFENSE
        trigger: always
        operation: modify_stat
        target: self
        params:
          stat: defense
          mode: percent_add
          amount: 0.14
          condition: shield_present
          reads_before_hit: true
        requires: [shield_present]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 持有护盾时防御提高14%，失去护盾后此加成消失。
  - id: RKF01-J2-B
    tier: 2
    branch: B
    name: 怒印裂阵
    quick: 怒技伤害提高
    category: enhance
    effects:
      - id: RKF01-J2-B-RAGE-DAMAGE
        trigger: rage_action
        operation: modify_effect
        target: self
        params:
          mode: add_ratio
          effect_id: RKF01-RAGE-DAMAGE
          damage_ratio_add: 0.22
          damage_scope: base_direct_segment
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 撼岳怒印的直接伤害提高22%；不提高怒技获得的护盾或盾返伤害。
  - id: RKF01-J2-C
    tier: 2
    branch: C
    name: 法相护体
    quick: 气血越高盾越厚
    category: enhance
    effects:
      - id: RKF01-J2-C-BASIC-HP-SHIELD
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: add_input
          effect_id: RKF01-BASIC-SHIELD
          max_hp_ratio_add: 0.12
          preserve_defense_input: true
          source: max_hp
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 金刚镇岳获得的护盾额外增加最大气血的12%；按防御计算的护盾仍保留。
      - id: RKF01-J2-C-RAGE-HP-SHIELD
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: add_input
          effect_id: RKF01-RAGE-SHIELD
          max_hp_ratio_add: 0.12
          preserve_defense_input: true
          source: max_hp
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 撼岳怒印获得的护盾额外增加最大气血的12%；按防御计算的护盾仍保留。选择盾转破阵后，此项对怒技不再生效。
  - id: RKF01-J3-A
    tier: 3
    branch: A
    name: 反震定势
    quick: 盾返伤害提高
    category: enhance
    effects:
      - id: RKF01-J3-A-RECOIL
        trigger: shield_absorbed
        operation: modify_effect
        target: self
        params:
          mode: add_ratio
          effect_id: RKF01-PASSIVE-RECOIL
          damage_ratio_add: 0.28
          preserve_trigger_limit: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 护体反震的伤害提高28%，每次敌方行动仍最多触发一次。
  - id: RKF01-J3-B
    tier: 3
    branch: B
    name: 僧衣续护
    quick: 首次破盾补盾
    category: enhance
    effects:
      - id: RKF01-J3-B-RECHARGE
        trigger: shield_broken
        operation: shield
        target: self
        params:
          max_hp_ratio: 0.24
          defense_ratio: 0
          condition: first_direct_break_per_battle
          requires_alive: true
          active_shield_consumption_triggers: false
          self_reentry: false
        requires: [first_direct_break_alive]
        consumes: []
        replaces: []
        limit: {scope: battle, count: 1}
        text: 每场战斗首次被敌方直接攻击打破护盾且自身仍存活时，获得最大气血24%的护盾；主动消耗护盾不触发。
  - id: RKF01-J3-C
    tier: 3
    branch: C
    name: 怒后追击
    quick: 怒后强化普攻
    category: cycle
    effects:
      - id: RKF01-J3-C-NEXT-BASIC
        trigger: action_end
        operation: replace_action
        target: self
        params:
          source_action: rage_action
          next_action: basic_action
          force: true
          basic_damage_ratio_add: 0.20
          basic_rage_gain_bonus: 0
          clear_after_use: true
          no_extra_action: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技完成后，下一轮必须先使用一次强化普攻，直接伤害提高20%；这次普攻仍只算一次行动，基础回怒仍为25点。
  - id: RKF01-J4-A
    tier: 4
    branch: A
    name: 护法无疆
    quick: 持盾减直接伤害
    category: enhance
    effects:
      - id: RKF01-J4-A-REDUCE
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: incoming_multiplier
          source: enemy_direct
          multiplier: 0.82
          condition: shield_present
          excludes: [burn, poison, event_damage]
          shield_still_absorbs: true
        requires: [shield_present]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 持有护盾时，受到的敌方直接攻击伤害降低18%；燃烧、中毒和事件扣血不受影响，护盾仍照常承受攻击。
  - id: RKF01-J4-B
    tier: 4
    branch: B
    name: 盾转破阵
    quick: 怒技耗盾增伤
    category: convert
    effects:
      - id: RKF01-J4-B-CONSUME-SHIELD
        trigger: rage_action
        operation: replace_action
        target: self
        params:
          mode: replace_generated_shield
          replace_effect_ids: [RKF01-RAGE-SHIELD, RKF01-J2-C-RAGE-HP-SHIELD]
          shield_consume_ratio: 0.75
          extra_damage_per_shield_ratio: 0.50
          preserve_base_rage_damage: true
          no_new_rage_shield: true
          when_no_shield: base_damage_only
          consume_once: true
          consume_key: shield_current_ratio
          outlet_group: shield_to_rage_damage
        requires: [RKF01-RAGE-DAMAGE]
        consumes: [shield_current_ratio]
        replaces: [RKF01-RAGE-SHIELD, RKF01-J2-C-RAGE-HP-SHIELD]
        limit: {scope: action, count: 1}
        text: 取代怒技原有的造盾效果，包括法相护体增加的怒技护盾；法相护体增加的普攻护盾仍生效。怒技开始时若有护盾，先消耗当前护盾的75%，再将所消耗护盾的50%转为额外直接伤害，且不再获得怒技护盾；没有护盾时只造成怒技原有伤害。
  - id: RKF01-J4-C
    tier: 4
    branch: C
    name: 反震转锋
    quick: 攻击也加强盾返
    category: convert
    effects:
      - id: RKF01-J4-C-RECOIL-FORMULA
        trigger: shield_absorbed
        operation: modify_effect
        target: enemy
        params:
          mode: replace
          effect_id: RKF01-PASSIVE-RECOIL
          defense_ratio: 0.38
          attack_ratio: 0.22
          damage_kind: derived
          preserve_existing_recoil_modifiers: true
          max_per_enemy_action: 1
          no_reentry: true
        requires: [RKF01-PASSIVE-RECOIL]
        consumes: []
        replaces: [RKF01-PASSIVE-RECOIL]
        limit: {scope: action, count: 1}
        text: 护体反震改为造成防御0.38倍加攻击0.22倍的伤害，触发条件和次数不变；反震定势与法宝的盾返加成仍各计算一次。
      - id: RKF01-J4-C-ARMOR-BREAK
        trigger: shield_absorbed
        operation: apply_status
        target: enemy
        params:
          status: armor_break
          stacks: 1
          duration_rounds: 2
          max_stacks: 5
          source: RKF01-J4-C-RECOIL-FORMULA
          applies_after_recoil: true
        requires: [RKF01-J4-C-RECOIL-FORMULA]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 护体反震命中敌方后施加1层破甲，持续2轮；此效果不会额外触发一次反震。
routes:
  - name: 护法金刚
    summary: 以防御和护盾维持承伤，持盾时减伤并靠固定盾返反击；代价是失去护盾后，部分加成会暂时失效。
    talents: [RKF01-J1-A, RKF01-J2-A, RKF01-J3-A, RKF01-J4-A]
  - name: 降魔武僧
    summary: 强化普攻和怒技，怒后插入强化普攻，再以攻防并取的盾返施加破甲；代价是防御不足时护盾更薄。
    talents: [RKF01-J1-C, RKF01-J2-B, RKF01-J3-C, RKF01-J4-C]
  - name: 护体法僧
    summary: 用最大气血提高护盾量，破盾后还能补盾，再消耗部分护盾强化怒技；代价是主动消耗护盾会降低后续承伤能力。
    talents: [RKF01-J1-A, RKF01-J2-C, RKF01-J3-B, RKF01-J4-B]
