schema_version: 1
content_version: shanhai-content-0.1
kind: method
id: RKF05
name: 养剑诀
status: design_target
summary: 积累剑势强化剑击，并可消耗剑势追击的剑修功法。
description: 养剑诀以攻击造成剑击伤害，剑势层数可进一步强化普攻和怒技；部分天赋会消耗剑势发动追击。
tags: [method, common, attack, crit_rate, sword_intent]
source:
  basis: original
  reference: null
  note: 游戏原创功法；剑势、追剑和行旅准备均为首测设计输入，不声称已实装或已平衡。
balance:
  target:
    D: 100
    L: 100
    H: 100
    P: 100
    P_by_tier: [100, 125, 150, 175, 200]
  measured: null
rarity: common
role: 剑势斗士
stat_focus:
  primary: attack
  secondary: [crit_rate, defense, max_hp]
  damage_from: attack
  critical_direct_only: true
  survival_from: [defense, max_hp]
mechanic:
  name: 剑势
  max_stacks: 5
  duration: battle
  clear_at: battle_end
  stack_source: basic_action
  note: 剑势是唯一门派专属战斗状态；不占用公共怒气、护盾或治疗资源栏。
acquisition:
  start: true
  pools: [method_common]
actions:
  basic:
    name: 养锋出鞘
    quick: 直接剑击并积一层剑势
    effects:
      - id: RKF05-BASIC-DAMAGE
        trigger: basic_action
        operation: damage
        target: enemy
        params:
          attack_ratio: 1.05
          segments: 1
          can_crit: true
          damage_kind: direct
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 按攻击的1.05倍造成一段可暴击剑击；伤害还会按出手时的剑势层数提高。
      - id: RKF05-BASIC-INTENT
        trigger: action_end
        operation: apply_status
        target: self
        params:
          status: sword_intent
          stacks: 1
          max_stacks: 5
          duration: battle
          source: basic_action
          no_extra_action: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻完成后增加1层剑势，最多5层；普攻仍获得25点基础怒气。
  rage:
    name: 断水养锋
    quick: 怒技剑击并保留剑势
    effects:
      - id: RKF05-RAGE-DAMAGE
        trigger: rage_action
        operation: damage
        target: enemy
        params:
          attack_ratio: 1.50
          segments: 1
          can_crit: true
          damage_kind: direct
          preserve_sword_intent: true
          rage_cost: locked_action_cost
        requires: []
        consumes: [rage_locked_action_cost]
        replaces: []
        limit: {scope: action, count: 1}
        text: 消耗本次怒技所需的怒气后，按攻击的1.50倍造成一段可暴击剑击；怒技不会消耗剑势，伤害仍按出手时的剑势层数提高。
passives:
  - id: RKF05-PASSIVE-EDGE
    trigger: always
    operation: modify_effect
    target: self
    params:
      mode: add_formula
      effect_ids: [RKF05-BASIC-DAMAGE, RKF05-RAGE-DAMAGE]
      sword_intent_ratio_per_stack: 0.04
      applies_to: base_direct_segments
      snapshot: action_start
      no_crit_for_added_ratio: true
    requires: []
    consumes: []
    replaces: []
    limit: {scope: permanent, count: 1}
    text: 普攻和怒技按出手时的剑势层数提高直接伤害，每层增加攻击0.04倍；此加成不影响追剑等追加效果。
travel:
  - id: RKF05-TRAVEL-NEXT-STRIKE
    trigger: node_complete
    operation: prepare_next_battle
    target: run
    params:
      preparation: first_strike
      node_types: [combat, elite, boss, rest, event, shop]
      consecutive_completed_nodes: 2
      attack_ratio: 0.20
      segments: 1
      can_crit: true
      max_preparations: 1
      expires: next_battle
      once_per_node: true
      combat_trigger: false
    requires: [two_consecutive_nodes_completed]
    consumes: []
    replaces: []
    limit: {scope: node, count: 1}
    text: 连续完成2个节点后，为下一场战斗准备一次攻击0.20倍的首击；准备效果只保留一份，并在下一场战斗使用。
talents:
  - id: RKF05-J1-A
    tier: 1
    branch: A
    name: 锋芒初露
    quick: 剑势伤害提高
    category: enhance
    effects:
      - id: RKF05-J1-A-EDGE
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: add_formula
          effect_ids: [RKF05-BASIC-DAMAGE, RKF05-RAGE-DAMAGE]
          sword_intent_ratio_per_stack_add: 0.02
          applies_to: base_direct_segments
          snapshot: action_start
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 普攻和怒技每层剑势带来的直接伤害额外增加攻击0.02倍；不提高追剑等追加攻击的伤害。
  - id: RKF05-J1-B
    tier: 1
    branch: B
    name: 养锋加速
    quick: 普攻多积一层剑势
    category: cycle
    effects:
      - id: RKF05-J1-B-INTENT
        trigger: action_end
        operation: modify_effect
        target: self
        params:
          mode: add_input
          effect_id: RKF05-BASIC-INTENT
          stacks_add: 1
          max_stacks: 5
          source_action: basic_action
          obey_max_stacks: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 每次普攻额外增加1层剑势；普攻完成时最多增加2层，剑势仍最多5层。
  - id: RKF05-J1-C
    tier: 1
    branch: C
    name: 剑气凝神
    quick: 暴击率提高
    category: enhance
    effects:
      - id: RKF05-J1-C-CRIT
        trigger: always
        operation: modify_stat
        target: self
        params:
          stat: crit_rate
          mode: flat_add
          amount: 0.08
          applies_to: direct_attacks_only
          dot_heal_shield_crit: false
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 暴击率提高8个百分点；只影响可暴击的直接剑击，不影响燃烧、中毒、治疗、护盾或反震。
  - id: RKF05-J2-A
    tier: 2
    branch: A
    name: 留势长锋
    quick: 剑势上限并保势
    category: enhance
    effects:
      - id: RKF05-J2-A-RETENTION
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: add_input
          status: sword_intent
          max_stacks_add: 2
          rage_preserves_stacks: true
          max_stacks: 7
          duration: battle
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 剑势上限提高到7层；怒技仍不会消耗剑势。
  - id: RKF05-J2-B
    tier: 2
    branch: B
    name: 剑断连环
    quick: 怒技耗势追击
    category: convert
    effects:
      - id: RKF05-J2-B-CONSUME
        trigger: rage_action
        operation: consume_status
        target: self
        params:
          status: sword_intent
          max_stacks: 3
          damage_per_stack_attack_ratio: 0.28
          damage_kind: derived
          recursive: false
          segments_per_stack: 1
          can_crit: false
          preserve_base_rage_damage: true
          if_no_intent: base_rage_only
          consume_once: true
          consume_key: sword_intent_up_to_3_stacks
          outlet_group: sword_intent_to_followup
        requires: [sword_intent_available]
        consumes: [sword_intent_up_to_3_stacks]
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技完成时最多消耗3层剑势；每消耗1层，追加一次攻击0.28倍且不可暴击的追剑。没有剑势可消耗时，仍照常造成怒技伤害。
  - id: RKF05-J2-C
    tier: 2
    branch: C
    name: 归鞘回气
    quick: 每次出剑额外回怒
    category: cycle
    effects:
      - id: RKF05-J2-C-RAGE
        trigger: action_end
        operation: rage_gain
        target: self
        params:
          action_types: [basic_action, rage_action]
          amount: 5
          once_per_action: true
          record_at: round_end
          source: sword_action
          does_not_consume_sword_intent: true
          no_extra_action: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 每次普攻或怒技完成后额外获得5点怒气；不消耗剑势。
  - id: RKF05-J3-A
    tier: 3
    branch: A
    name: 百炼成锋
    quick: 怒技基础伤害提高
    category: enhance
    effects:
      - id: RKF05-J3-A-RAGE-DAMAGE
        trigger: rage_action
        operation: modify_effect
        target: self
        params:
          mode: add_ratio
          effect_id: RKF05-RAGE-DAMAGE
          damage_ratio_add: 0.20
          damage_scope: base_direct_segment
          excludes: [sword_intent_followup]
        requires: [RKF05-RAGE-DAMAGE]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 断水养锋的直接伤害提高20%；不提高耗势追剑或其他追加攻击。
  - id: RKF05-J3-B
    tier: 3
    branch: B
    name: 剑势护体
    quick: 出剑按剑势造盾
    category: enhance
    effects:
      - id: RKF05-J3-B-SHIELD
        trigger: action_end
        operation: shield
        target: self
        params:
          action_types: [basic_action, rage_action]
          defense_ratio: 0.16
          max_hp_ratio_per_stack: 0.025
          source_status: sword_intent
          snapshot: action_start
          cap_ratio: 1
          no_sword_consumption: true
        requires: [sword_intent_snapshot]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 每次普攻或怒技完成后，获得防御0.16倍加当前每层剑势最大气血0.025倍的护盾；此效果不消耗剑势。
  - id: RKF05-J3-C
    tier: 3
    branch: C
    name: 追锋入骨
    quick: 暴击后追加追剑
    category: enhance
    effects:
      - id: RKF05-J3-C-CRIT-FOLLOWUP
        trigger: direct_crit
        operation: damage
        target: enemy
        params:
          attack_ratio: 0.45
          segments: 1
          can_crit: false
          damage_kind: derived
          source_action_types: [basic_action, rage_action]
          once_per_action: true
          no_reentry: true
        requires: [effective_direct_critical_hit]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技的基础剑击暴击后，追加一次攻击0.45倍且不可暴击的追剑；每次行动最多触发一次，追剑不会再次触发此效果。
  - id: RKF05-J4-A
    tier: 4
    branch: A
    name: 万剑归宗
    quick: 怒技变为两段剑击
    category: enhance
    effects:
      - id: RKF05-J4-A-RAGE-SEGMENTS
        trigger: rage_action
        operation: modify_effect
        target: self
        params:
          mode: replace_segments
          effect_id: RKF05-RAGE-DAMAGE
          segments: 2
          attack_ratio_per_segment: 0.85
          total_ratio: 1.70
          can_crit: true
          sword_intent_formula_unchanged: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 断水养锋改为同一次怒技内造成两段剑击，每段为攻击的0.85倍且可暴击；两段均按出手时的剑势层数计算伤害。
  - id: RKF05-J4-B
    tier: 4
    branch: B
    name: 剑意回潮
    quick: 出剑后额外回怒
    category: cycle
    effects:
      - id: RKF05-J4-B-RAGE
        trigger: action_end
        operation: rage_gain
        target: self
        params:
          action_types: [basic_action, rage_action]
          amount: 6
          once_per_action: true
          record_at: round_end
          source: sword_action
          does_not_consume_sword_intent: true
          no_extra_action: true
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 每次普攻或怒技完成后额外获得6点怒气；可与归鞘回气同时生效，不消耗剑势。
  - id: RKF05-J4-C
    tier: 4
    branch: C
    name: 剑心不灭
    quick: 满层剑势增伤
    category: enhance
    effects:
      - id: RKF05-J4-C-FULL-EDGE
        trigger: always
        operation: modify_effect
        target: self
        params:
          mode: add_ratio
          effect_ids: [RKF05-BASIC-DAMAGE, RKF05-RAGE-DAMAGE]
          damage_ratio_add: 0.25
          condition: sword_intent_at_or_above_5
          damage_scope: base_direct_segments
          excludes: [sword_intent_followup, dot, shield]
        requires: [sword_intent_at_or_above_5]
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 出手时剑势达到5层，普攻和怒技的直接伤害提高25%；不足5层时不触发，也不提高追剑或护盾效果。
routes:
  - name: 留势长锋
    summary: 提高剑势上限并保留层数，以满层直接剑击和剑心增伤取胜；代价是需要连续普攻积累状态。
    talents: [RKF05-J1-A, RKF05-J2-A, RKF05-J3-B, RKF05-J4-C]
  - name: 耗势连击
    summary: 用怒技消费剑势换多次追剑，再以两段怒技放大直接爆发；代价是消费剑势后下一轮基础增伤下降。
    talents: [RKF05-J1-B, RKF05-J2-B, RKF05-J3-A, RKF05-J4-A]
  - name: 追剑回气
    summary: 通过暴击追剑和两档出剑回怒维持循环，并以基础暴击率提高追剑机会；代价是必须暴击才会触发追加剑击。
    talents: [RKF05-J1-C, RKF05-J2-C, RKF05-J3-C, RKF05-J4-B]
