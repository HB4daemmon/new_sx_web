schema_version: 1
content_version: shanhai-content-0.1
kind: method
id: RKF09
name: 金乌真经
status: design_target
summary: 以多段火攻和逐段燃烧造成爆发伤害的御日功法。
description: 普攻施加燃烧，怒技造成三段火焰伤害并逐段施加燃烧；天赋可强化火攻、燃烧或护身。
tags: [method, legendary, fire, original]
source:
  basis: original
  reference: null
  note: 游戏原创神话意象与战斗能力，不声称古籍存在这些数值或效果。
balance:
  target:
    P_by_tier: [125, 156.25, 187.5, 218.75, 250]
    D: 125
    L: 100
    H: 100
    P: 125
  measured: null
rarity: legendary
role: 御日者
stat_focus: [attack, max_hp]
mechanic: null
acquisition:
  start: false
  pools: [method_legendary]
actions:
  basic:
    name: 金乌引焰
    quick: 直接火伤并施加燃烧
    effects:
      - id: RKF09-BASIC-DAMAGE
        trigger: basic_action
        operation: damage
        target: enemy
        params: {attack_ratio: 1.0, segments: 1, can_crit: true, damage_kind: direct}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 按攻击的1.00倍造成一段可暴击直接火伤。
      - id: RKF09-BASIC-BURN
        trigger: basic_hit
        operation: apply_status
        target: enemy
        params: {status: burn, stacks: 1, duration_rounds: 3, max_stacks: 10, refresh: false, snapshot: true, attack_ratio_per_stack: 0.08, ignores_defense: true, hits_shield: true, only_if_damage_actual: true}
        requires: [effective_basic_base_hit]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻命中并造成伤害后施加1层燃烧；每层伤害按施加时的攻击计算，并在每轮结束时结算。
  rage:
    name: 三足焚天
    quick: 三段火攻并逐段引燃
    effects:
      - id: RKF09-RAGE-DAMAGE
        trigger: rage_action
        operation: damage
        target: enemy
        params: {attack_ratio: 0.52, segments: 3, can_crit: true, damage_kind: direct, rage_cost: locked_action_cost}
        requires: []
        consumes: [rage_locked_action_cost]
        replaces: []
        limit: {scope: action, count: 1}
        text: 按攻击的0.52倍造成三段可暴击直接火焰伤害；三段均属于这一次怒技。
      - id: RKF09-RAGE-BURN
        trigger: rage_action
        operation: apply_status
        target: enemy
        params: {status: burn, stacks_per_segment: 1, segments: 3, duration_rounds: 3, max_stacks: 10, refresh: false, snapshot: true, attack_ratio_per_stack: 0.08, ignores_defense: true, hits_shield: true, application: per_segment, after_effect: RKF09-RAGE-DAMAGE}
        requires: [RKF09-RAGE-DAMAGE]
        consumes: []
        replaces: []
        limit: {scope: segment, count: 4}
        text: 怒技每段火焰攻击造成伤害后施加1层燃烧；燃烧本身不会再次施加燃烧。
passives:
  - id: RKF09-PASSIVE-SUN-VEIL
    trigger: battle_start
    operation: modify_stat
    target: self
    params: {stat: defense, mode: add, amount: 10, duration: battle}
    requires: []
    consumes: []
    replaces: []
    limit: {scope: battle, count: 1}
    text: 每场战斗开始时防御提高10；此效果不改变攻击段数。
travel:
  - id: RKF09-TRAVEL-XP
    trigger: node_complete
    operation: grant_resource
    target: run
    params: {resource: xp, amount: 10, basis: flat, node_types: [open], only_if_alive: true, read_combat_phase: false}
    requires: [real_open_node_completed_alive]
    consumes: []
    replaces: []
    limit: {scope: node, count: 1}
    text: 选择金乌真经为主修并存活完成开阔节点后，获得10点修为。
talents:
  - id: RKF09-J1-A
    tier: 1
    branch: A
    name: 金焰初升
    quick: 普攻直接火伤提高
    category: enhance
    effects:
      - id: RKF09-J1-A-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF09-BASIC-DAMAGE], field: params.attack_ratio, mode: add, value: 0.15}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 金乌真经普攻直接伤害提高攻击的0.15倍。
  - id: RKF09-J1-B
    tier: 1
    branch: B
    name: 三曜并照
    quick: 怒技基础段增加一段
    category: enhance
    effects:
      - id: RKF09-J1-B-SEGMENT
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF09-RAGE-DAMAGE, RKF09-RAGE-BURN], field: params.segments, mode: add, value: 1, max_segments: 4}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 怒技由3段增加为4段；新增的一段也能造成火焰伤害并施加1层燃烧。
  - id: RKF09-J1-C
    tier: 1
    branch: C
    name: 焚脉蓄威
    quick: 普攻完成额外回怒
    category: cycle
    effects:
      - id: RKF09-J1-C-RAGE
        trigger: basic_action
        operation: rage_gain
        target: self
        params: {amount: 8, source: talent, additive_to_public_basic: true, only_after_action_complete: true, record_at: round_end, no_extra_action: true}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 每次普攻完成后，除原有的25点回怒外，再获得8点怒气；燃烧不会重复触发此效果。
  - id: RKF09-J2-A
    tier: 2
    branch: A
    name: 灼心留痕
    quick: 每次火攻多叠燃烧
    category: enhance
    effects:
      - id: RKF09-J2-A-BASIC
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF09-BASIC-BURN], field: params.stacks, mode: add, value: 1}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 普攻命中后施加的燃烧层数增加1。
      - id: RKF09-J2-A-RAGE
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF09-RAGE-BURN], field: params.stacks_per_segment, mode: add, value: 1}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 怒技每段火焰攻击施加的燃烧层数增加1；怒技段数不变。
  - id: RKF09-J2-B
    tier: 2
    branch: B
    name: 离火穿云
    quick: 怒技每段伤害提高
    category: enhance
    effects:
      - id: RKF09-J2-B-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF09-RAGE-DAMAGE], field: params.attack_ratio, mode: add, value: 0.2}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 金乌真经怒技每段基础火焰伤害提高攻击的0.20倍；不提高燃烧伤害。
  - id: RKF09-J2-C
    tier: 2
    branch: C
    name: 乌羽护身
    quick: 带燃烧敌人时造盾
    category: enhance
    effects:
      - id: RKF09-J2-C-SHIELD
        trigger: action_end
        operation: shield
        target: self
        params: {max_hp_ratio: 0.16, condition: {enemy_status: burn, min_stacks: 1}, max_per_action: 1}
        requires: [enemy_has_burn]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 普攻或怒技结束时，若敌方仍有燃烧，获得最大气血16%的护盾。
  - id: RKF09-J3-A
    tier: 3
    branch: A
    name: 烈日连环
    quick: 怒技概率追加火段
    category: enhance
    effects:
      - id: RKF09-J3-A-CHANCE
        trigger: rage_action
        operation: chance_damage
        target: enemy
        params: {attack_ratio: 0.46, chance: 0.5, segments: 1, can_crit: true, max_bonus_segments: 1, recursive: false, apply_status: {status: burn, stacks: 1, duration_rounds: 3, snapshot: true, attack_ratio_per_stack: 0.08}}
        requires: [RKF09-RAGE-DAMAGE]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技结束后进行一次判定；有50%概率追加一段攻击0.46倍的可暴击火焰伤害，并施加1层燃烧。追加段不会再次判定。
  - id: RKF09-J3-B
    tier: 3
    branch: B
    name: 焦土加深
    quick: 每层燃烧伤害提高
    category: enhance
    effects:
      - id: RKF09-J3-B-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF09-BASIC-BURN, RKF09-RAGE-BURN], field: params.attack_ratio_per_stack, mode: add, value: 0.025}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 金乌真经施加的每层燃烧伤害提高攻击的0.025倍。
  - id: RKF09-J3-C
    tier: 3
    branch: C
    name: 焚余回气
    quick: 燃烧实际结算后回怒
    category: cycle
    effects:
      - id: RKF09-J3-C-RAGE
        trigger: dot_resolved
        operation: rage_gain
        target: self
        params: {amount: 6, source: talent, condition: {owner_status: burn, actual_damage: true}, once_per_round: true, additive_to_public_sources: true, record_at: round_end, no_extra_action: true}
        requires: [positive_actual_burn_damage]
        consumes: []
        replaces: []
        limit: {scope: round, count: 1}
        text: 每轮首次燃烧对敌方气血或护盾造成伤害后，额外获得6点怒气；未造成伤害时不触发。
  - id: RKF09-J4-A
    tier: 4
    branch: A
    name: 九日凌空
    quick: 怒技每段再提高
    category: enhance
    effects:
      - id: RKF09-J4-A-MODIFY
        trigger: always
        operation: modify_effect
        target: self
        params: {effect_ids: [RKF09-RAGE-DAMAGE], field: params.attack_ratio, mode: add, value: 0.32}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 金乌真经怒技每段基础火焰伤害再提高攻击的0.32倍。
  - id: RKF09-J4-B
    tier: 4
    branch: B
    name: 金乌焚界
    quick: 消耗燃烧转直接爆发
    category: convert
    effects:
      - id: RKF09-J4-B-CONSUME
        trigger: rage_action
        operation: consume_status
        target: enemy
        params: {status: burn, max_stacks: 3, consume_once_per_action: true, preexisting_only: true, record_key: rkf09_consumed_burn, consume_key: burn_up_to_3_stacks, outlet_group: burn_to_rage_damage}
        requires: [burn_available]
        consumes: [burn_up_to_3_stacks]
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技结束时消耗出手前已有的最多3层燃烧；被消耗的燃烧不会再造成后续伤害。
      - id: RKF09-J4-B-DAMAGE
        trigger: rage_action
        operation: damage
        target: enemy
        params: {attack_ratio_per_stack: 0.16, source: consumed_status, record_key: rkf09_consumed_burn, segments: 1, can_crit: false, damage_kind: derived, recursive: false}
        requires: [RKF09-J4-B-CONSUME]
        consumes: [RKF09-J4-B-CONSUME]
        replaces: []
        limit: {scope: action, count: 1}
        text: 每消耗1层燃烧，额外造成攻击0.16倍的不可暴击伤害；被消耗的燃烧不再造成后续伤害。
  - id: RKF09-J4-C
    tier: 4
    branch: C
    name: 日轮护世
    quick: 怒技后护盾更厚
    category: enhance
    effects:
      - id: RKF09-J4-C-SHIELD
        trigger: action_end
        operation: shield
        target: self
        params: {defense_ratio: 0.26, max_hp_ratio: 0.06, condition: {last_action: rage}, max_per_action: 1}
        requires: [rage_action_completed]
        consumes: []
        replaces: []
        limit: {scope: action, count: 1}
        text: 怒技结束后，获得防御0.26倍加最大气血0.06倍的护盾。
routes:
  - name: 多段爆发
    summary: 增加怒技基础段数和概率追加段，集中提高怒技伤害；代价是多段攻击每段都要单独命中，额外段只有50%概率出现。
    talents: [RKF09-J1-B, RKF09-J2-B, RKF09-J3-A, RKF09-J4-A]
  - name: 强燃灼心
    summary: 叠高燃烧并提高持续伤害，末段可把部分燃烧转成爆发；代价是消费旧燃烧后会失去对应的后续持续伤害。
    talents: [RKF09-J1-A, RKF09-J2-A, RKF09-J3-B, RKF09-J4-B]
  - name: 火衣护体
    summary: 利用敌方燃烧获得护盾，并在燃烧造成伤害后额外回怒；代价是战斗过短时，这份额外回怒可能来不及触发。
    talents: [RKF09-J1-C, RKF09-J2-C, RKF09-J3-C, RKF09-J4-C]
