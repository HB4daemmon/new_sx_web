preview: >-
  火海普通战路边的行客仍朝昆仑方向赶路，眼前这场战斗不改变热流继续上行的目标。归元诀普攻为1.55倍直接伤害并回25怒，J1-B再回10；J2-B每轮结束在公共回怒外再回10，不会增加行动。怒技为2倍直接伤害；怒技后蓄备的下一次主普攻增加2段、每段倍率×0.55，完成该普攻后额外回10怒。两层青锋石令主普攻合并为一段不可暴击命中、倍率×1.25；引气符每次普攻后另回5怒。镇心玉先计入防御+8再乘0.5，自身直接与派生伤害×1.6；每次自身普攻或怒技结束后攻击+4，最多3层、从下次主动作起生效。预览显示怒气和下一次可用怒技，不把回怒当作额外行动。
