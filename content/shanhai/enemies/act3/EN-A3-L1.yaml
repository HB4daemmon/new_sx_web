preview: >-
  火海三岔道的精英守着通往昆仑云阶的去路。养剑诀普攻为0.95倍直接剑击并积剑势；J1-B令每次普攻最多叠2层、上限5层。怒技开始时由J2-B至多消费5层已有剑势，每层追加一段0.32倍、不可暴击的派生剑，新生剑势不计入；J3-C在普攻或怒技的基础剑击真实暴击后，每次行动最多再追加一段0.45倍、不可暴击的追剑。两层引气符每次普攻另回10怒，明目珠提高4个百分点直接攻击暴击率。镇心玉先计入防御+8再乘0.5，自身直接与派生伤害×1.6；每次自身普攻或怒技结束后攻击+4，最多3层、从下次主动作起生效。预览显示剑势、回怒与追剑条件，不代表额外行动。
