preview: >-
  昆仑前门普通战中的石台留着旧行旅刻痕，越过旧阵后才会进入天门独渡。归元诀普攻为1.55倍可暴击直接伤害并回25怒；怒技基础为2倍直接伤害，J1-C提高22%，J4-B再提高30%。J3-A使怒气上限与怒技消耗各提高20，并按实际支付的每点怒气给该次怒技直接段增加攻击0.012倍；怒技还按实付怒气的20%返还，并蓄备下一次增加2段、每段倍率×0.55的普攻，该普攻完成后额外回10怒。J2-B每轮结束在公共回怒外再回10，两层凝气珠各降低5点本场怒气上限；两层返气环在每次完成怒技后合计返10怒。镇心玉先计入防御+8再乘0.5，自身直接与派生伤害×1.6；每次自身普攻或怒技结束后攻击+4，最多3层、从下次主动作起生效。回怒不创造额外行动。
