  - 每次有效直击或派生命中削去1格干将战誓，普攻、多段攻击和派生剑都能逐格拆势。
  - 若战意仍有余格，用护盾或高防御承受释放；镇心玉令它的计算防御减半，破甲与高直接伤害也能缩短战斗。
preview: >-
  断桥合流处的首领战挡着通往火海的上游热流。养剑诀从1柄飞剑起步，普攻积剑势；J1-C使可暴击的直接剑击暴击率提高8个百分点，怒技开始时最多消耗5层预存剑势，每层由J2-B追加一柄攻击0.32倍、不可暴击的派生剑，新生剑势不计入。裂空宝轮每6次有效直接或派生命中释放4段、每段0.25倍的派生伤害，每个主动作最多释放一次。镇心玉先计入防御+8再乘0.5，自身直接与派生伤害×1.6；每次自身普攻或怒技结束后攻击+4，最多3层、从下次主动作起生效。阶段列表为空。
  干将战誓开战装满3格，每3轮在轮初按剩余格数释放多段直接斩击、每格攻击0.24倍，存活后补满；每次有效直接或派生命中削去1格。
