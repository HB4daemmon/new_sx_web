  断桥中央的精英守着旧河断口，越过它后可继续循上游热流走向火海。回春功普攻为0.75倍直接伤害并回复最大气血2%，怒技为1.15倍直接伤害并回复5%；J1-C令最大气血提高10%，J2-C按每次实际回复气血的25%回怒，不计溢疗。两层回春瓶各提高自身治疗量6%，其核心另使每次普攻自疗最大气血4%、有效治疗的60%额外转护盾，并令自身直接伤害×0.8；溢疗不会转为这份护盾。行医囊提供最大气血+10，并只在完成行旅节点后每层恢复2点、不在战斗中治疗。镇心玉先计入防御+8再乘0.5，自身直接与派生伤害×1.6；每次自身普攻或怒技结束后攻击+4，最多3层、从下次主动作起生效。
