preview: 回生雾准备于开战时装满3层，每3轮在第3、6、9……轮开始按剩余层数治疗，每层恢复最大气血4.5%；释放后若仍存活即补满3层。每次中毒或燃烧跳伤实际扣除河伯气血时消耗1层；仅击中护盾的跳伤与直接伤害不消耗准备。基础五维为装备前值；回春功普攻约按最大气血10%自疗、怒技约按24%自疗，J1-C只提高最大气血；RC12核心使普攻额外自疗4%、有效治疗的60%转护盾、直接伤害倍率为0.8。RC06/RC12还提供最大气血，真实溢疗不会因此成为有效治疗。
