preview: >-
  潮口首幕精英守着仍通水的石阶，越过它才能循逆潮走向断桥。基础五维是装备前值；养剑诀从1柄飞剑开始，普攻造成0.95倍可暴击剑击并积剑势，J1-B使每次普攻最多增加2层、剑势上限仍为5；它完成主动作后，每柄现存飞剑各追加0.18倍派生伤害。青锋石只把主普攻合并为一段、倍率乘1.25且不可暴击；剑穗令普攻基础直接伤害提高6%，并在普攻后追加0.45倍派生伤害，代价是怒技基础倍率降至0.65。镇心玉先计入防御+8再乘0.5，自身直接与派生伤害×1.6（不放大毒、火、反震、治疗或护盾）；每次自身普攻或怒技结束后攻击+4，最多3层、从下次主动作起生效。
