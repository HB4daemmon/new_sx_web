counterplay:
  - 有效直击或派生每次削去1格雷怒准备；抢先削格、保持部分怒气待付，或用护盾承受剩余削怒与四段雷劫。
  - 首次压到半血会开启有限劫门护罩；用任何类型的伤害打破后，抓住本轮余下与下一轮的易伤窗口集中进攻。
preview: >-
  J3-A把怒技基础雷段提高为四段，J2-C提高有限连雷概率，J4-B只提高每个基础雷段的伤害；
  RR13在普攻首个有效基础命中登记10点外来削怒请求，按公共每轮20点上限结算，不取消本轮已锁动作；实际削怒会等额返还怒气并造盾。
  另有3格雷怒准备，每4轮轮初按剩余格数登记6点/格削怒；直击或派生每次削去1格。首次降至最大气血一半时只触发一次：截断该击的致命余伤，生成最大气血35%的可正常消耗护罩；护罩破后，本轮余下及随后1轮所受伤害提高25%。护罩不会重生，毒火、反噬和多段伤害均可消耗。
  这是终战候选，与EN-F2在本局只抽一名；预览公开段数、连雷、蓄运和削怒请求，自动战仅执行战前取舍。
