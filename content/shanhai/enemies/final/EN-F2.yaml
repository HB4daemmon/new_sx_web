counterplay:
  - 白昼结算后会换相并造盾；用持续输出压过护盾，把高伤害爆发留给不造盾的长夜。
  - 六目有效直击、派生和实际扣血的毒火跳伤各削1格；首次降至半血还会开启一次有限劫门护罩，破罩后有一轮易伤窗口。
preview: >-
  天门独渡接在四幕各11个行旅节点之后，是这段45节点主线的第45个、也是唯一终战节点；本局只会在EN-F1与EN-F2中选一名。烛龙真经从白昼开始，每次自身普攻或怒技结束后轮替一次；白昼普攻按0.92倍直接伤害并获防御0.24倍护盾，白昼怒技按1.25倍直接伤害并获防御0.38倍护盾，长夜对应基础倍率为1.10和1.55且不获这些护盾。J1-C只在长夜转白昼时回8怒；J2-B把长夜怒技直接伤害加攻击0.26倍，J3-B给两相普攻与怒技各加0.12倍攻击，J4-B再给长夜怒技加0.38倍。启明玉攻击+12、速度+1、开场追加50怒，但固定50点上限使入场仍为50怒，不会超过上限；它还令计算防御×0.65。三层玄铁甲合计防御+15；回元佩加防御8，首个怒技后尝试降低上限15，但启明玉的固定50上限优先、不再降低。预览公开昼夜、护盾和封顶怒气。
  另有3格六目准备，每4轮按剩余格数对行者施加1层虚弱和1层破甲、持续2轮，存活后补满；有效直击、派生或实际扣血的毒火跳伤各削1格。
  首次降至最大气血一半时只触发一次：截断该击的致命余伤，生成最大气血20%的可正常消耗护罩；破罩后，本轮余下及随后1轮所受伤害提高25%。护罩不会重生，毒火、反噬和多段伤害均可消耗。
