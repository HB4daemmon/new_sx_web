preview: >-
  敌人以白昼开始，主动作结束后只轮替一次相位；白昼普攻和怒技造盾，长夜普攻与怒技直接伤害更高。
  J2-B与J4-B只强化长夜怒技，J3-B同时提高两相直接段，RR07在首个怒技完成后的轮尾降低自身上限15，
  RL04只提供一次开场额外回怒。它是终战候选，与EN-F1在本局只抽一名；预览公开相位、护盾、怒气与轮替，
  自动战仅执行战前取舍。
