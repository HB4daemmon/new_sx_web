id: RS01
name: 神农留药
status: design_target
summary: 先留下一笔灵石渡过药荒，再以公开风险换回长明灯，或用更多灵石取行医囊。
description: 神农在潮口分药，主角必须在眼前的盘缠和一份延后的救命药之间作决定；后段的回访只认初遇时确实留下的灵石。
tags: [character_line, shennong, resource_reserve, healing]
source:
  basis: myth_adaptation
  reference: canon.fengshen_yanyi.character.ef3b2a433
  note: 原典库确认神农为上古三皇之一、居火云洞；本作相遇、承诺、敌战与奖励是游戏原创改编。
  identity: 神农在《封神演义》实体中以赐丹药与升麻的医药形象出现，检索状态为draft。
  game_original: 潮口留药、灵石承诺、非致命回访和法宝奖励均为游戏原创。
