  measured: null
character: 神农
premise: 潮水漫到药圃，神农只够把一份药材交给一名赶路人；你现在要么留出盘缠保住后路，要么拿小利离开。
encounters: [RK001, RK002]
commitment:
  id: RS01-promised
  form: resource_reserve
  text: 初遇时明确留下 8 灵石，约定后段回到药棚时仍愿意为药器承担一次风险。
  requirement: 初遇时留下灵石，并在后段回到药棚
  cancellation: 未留下灵石、主动放弃或错过回访，不追回初遇成本，终奖也不会随后追来。
resolution:
  condition: 初遇承诺仍在，并在药棚选择守药挑战或支付 20 灵石取行医囊。
  reward_shape: 守药成功取长明灯；支付 20 灵石取行医囊，不承担挑战风险。
  tradeoff: 守药挑战承受 12% 气血损耗并承担失手风险；支付路线保留气血，但会减少后段盘缠。
selection:
  planned_per_run: 1
  optional: true
  fallback: ordinary_event
