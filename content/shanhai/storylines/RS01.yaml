kind: storyline
id: RS01
name: 神农留药
status: design_target
summary: 留下 8 枚灵石约好第三幕药棚再见；回访可付 12% 基准气血挑战取长明灯，或付 20 灵石取行医囊。
description: 神农没有替赶路人留住一份必得的救命药，只把药棚的约定说清。你可以先拿眼前的小利，也可以留下 8 枚灵石，走到后段再决定是否继续投入。
tags: [character_line, shennong, resource_reserve, healing]
source:
  basis: myth_adaptation
  reference: canon.fengshen_yanyi.character.ef3b2a433
  note: 原典库确认神农为上古三皇之一、居火云洞；本作相遇、承诺、敌战与奖励是游戏原创改编。
  identity: 神农在《封神演义》实体中以赐丹药与升麻的医药形象出现，检索状态为draft。
  game_original: 潮口留药、灵石承诺、非致命回访和法宝奖励均为游戏原创。
balance:
  target:
    initial_gross_U: [0, 0.5]
    resolution_gross_U: [2.4, 4.0]
    high_investment_total_U: [3.0, 4.5]
  measured: null
character: 神农
premise: 潮水漫到药圃，神农把药包移到干处。你可以拿走一小笔盘缠，也可以先留下 8 枚灵石，约好第三幕再回药棚；那时是否冒险，仍由你选。
encounters: [RK001, RK002]
commitment:
  id: RS01-promised
  form: resource_reserve
  text: 初遇选择支付 8 枚灵石并留下约定；回到药棚后，是否再为药器投入由你决定。
  requirement: 初遇实际支付 8 枚灵石并留下约定，第三幕回到药棚后再选守药或付 20 枚灵石。
  cancellation: 初遇没留下 8 枚、回访时主动收手或错过药棚，都不会退回已付灵石，也不会在别处补发药器。
resolution:
  condition: 初遇约定仍在，且第三幕回到药棚后选择挑战守药或支付 20 枚灵石。
  reward_shape: 守药战胜利后取长明灯；支付 20 枚灵石取行医囊，不参加挑战。
  tradeoff: 守药先付相当于基准气血 12% 的代价，战斗损伤随实战变化；失手至少保留 1 点气血且无奖。付 20 枚灵石免去挑战，但初遇留下的 8 枚不退。
selection:
  planned_per_run: 1
  optional: true
  fallback: ordinary_event
