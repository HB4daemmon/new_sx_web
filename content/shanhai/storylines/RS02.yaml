id: RS02
name: 精卫追堤
status: design_target
summary: 承受相当于基准气血 8% 的潮击并存活，约好第三幕清礁；胜取毒牙钉，或付 20 灵石取蛇纹瓶。
description: 精卫在堤口一块块垒石，不说自己能替你清出礁路。你可以拿眼前修为，也可以承受潮击并活着站稳，等旧水道走到第三幕时再试清礁。
tags: [character_line, jingwei, dangerous_trial, sea_route]
source:
  basis: myth_adaptation
  reference: null
  note: 本次离线古籍库未命中精卫实体或“精卫填海”段落，原典身份待核验；人物线和游戏能力均为原创改编草案。
  identity: 精卫常见于上古填海传说，但未由本次只读知识库确认。
  game_original: 精卫的潮口相遇、清礁承诺、回访挑战与法宝奖励均为游戏原创。
