  measured: null
character: 精卫
premise: 海堤缺口还在扩大，精卫希望近礁能有一条窄路。你可以先收修为，也可以付出相当于基准气血 8% 的代价并存活，约好第三幕回来清礁。
encounters: [RK003, RK004]
commitment:
  id: RS02-promised
  form: endure_reef_pressure
  text: 初遇支付相当于基准气血 8% 的潮击代价并存活，留下第三幕清礁约定；清礁成败到回访时才知道。
  requirement: 初遇支付 8% 基准气血并存活、选择清礁约定，第三幕回到近礁后再选挑战或付石。
  cancellation: 初遇未付气血、未留下约定、错过回访或后来收手，都不会退还已付代价，也不会补发器物。
resolution:
  condition: 初遇约定仍在，且第三幕回到近礁后选择清礁挑战或支付 20 枚灵石。
  reward_shape: 清礁战胜利后取毒牙钉；支付 20 枚灵石取蛇纹瓶，不参加挑战。
  tradeoff: 初遇已付 8% 基准气血并须存活；回访清礁不另收入场气血，但战斗损伤随实战变化，失手至少保留 1 点且无奖。付 20 枚灵石免战，但拿不到毒牙钉。
selection:
