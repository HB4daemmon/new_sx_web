  form: endure_reef_pressure
  text: 初遇时承受 8% 气血损耗并存活，答应在后段进入公开的清礁试炼。
  requirement: 初遇时承受潮水冲击并存活，答应后段清礁
  cancellation: 未承受冲击、错过回访或挑战失败后，不会得到普通斗法战利品，也不会得到堤路回报。
