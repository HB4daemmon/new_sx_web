  condition: 初遇承诺仍在，并在清礁处选择挑战或支付 20 灵石取蛇纹瓶。
  reward_shape: 清礁成功取毒牙钉；支付 20 灵石取蛇纹瓶，不承担挑战风险。
  tradeoff: 初遇先承受 8% 气血损耗，后段清礁不另收入场气血但仍会留下战斗损耗；支付路线保留气血，却放弃毒牙钉的更高回报。
