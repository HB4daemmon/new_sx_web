character: 哪吒
premise: 阵门一重一快；不接阵可立即领取一笔修为，若想在后段再战第二阵，就要先赢下第一阵。
encounters: [RK009, RK010]
commitment:
  id: RS05-promised
  form: staged_trial
  text: 初遇损失约62点气血挑战第一阵；胜利后才留下后段继续接第二阵的资格。
  requirement: 初遇第一阵获胜，并保留后段承诺
  cancellation: 初遇离阵、挑战失败或错过回访时，保留已发生的事件结果，但不补第二阵奖励。
resolution:
  condition: 初遇第一阵胜利且承诺仍在，后段再选择第二阵、支付 24 灵石或收手。
  reward_shape: 第二阵成功取如意钱；支付 24 灵石取雷纹印，收手不再取器物。
  tradeoff: 第二阵前不会恢复气血或护盾，第一阵留下的伤势会延续；付24灵石可直接取雷纹印，收手则不再得到法宝。
