  note: 原典库以draft实体确认哪吒为三头六臂、脚踏风火二轮、持火尖枪的神将；本作过阵、敌战与奖励是游戏原创改编。
  identity: 哪吒实体来自《封神演义》相关资料的知识库条目，当前校对状态为draft。
  game_original: 两段非致命过阵、收手点和法宝奖励均为游戏原创。
