id: RS05
name: 哪吒过阵
status: design_target
summary: 第一阵先付 8% 基准气血，胜利才留第二阵资格；第四幕再付 12% 基准气血争取如意钱，或付 24 灵石取雷纹印。
description: 哪吒把阵门分成前后两段，初遇不是领宝，而是决定是否入阵。闯过第一阵只留下回访资格；第二阵前，他也会把旧伤与收手的余地摆明。
tags: [character_line, nezha, two_stage_trial, combat_artifact]
