character: 哪吒
premise: 阵门先重后快，哪吒让你看清第一阵的代价。你可以收下一笔修为或退出；若付出相当于基准气血 8% 并胜过第一阵，第四幕才有资格决定是否继续。
encounters: [RK009, RK010]
commitment:
  id: RS05-promised
  form: staged_trial
  text: 初遇支付相当于基准气血 8% 的代价挑战第一阵；只有获胜，才留下第四幕回访资格，不预发器物。
  requirement: 初遇实际挑战并赢下第一阵，第四幕回访时再选择第二阵、付石或收手。
  cancellation: 初遇收手、挑战失手或错过回访，都不会补发第二阵奖励；已付气血与战斗损伤照旧。
resolution:
  condition: 初遇第一阵获胜并保留回访资格，第四幕再选择闯第二阵、支付 24 枚灵石或收手。
  reward_shape: 第二阵战胜利后取如意钱；支付 24 枚灵石取雷纹印，不闯第二阵；收手不再取器物。
  tradeoff: 初遇挑战先付 8% 基准气血；回访再付 12%，旧伤与护盾消耗都不重置，战斗损伤随实战变化。失手至少保留 1 点且无奖；付 24 枚灵石免战，收手则不再得法宝。
