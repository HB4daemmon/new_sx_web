name: 哪吒过阵
status: design_target
summary: 先损失约62点气血挑战第一阵，胜利后才有资格再战；后段可再损失约138点气血争取如意钱，或付24灵石取雷纹印。
description: 哪吒把阵门分成轻重两路，主角初遇时不是领宝，而是先承担一段可收手的阵试；后段的力量来自是否继续把第二阵走完。
