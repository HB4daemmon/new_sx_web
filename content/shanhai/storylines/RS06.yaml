id: RS06
name: 铁扇借风
status: design_target
summary: 初遇付 10% 基准气血并存活，留下第四幕风止石回访；再付 15% 挑战取薪火宝炉，或付 32 灵石取余烬盏。
description: 铁扇公主给一阵只能越过眼前火口的短风。是否承受火伤、把回访机会留到风止石，由你决定；即便应约，火根也须到时另行面对。
tags: [character_line, princess_iron_fan, hp_commitment, fire]
source:
  basis: myth_adaptation
  reference: canon.xiyou_ji.character.e46529d4c
  note: 原典库以draft实体确认铁扇公主为翠云山芭蕉洞人物，并记录献扇救夫、复得芭蕉扇等关系；本作借风、火伤承诺与奖励是游戏原创改编。
  identity: 铁扇公主实体来自《西游记》知识库，当前校对状态为draft。
  game_original: 火山短路、承受火伤的承诺、后段挑战和传奇法宝奖励均为游戏原创。
