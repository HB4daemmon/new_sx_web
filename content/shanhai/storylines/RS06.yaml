character: 铁扇公主
premise: 山腹火根堵住去路，短风只能带你走一段；若现在不肯承受火伤，后段就不能挑战火根、争取熄灭它的强风。
encounters: [RK011, RK012]
commitment:
  id: RS06-promised
  form: carry_visible_hp_cost
  text: 初遇损失约78点气血并存活，换取第四幕风止石的挑战机会。
  requirement: 初遇时支付火伤并存活穿过风口
  cancellation: 未支付、未存活或错过回访时，火山线只回到普通道路，传奇器物不会随后出现。
resolution:
  condition: 初遇承诺仍在，并在风止石选择除火挑战或支付 32 灵石取余烬盏。
  reward_shape: 除火成功取薪火宝炉；支付 32 灵石取余烬盏，不承担挑战风险。
  tradeoff: 除火挑战再损失约173点气血，失手后仅剩1点；胜利才有薪火宝炉。付32灵石可保留气血取余烬盏，却拿不到传奇法宝。
