name: 铁扇借风
status: design_target
summary: 初遇损失约78点气血换取借风机会；后段可再损失约173点气血挑战火根取薪火宝炉，或付32灵石取余烬盏。
description: 铁扇公主只肯给一阵短风；主角要么立即拿盘缠，要么损失约78点气血并存活，把这笔代价带到后段再挑战火根。
