character: 铁扇公主
premise: 山腹热流把路挤成窄口，短风只能带你走过眼前一段。若支付相当于基准气血 10% 并存活，第四幕可回风止石选择挑战火根、付石或离开；应约不等于已经熄火。
encounters: [RK011, RK012]
commitment:
  id: RS06-promised
  form: carry_visible_hp_cost
  text: 初遇支付相当于基准气血 10% 的代价并存活，换取第四幕风止石的回访选择，不预发器物。
  requirement: 初遇实际支付气血并存活穿过风口，第四幕回到风止石后再作选择。
  cancellation: 初遇未付气血、未存活或错过风止石，约定便不成立；之后不会补发挑战资格或法宝。
resolution:
  condition: 初遇存活并保留回访约定，第四幕在风止石选择除火挑战、支付 32 枚灵石或离开。
  reward_shape: 除火战胜利后取薪火宝炉；支付 32 枚灵石取余烬盏，不参加挑战。
  tradeoff: 初遇已付 10% 基准气血；除火再付 15%，战斗损伤随实战变化，失手至少保留 1 点且无奖。付 32 枚灵石免战取余烬盏，但拿不到薪火宝炉。
selection:
