character: 后羿
premise: 山火将箭路照成两层影子，后羿请持有明目珠的人带它走过旧路。若你已有此物，愿意放弃眼前修为并带到第四幕，回访时才有机会校准风路；他不保证试射结果。
encounters: [RK005, RK006]
commitment:
  id: RS03-promised
  form: carry_attribute_artifact
  text: 初遇时已持有明目珠，并选择放下眼前修为、把它带到第四幕；后羿只留下试射机会。
  requirement: 初遇持有一枚明目珠并选择携带，第四幕回访时仍实际持有它。
  cancellation: 初遇未应约、回访前失去明目珠或错过风口时，试射与付石选项都不开放，也不会另送器物。
resolution:
  condition: 初遇应约且第四幕回访时仍持有明目珠，再选择试射或支付 24 枚灵石。
  reward_shape: 试射战胜利后取引雷针；支付 24 枚灵石取剑穗，不参加挑战。
  tradeoff: 明目珠可与其他法宝并持，但必须留到风口；试射先付相当于基准气血 12% 的代价，战斗损伤随实战变化，失手至少保留 1 点且无奖。付 24 枚灵石免战，但会少一笔盘缠。
