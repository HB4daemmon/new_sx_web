status: design_target
summary: 带着已有的明目珠走到第四幕，付 12% 基准气血试射争取引雷针，或付 24 灵石取剑穗。
description: 后羿在山火照出的岔路旁校看风向。他不送你明目珠，也不要求你成为射手；只有初遇应约、一路保留已有的珠子，回访时才有试射或付石的选择。
