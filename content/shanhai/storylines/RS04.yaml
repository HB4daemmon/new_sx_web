character: 禹
premise: 逆流顶着旧堤，禹需要有人让出一次分流的空隙。眼前的修为可以马上推进境界；若你放弃它，后段可回堤口再作选择，但不会自动得到器物。
encounters: [RK007, RK008]
commitment:
  id: RS04-promised
  form: forgo_immediate_growth
  text: 初遇放弃本事件的一笔修为，把眼前的成长机会让给河口疏流；是否守堤和取得回报要等回访再定。
  requirement: 初遇放弃该选项的一笔修为并保留约定，第四幕回到堤口后再选守堤或借盾。
  cancellation: 初遇领取修为、回访时收手或错过堤口，都不会追回已领成长或补发长明灯、护堤盾。
resolution:
  condition: 初遇确实让出修为并保留约定，第四幕回到堤口后再选挑战、借盾或离开。
  reward_shape: 守堤战胜利后取长明灯；不挑战可得一层仅护下一场战斗的护堤盾。
  tradeoff: 守堤先付相当于基准气血 12% 的代价，战斗损伤随实战变化；失手至少保留 1 点且无奖。借盾不再扣气血或灵石，但拿不到长明灯；已让出的修为不返。
selection:
