name: 禹让一步
status: design_target
summary: 舍弃眼前的一笔修为，把成长让给治水工程，后段以长明灯或临时护堤盾兑现。
description: 禹在断河口疏导水势，眼前的修为唾手可得；主角可以先变强，也可以把这次成长让给一条真正能通行的水路。
tags: [character_line, yu, forgo_growth, endurance]
