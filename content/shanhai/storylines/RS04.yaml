character: 禹
premise: 河口即将漫过旧堤，一笔修为能立刻推近境界，但禹要的是有人把这一步成长先让出来。
encounters: [RK007, RK008]
commitment:
  id: RS04-promised
  form: forgo_immediate_growth
  text: 初遇时明确放弃本事件的一笔修为，把成长机会让给疏导河口。
  requirement: 初遇时让出修为，并答应后段守堤
  cancellation: 若领取修为、未保留承诺或错过回访，不追回已领成长，治水终奖也不会随后出现。
resolution:
  condition: 初遇承诺仍在，并在堤口选择守堤挑战或借一层临时护堤盾。
  reward_shape: 守堤成功取长明灯；安全路线只在下一场真实战斗前立起临时护堤盾。
  tradeoff: 守堤挑战不另收灵石，但会承担公开的河口冲击；安全路线没有法宝，却能保留气血和后段盘缠。
