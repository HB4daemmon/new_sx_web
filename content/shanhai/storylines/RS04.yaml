  note: 本次离线古籍库仅命中九鼎相关地点/器物叙事，未命中禹人物或治水事件；原典身份待核验，人物线和能力为游戏原创。
  identity: 禹治水传说未由本次只读知识库确认。
  game_original: 让出修为换取后段治水器物、非致命守堤与回访分支均为游戏原创。
