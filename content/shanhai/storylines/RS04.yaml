id: RS04
name: 禹让一步
status: design_target
summary: 放弃一笔眼前修为替旧河道让流；第四幕可付 12% 基准气血挑战取长明灯，或不战借一层护堤盾。
description: 禹在断河口分水，不把这份让步说成将来必得的报答。你可以立刻收下修为，也可以把它让给旧河床，等第四幕回到堤口再决定是否守堤。
tags: [character_line, yu, forgo_growth, endurance]
source:
  basis: myth_adaptation
  reference: null
  note: 本次离线古籍库仅命中九鼎相关地点/器物叙事，未命中禹人物或治水事件；原典身份待核验，人物线和能力为游戏原创。
  identity: 禹治水传说未由本次只读知识库确认。
  game_original: 让出修为换取后段治水器物、非致命守堤与回访分支均为游戏原创。
