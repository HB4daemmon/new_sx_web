schema_version: 1
content_version: shanhai-content-0.2
kind: rules
id: RULES
name: 山海版首轮内容规则
status: design_target
summary: 共用动作、状态、资源与四幕预算
description: 本文件提供首轮实现输入；目标、配置和实测分开，不覆盖旧游戏运行规则。
tags: [shared, design_target]
source:
  basis: original
  reference: null
  note: 游戏原创设计，承接rework各基线文档。
balance:
  target: {window: 15}
  measured: null
insights:
  - id: V2-J1-A
    tier: 1
    branch: A
    name: 财能通神
    quick: 直接与派生伤害按灵石数增幅，150枚达额外0.6倍
    category: enhance
    effects:
      - id: V2-J1-A-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: wealth_damage, scale: 1.2, half_saturation: 150}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 自身直接与派生伤害乘以1+1.2×当前灵石/(当前灵石+150)；不改变受到的伤害。
  - id: V2-J1-B
    tier: 1
    branch: B
    name: 破军战骨
    quick: 攻+8防+6；每胜精英再+8/+6、首领+12/+8；每幕可邀战
    category: enhance
    effects:
      - id: V2-J1-B-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: hunter, base_attack: 8, base_defense: 6, elite_attack: 8, elite_defense: 6, boss_attack: 12, boss_defense: 8}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 选中时提高攻击8、防御6；本局每次已结算的精英胜利再加攻击8、防御6，每次首领胜利再加攻击12、防御8，包括获得本天赋前的真实战绩。解锁主动邀战当前幕精英，每幕至多一次；将当前普通战升级为精英战及对应奖励，不增加节点。败北与重放不累计胜场。
  - id: V2-J1-C
    tier: 1
    branch: C
    name: 动若脱兔
    quick: 速度+2；伤害按自速/敌速增幅，最多2.5倍
    category: enhance
    effects:
      - id: V2-J1-C-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: speed_damage, speed_bonus: 2, max_multiplier: 2.5}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 永久提高速度2；自身直接与派生伤害乘以max(1,min(2.5,自身速度/敌方速度))。敌方速度为0时视为2.5倍，速度优势不降低伤害。
  - id: V2-J1-D
    tier: 1
    branch: D
    name: 猬甲护身
    quick: 敌方有效直接命中（含盾吸收）后+6防，并按当前防御反伤24%
    category: enhance
    effects:
      - id: V2-J1-D-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: carapace, defense_per_hit: 6, reflect_ratio: 0.24}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 战斗内每次敌方有效主动直接命中后提高防御6，并按提升后的当前防御反射24%伤害；被护盾吸收也算有效命中。持续伤害、自伤和反射不触发，反射不可重入。
  - id: V2-J1-E
    tier: 1
    branch: E
    name: 挥金如土
    quick: 攻击+8；本局每实付1灵石再加0.08攻击
    category: enhance
    effects:
      - id: V2-J1-E-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: spending_power, base_attack: 8, attack_per_coin: 0.08}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 永久提高攻击8；本局每实际支付1枚灵石，再永久提高攻击0.08。仅记录成功扣除的实付，不计奖励、报价或假设花费，也不因战斗重放重复记账。
  - id: V2-J1-F
    tier: 1
    branch: F
    name: 万宝朝宗
    quick: 伤害+10%；每种持有法宝再加4%
    category: enhance
    effects:
      - id: V2-J1-F-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: collection_damage, base_bonus: 0.1, per_kind: 0.04}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 自身直接与派生伤害乘以1+0.1+0.04×库存中不同法宝种类数；同种叠层只计一种，未装备法宝仍计入收集种类。
  - id: V2-J2-A
    tier: 2
    branch: A
    name: 战利生财
    quick: 攻击+8；战斗胜利实结4/20/30灵石（普/精/首领）
    category: enhance
    effects:
      - id: V2-J2-A-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: bounty, attack_bonus: 8, normal_coins: 4, elite_coins: 20, boss_coins: 30}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 永久提高攻击8；普通战、精英战或首领战胜利并完成结算后，分别实际获得4、20或30枚灵石。败北、终战不发普通结算奖励，也不能通过重放领取。
  - id: V2-J2-B
    tier: 2
    branch: B
    name: 市井仙缘
    quick: 后续商店标价乘0.75，最低1；实付才计入花费
    category: cycle
    effects:
      - id: V2-J2-B-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: shop_discount, ratio: 0.75}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 后续商店库存报价乘以0.75并向下取整，最低为1枚灵石；只影响之后生成的商店报价。实际扣除金额进入本局实付花费，报价预览不记账。
  - id: V2-J2-C
    tier: 2
    branch: C
    name: 剑丸成阵
    quick: 普攻额外+2段；每段按原普攻段伤害60%
    category: convert
    effects:
      - id: V2-J2-C-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: basic_split, extra_segments: 2, segment_ratio: 0.6}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 每次普攻的基础段数增加2，所有基础段（包括原有段）均按原单段伤害的60%结算；不复制整个动作，不重复消耗或动作结束收益。每段仍可触发有效命中效果。
  - id: V2-J3-A
    tier: 3
    branch: A
    name: 战意不息
    quick: 每次有效直接/派生命中+3怒，轮末结算
    category: cycle
    effects:
      - id: V2-J3-A-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: hit_rage, amount: 3}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 每次自身有效的直接或派生命中获得3点怒气，汇入既有轮末怒气结算；格挡无效命中、反射和持续伤害不触发。
  - id: V2-J3-B
    tier: 3
    branch: B
    name: 身外化身
    quick: 怒技化身以45%威力追击，可治疗、造盾与施加状态
    category: convert
    effects:
      - id: V2-J3-B-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: rage_echo, ratio: 0.45}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 怒技完成后，化身以45%威力重演本体伤害、治疗与护盾，输出归属身外化身；状态层数及持续回合按45%四舍五入且至少为1，持续伤害每层威力亦为45%。不再次支付怒气、不重复主动作收入，也不复制消耗护盾、剑意或已有毒火的爆发，回响不递归。法宝产生的后续效果仍记入对应法宝。
  - id: V2-J3-C
    tier: 3
    branch: C
    name: 百战护体
    quick: 开场护盾6%最大气血；每胜精英/首领再加2%/3%
    category: enhance
    effects:
      - id: V2-J3-C-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: veteran_shield, base_ratio: 0.06, elite_ratio: 0.02, boss_ratio: 0.03}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 每场战斗开场获得最大气血×(6%+2%×本局既往精英胜场+3%×本局既往首领胜场)的基础护盾，包括获得本天赋前的真实战绩；普通战与败场不额外累计，仍受公共护盾加成与上限约束。
  - id: V2-J4-A
    tier: 4
    branch: A
    name: 锦衣护道
    quick: 开场护盾=30+当前每枚灵石0.4
    category: enhance
    effects:
      - id: V2-J4-A-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: wealth_shield, base_shield: 30, shield_per_coin: 0.4}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 每场战斗开场获得30+0.4×本场快照中当前灵石数的护盾；战斗中后续的灵石变化不追溯改变该护盾，仍受公共护盾上限约束。
  - id: V2-J4-B
    tier: 4
    branch: B
    name: 百战封侯
    quick: 伤害+12%；每次既往精英/首领胜利再加10%/15%
    category: enhance
    effects:
      - id: V2-J4-B-BUILD
        trigger: always
        operation: modify_effect
        target: self
        params: {build: trophy_damage, base_bonus: 0.12, elite_bonus: 0.1, boss_bonus: 0.15}
        requires: []
        consumes: []
        replaces: []
        limit: {scope: permanent, count: 1}
        text: 自身直接与派生伤害乘以1+0.12+0.1×既往精英战胜场数+0.15×既往首领战胜场数；普通胜场不提供额外倍率。
  - id: V2-J4-C
    tier: 4
    branch: C
    name: 先天神力
    quick: 攻击+35%
    category: enhance
    effects:
      - {id: V2-J4-C-ATTACK, trigger: always, operation: modify_stat, target: self, params: {stat: attack, mode: percent_add, amount: 0.35}, requires: [], consumes: [], replaces: [], limit: {scope: permanent, count: 1}, text: 永久提高攻击35%。}
attributes: [attack, defense, max_hp, crit_rate, speed]
rarities:
  common: {method_multiplier: 1, artifact_B: 1}
  rare: {method_multiplier: 1.1, artifact_B: 2.4}
  legendary: {method_multiplier: 1.25, artifact_B: 4}
cultivation:
  realm_names: [炼气, 筑基, 金丹, 元婴, 化神]
  requirements: [120, 480, 600, 840]
  cumulative: [120, 600, 1200, 2040]
  heal_on_level: false
  talents_per_tier: 1
  base_stats_by_tier:
    - {attack: 120, defense: 100, max_hp: 500, crit_rate: 0.05, speed: 10}
    - {attack: 150, defense: 125, max_hp: 625, crit_rate: 0.05, speed: 10}
    - {attack: 185, defense: 150, max_hp: 775, crit_rate: 0.05, speed: 10}
    - {attack: 225, defense: 180, max_hp: 950, crit_rate: 0.05, speed: 10}
    - {attack: 270, defense: 215, max_hp: 1150, crit_rate: 0.05, speed: 10}
combat:
  main_actions_per_round: 1
  speed_changes_action_count: false
  default_hit: true
  crit_multiplier: 1.5
  direct_defense_constant: 100
  direct_damage_formula: raw_damage * 100 / (100 + max(0, effective_defense))
  damage_rounding: 各段最终量保留小数记账，玩家显示取整；不按每个中间倍率提前取整。
  shield_cap_ratio: 1
  shield_expiry: battle_end
  same_speed: seeded_prebattle_order
  death_stops_chain: true
  derived_reentry: false
  observation_rounds: 15
  timeout_defeat: false
rage:
  base_cap: 100
  min_cap: 60
  opening: 50
  basic_completed: 25
  effective_incoming_segment: 5
  round_end: 10
  round_drain_cap: 20
  opening_drain_cap: 50
  lock_action_at: round_start
  pay_at: action_execute
  income_at: round_end
  interrupted_income: discarded
statuses:
  poison:
    max_stacks: 10
    duration_rounds: 3
    tick_at: round_end_before_rage
    attack_ratio_per_stack: 0.08
    ignores_defense: true
    hits_shield: true
    can_crit: false
    duration_policy: 每份毒层独立记录剩余tick；当轮施加可在当轮轮尾首次tick，超上限不刷新旧层。
  burn:
    max_stacks: 10
    duration_rounds: 3
    tick_at: round_end_before_rage
    attack_ratio_per_stack: 0.08
    ignores_defense: true
    hits_shield: true
    can_crit: false
    duration_policy: 每份燃烧独立记录剩余tick；当轮施加可在当轮轮尾首次tick，超上限不刷新旧层。
  weakness:
    stat: attack
    reduction_per_stack: 0.05
    max_stacks: 5
    duration_rounds: 2
    duration_policy: 当轮影响后续未发生事件，轮尾递减；重施只刷新对应新增层，未执行动作不补伤害。
  armor_break:
    stat: defense
    reduction_per_stack: 0.05
    max_stacks: 5
    duration_rounds: 2
    duration_policy: 当轮影响后续未发生事件，轮尾递减；有效防御最低为0。
  dot_snapshot: 每次施加保存来源攻击及DOT修正，持续期间不随来源攻击变化重算；消费读取实际存量。
  cleanup: 战末清除所有战斗状态、怒气与护盾，不带入下一节点。
adventure:
  acts: 4
  nodes_per_act: 11
  terminal_nodes: 1
  baseline: {C: 4, E: 3, L: 1, S: 1, R: 1, B: 1}
  min_common_battles_per_act: 3
  min_C_plus_E_per_run: 22
  max_extra_elites_per_act: 1
  max_extra_elites_per_run: 3
  max_core_per_act: 1
  max_core_per_run: 3
  min_noncore_between_core: 2
  planned_storylines: 1
  planned_independent_cores: [0, 1]
  act_transition_heal: false
  terminal_rewards: []
  terminal_preparation: false
  route_enemy_selection:
    route_node_ids_are_display_samples: true
    fixed_encounters: false
    runtime_selection: one_frozen_draw_per_node_from_same_type_pool
    common:
      candidate_count: 4
      draw: 1
      replacement: true
      prefer_unseen: true
      on_pool_exhaustion: reset_pool
      avoid_adjacent_repeat: true
    boss:
      candidate_count: 2
      draw: 1
      replacement: false
      draw_once_per_act: true
  method_sources:
    common_start: {pool: method_common, ids: [RKF01, RKF02, RKF03, RKF04, RKF05], source: game_start}
    rare_ordinary_events: {pool: method_rare, ids: [RKF06, RKF07, RKF08], source_events: [RE009, RE018, RE027]}
    legendary_core_events: {pool: method_legendary, ids: [RKF09, RKF10], source_events: [RK015, RK016]}
  design_notes:
    status: design_target
    measured: null
    note: 路线中的敌人ID是展示样本；运行时按节点类型池抽取并冻结，不把示意路线当作固定遭遇表。
economy:
  initial_coins: 20
  common_prices_by_act: [40, 40, 40, 40]
  rare_prices_by_act: [90, 90, 90, 90]
  ordinary_coins_by_act: [4, 4, 4, 4]
  elite_coins_by_act: [6, 6, 6, 6]
  boss_coins_by_act: [10, 10, 10, 10]
  ordinary_xp_by_act: [60, 80, 100, 120]
  elite_xp_by_act: [100, 120, 150, 180]
  boss_xp_by_act: [120, 160, 200, 240]
  rest_heal_ratio: 0.25
  event_heal_ratio: 0.2
  reference_hp_by_act: [625, 775, 950, 1150]
  references: 每幕使用公开首领前境界参考气血；X*按当前境界读取下一次完整突破需求，满阶后不可折价。
  artifact_decline_coins: 4
  exhausted_pool_fallback: 明示改领4灵石，不保留原法宝；传奇候选失败不额外补传奇。
  non_artifact_prices:
    recovery: {price: 15, currency: coins, amount: 0.12, basis: reference_hp, mode: raw, stock: 1}
    preparation: {price: 12, currency: coins, effect: shield, amount: 0.10, basis: reference_hp, scope: next_battle, stock: 1}
    talent_reset: {price: 40, currency: coins, effect: reset_current_method_talents, stock: 1}
    inventory_rule: one_each_per_shop_visit
    free_refreshes: 0
  swap_method:
    fee: 0
    fee_currency: coins
    occupies_rest_choice: true
    heals: false
    resets_talents: false
  artifact_reward_sampling:
    ordinary_common: {candidates: 3, draw_once: true, freeze_on_display: true, free_refreshes: 0}
    elite_rare: {candidates: 3, draw_once: true, freeze_on_display: true, free_refreshes: 0}
    boss_rare: {candidates: 3, draw_once: true, freeze_on_display: true, exact_ids_before_battle: false, free_refreshes: 0}
  reward_seeking:
    price: 8
    max_per_act: 1
    families:
      sword: [RC09, RC20, RR01, RR03, RR04, RR10]
      guard: [RC11, RC13, RR02, RR09]
      vitality: [RC05, RC06, RC12, RC17, RC24, RR02, RR06, RR12]
      affliction: [RC14, RC15, RR03, RR11]
  boss_legendary_replacement:
    probability_by_act: [0.02, 0.04, 0.06, 0.08]
    max_replacements: 1
    replaces_candidate: true
    adds_candidate: false
    no_extra_reward: true
    fallback_if_ineligible: rare
    guaranteed: false
  design_notes:
    status: design_target
    measured: null
    note: 本节是四幕商店、休整和奖励的唯一首测参照；价格、权重和传奇替换概率均为目标输入，不是实测结论。
pools:
  common_artifact: {kind: artifact, rarity: common}
  rare_artifact: {kind: artifact, rarity: rare}
  legendary_artifact: {kind: artifact, rarity: legendary}
  method_common: {kind: method, rarity: common}
  method_rare: {kind: method, rarity: rare}
  method_legendary: {kind: method, rarity: legendary}
  owned_methods: {kind: method, owned_only: true}
calibration:
  cumulative_act_pass_rates: [0.80, 0.65, 0.50, 0.35]
  pass_rate_basis: 同一开局样本累计通过第1至4幕；第五幕为独立终战，另列入场后的胜率。自动策略模拟不等同人类玩家实测。
  current_artifact_values: 保留44张卡现有数值，逐卡测A/J后再修订；基础属性参考不构成全部卡达标的证明。
  damage_and_status_values: 新填系数、状态和成长表均是首轮实现输入，必须通过共享参照和实际遭遇复测。
  measured: null
