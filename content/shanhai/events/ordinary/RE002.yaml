kind: event
id: RE002
name: 旧炉余温
status: design_target
summary: 在退潮时加固衣甲、预付炉工等候成器，或把灵石留作渡路之用。
description: 旧炉的余火只够再炼一炉。现成玄铁甲可即刻取走，凝气珠则要先付折价炉钱、避开坊市并走完两处行程。
tags: [ordinary, purchase, attack, defense]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件。
balance:
  target:
    gross_U: [0.75, 1.2]
    J: null
  measured: null
event_type: ordinary
acts: [1]
scene: 炉膛被倒灌的水汽压得忽明忽暗，炉工只来得及照看一件旧器。现成的玄铁甲能立刻带走；未成的凝气珠须预付并等候，空手离开则保住盘缠。
options:
  - id: RE002-A
    label: 即时取走玄铁甲
    quick: 付出标价灵石，立即带走一层玄铁甲以提升防御；灵石不足或该法宝已满层时不能选。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RC03, count: 1}
    costs:
      - {type: resource, resource: coins, amount: 0.75, basis: common_price}
    rewards:
      - {type: artifact, id: RC03, count: 1}
    outcome: 你按现价付清灵石，玄铁甲当场离炉，穿过湿冷风口时多了防护。
    story_echo: 你付清现价取走玄铁甲，沿着退潮露出的干石继续前行。
  - id: RE002-B
    label: 预付炉钱等凝气珠
    quick: 先付折价炉钱；接下来2处地点不进坊市，之后取得两层凝气珠。炉钱不足或该法宝剩余可叠层数不足两层时不能选；失约或到终战未兑现均不退款。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RC19, count: 2}
    costs:
      - {type: resource, resource: coins, amount: 0.45, basis: common_price}
    rewards: []
    outcome: 你先付折价炉钱与炉工立约；凝气珠尚未炼成，失约不会退款。
    story_echo: 你预付炉钱与炉工立约，两处行程尚未走完，凝气珠仍未到手。
    commitment:
      name: 等候凝气珠
      after_nodes: 2
      avoid_node_types: [S]
      rewards:
        - {type: artifact, id: RC19, count: 2}
      success_outcome: 两处行程顺利结束，取得两层凝气珠。
      failure_outcome: 等待期间进入坊市，或到终战仍未兑现，折价炉钱不退，也没有凝气珠。
  - id: RE002-C
    label: 收起灵石离炉
    quick: 放弃两种交易，保留灵石和已有法宝。
    requirements: []
    costs: []
    rewards: []
    outcome: 你没有动炉台上的旧器，带着现有灵石和法宝离开。
    story_echo: 你收好灵石与随身法宝，离炉时没有接下额外等候。
settlement:
  once: true
  internal_battle_package: false
  travel_triggers: 1
  fallback: coins
