id: RE037
name: 三法献祭
status: design_target
summary: 魔修传下三条以永久代价换取强力的斗法法则；可择一立誓，也可不取离开。
description: 石壁将三条法则的代价与收益逐项刻明，立誓后直到本局终结都不可撤销。
tags: [ordinary, sacrifice, permanent_rule, act1, act2, act3, act4]
source:
  basis: original
  reference: null
  note: 游戏原创永久献祭规则；不追加节点或延迟奖励。
balance:
  target:
    gross_U: [0.0, 3.0]
    J: null
  measured: null
event_type: ordinary
acts: [1, 2, 3, 4]
scene: 石壁刻着三条魔门法则，每条都明示永久代价与斗法所得。你可以择一立誓，也可以合上石壁，不取任何法则。
options:
  - id: RE037-A
    label: 立誓·碎丹燃血
    quick: 永久代价：本局气血上限降为原来的 60%。收益：战斗中每缺失 10% 气血，攻击提高 8%（护盾计作气血，最多 +60%）；直接伤害的 8% 化为气血吸回。越近死越凶，但躲在护盾后就失去血怒。
    requirements: []
    costs: []
    rewards: []
    sacrifice_rule: shattered_core
    outcome: 你捏碎金丹，残丹化作一团血火；从此伤得越重，出手越狠，每一击都从敌人身上夺回气血。
    story_echo: 你立下碎丹燃血之誓，气血折去四成，换来以伤换伤、越战越凶的血怒。
  - id: RE037-B
    label: 立誓·盲眼剑圣
    quick: 永久代价：本局再也不会暴击。收益：每次普攻或怒技的直接、派生命中，都把原暴击率（0%–100%）化为剑意，附加“基础伤害 × 1.6 × 暴击率”的真实伤害；无视防御，仍会被护盾吸收，中毒、燃烧与反伤不转化。暴击堆得越高，每一剑越稳越狠。
    requirements: []
    costs: []
    rewards: []
    sacrifice_rule: blind_sword
    outcome: 你蒙眼立下剑誓，暴击化作真实伤害；法则将伴你直到此局终结。
    story_echo: 你立下盲眼剑圣之誓，舍弃暴击，令原有暴击率化作无视防御的剑意。
  - id: RE037-C
    label: 立誓·断普连诀
    quick: 永久代价：本局永不普攻，普攻附带的护盾、燃烧、剑势等效果一并失去。收益：每次出手前怒气补满，每回合都放怒技；怒技伤害 +10%，自身受到的伤害 -20%，怒技最多连斩三式。
    requirements: []
    costs: []
    rewards: []
    sacrifice_rule: endless_chain
    outcome: 你立下断普连诀之誓，封住普攻；从此每一次出手都是绝技，怒意护身，法则将伴你直到此局终结。
    story_echo: 你立下断普连诀之誓，不再普攻，每回合都以绝技出手。
  - id: RE037-D
    label: 合上石壁
    quick: 不立誓，不付代价，不取得任何法则，带着原有行装离开。
    requirements: []
    costs: []
    rewards: []
    outcome: 你合上石壁，没有立誓，也没有取走任何法则。
    story_echo: 你合上石壁，三条法则仍留在原处，继续踏上原本的路。
settlement:
  once: true
  internal_battle_package: false
  travel_triggers: 1
  fallback: coins
