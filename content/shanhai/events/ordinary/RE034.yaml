schema_version: 1
content_version: shanhai-content-0.1
kind: event
id: RE034
name: 最后换法
status: design_target
summary: 天门前决定是否付气血开启功法重选、静坐积修，或保持原路离开。
description: 换法台明示血价，付出后只得到一次从已学功法中重选的机会；静坐使修为提高下一次进阶所需的两成。
tags: [ordinary, method_swap, blood_price, route, act4]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；血价必须存活，换法不回血、不洗点。
balance:
  target:
    gross_U: [0.6, 1.0]
    J: null
  measured: null
event_type: ordinary
acts: [4]
scene: 天门前的换法台刻着血价，旁边石座仍留着一口平静灵息。你可付气血取得功法重选机会、静坐积修，或关台沿当前功法前行。
options:
  - id: RE034-A
    label: 付血开启功法重选
    quick: 付 10% 基准气血后选择另一门已学功法改修；未学适用功法或不能存活则不可选，换法不回血。
    requirements:
      - {type: known_method, id: RKF05}
    costs:
      - {type: resource, resource: hp, amount: 0.1, basis: reference_hp, must_survive: true}
    rewards:
      - {type: swap_method, pool: owned_methods}
    outcome: 血价已经付出；接下来须从其他已学功法中选一门改修，已受的伤不会因换法恢复。
    story_echo: 你付出气血，在换法台前重新择定修行方向，带着未愈的伤走向天门。
  - id: RE034-B
    label: 静坐守住当前法门
    quick: 不损失气血，静坐使修为提高下一次进阶所需的两成；已到当前境界尽头时收益有限。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.2, basis: next_xp}
    outcome: 你在石座上静坐，修为向下一次进阶推进两成；已到当前境界尽头时只留下修为记录。
    story_echo: 你静坐守住当前法门，起身后仍沿自己的道路走向天门。
  - id: RE034-C
    label: 关台沿原路前行
    quick: 不付血价、不改功法，保留当前功法和资源。
    requirements: []
    costs: []
    rewards: []
    outcome: 你关闭换法台，没有付出血价或改变功法与资源。
    story_echo: 你关上换法台，带着原有功法与资源独自走向天门。
settlement:
  once: true
  internal_battle_package: false
  travel_triggers: 1
  fallback: coins
