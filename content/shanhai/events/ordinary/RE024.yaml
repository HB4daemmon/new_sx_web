scene: 火势沿经架下缘爬过，守页人把仅存的养剑诀法本与剑穗移到石门边。你可付标价灵石取一件，或合页保留现有功法。
options:
  - id: RE024-A
    label: 付石收下养剑诀
    quick: 付出标价灵石，带走养剑诀法本；是否改修由你决定。
    requirements:
      - {type: can_pay}
    costs:
