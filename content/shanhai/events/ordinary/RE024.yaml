    story_echo: 你付石收下养剑诀法本，带着未改的现用功法离开渐热的经阁。
  - id: RE024-B
    label: 付石带走剑穗
    quick: 付出标价灵石，带走一层剑穗以强化普攻。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RC09, count: 1}
