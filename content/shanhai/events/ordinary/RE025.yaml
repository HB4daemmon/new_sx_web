schema_version: 1
content_version: shanhai-content-0.1
kind: event
id: RE025
name: 回身换脉
status: design_target
summary: 在旧路的回身石前付灵石开启功法重选、取返气环，或沿当前法门前行。
description: 回身石照出已学过的法脉，但只提供重选机会，不会自动换法；返气环则留有标价，可带走一层。
tags: [ordinary, method_swap, purchase, artifact, act3]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；换法不回血、不洗点、不复制功法。
balance:
  target:
    gross_U: [0.6, 1.0]
    J: null
  measured: null
event_type: ordinary
acts: [3, 4]
scene: 一块旧石面映出你的修行痕迹，返气环在旁边随风轻响。你可以付灵石开启已学功法重选、取环，或不回头继续赶路。
options:
  - id: RE025-A
    label: 付石照见旧法
    quick: 付少量灵石尝试唤起旧法回响；映影未成不退灵石，成功后可换修另一门已学功法。
    requirements:
      - {type: known_method, id: RKF03}
      - {type: can_pay}
    costs:
      - {type: resource, resource: coins, amount: 0.3, basis: common_price}
    rewards:
      - {type: swap_method, pool: owned_methods}
    outcome: 回身石已亮，灵石已经付出；接下来须从其他已学功法中选一门改修，各门已悟天赋仍保留。
    story_echo: 你付石照见已学功法，重新择定修行方向，越过映着旧日身影的石面。
    reveal: hint
    check:
      kind: chance
      hint: 映影可能散去，灵石不退；修习过相近路数、佩有返气之物时更容易唤起回响。
      chance: 0.35
      bonuses:
        - {type: method, id: RKF04, amount: 0.15}
        - {type: artifact, id: RC23, amount: 0.1}
      failure_rewards: []
      failure_outcome: 回身石的映影未能成形，灵石已经付出，仍沿当前功法前行。
      failure_echo: 回身石的映影散去，灵石已付，你沿当前功法继续前行。
  - id: RE025-B
    label: 付石带走返气环
    quick: 付出标价灵石，带走一层返气环以在怒技后额外回怒；灵石不足或该法宝已满层时不能选。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RC23, count: 1}
    costs:
      - {type: resource, resource: coins, amount: 0.75, basis: common_price}
    rewards:
      - {type: artifact, id: RC23, count: 1}
    outcome: 你付石取下一层返气环，之后怒技后的回怒会受其效果影响。
    story_echo: 你付石系上返气环，越过旧石时，身后修行影子渐渐淡去。
  - id: RE025-C
    label: 不回头沿旧法前行
    quick: 不付灵石，放弃重选与法宝，保留当前功法继续前行。
    requirements: []
    costs: []
    rewards: []
    outcome: 你没有取石边机缘，沿用当前功法继续前行。
    story_echo: 你不回头取机缘，沿着当前功法走过石面，行囊与旧路都未更改。
settlement:
  once: true
  internal_battle_package: false
  travel_triggers: 1
  fallback: coins
