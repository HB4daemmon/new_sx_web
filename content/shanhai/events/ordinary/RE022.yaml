name: 断炉商筹
status: design_target
summary: 熄火沟边用余料为下一战备盾、折回盘缠，或静坐积累修为。
description: 炉火将熄，余料可付灵石留给下一场战斗作护盾准备，也可折成灵石或用来静坐修行。
tags: [ordinary, shop_prep, preparation, act3]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；准备效果不复制商店库存。
balance:
  target:
    gross_U: [0.5, 1.0]
    J: null
  measured: null
event_type: ordinary
acts: [3]
scene: 熔灰压住炉口，炉工把一份未用尽的护行余料放到石沿。你可以付标价灵石留作下一战护盾，取一笔盘缠，或借短暂清静修行。
options:
  - id: RE022-A
    label: 付石留作战盾
    quick: 付出标价灵石，为下一场战斗准备一层护盾；灵石不足不能选。
    requirements:
      - {type: can_pay}
    costs:
      - {type: resource, resource: coins, amount: 0.75, basis: common_price}
    rewards:
      - {type: preparation, effect: shield, amount: 0.1, basis: reference_hp}
    outcome: 你付出标价灵石把余料留作下一场战斗的一层护盾准备。
    story_echo: 你付石留好下一战护盾准备，收起炭灰旁的气息继续深入火海。
  - id: RE022-B
    label: 折回盘缠
    quick: 不付灵石，取得一笔灵石留作后续所用。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: coins, amount: 0.25, basis: common_price}
    outcome: 你收下炉工折回的灵石，余料没有变成战斗准备。
    story_echo: 你收下折回的灵石，没有预作战斗准备，绕开炉口的塌灰继续走。
  - id: RE022-C
    label: 借炉余温静坐
    quick: 不耗灵石；静坐使修为提高下一次进阶所需的两成。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.2, basis: next_xp}
    outcome: 你在炉边静坐，修为向下一次进阶推进两成。
    story_echo: 你借炉火将熄前的余温静坐修行，起身后继续追踪火流去向。
settlement:
