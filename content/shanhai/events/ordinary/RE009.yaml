    costs:
      - {type: resource, resource: coins, amount: 1.0, basis: common_price}
    rewards:
      - {type: artifact, id: RC01, count: 1}
    outcome: 你付出灵石带走一层青锋石，没有进入试场。
    story_echo: 你以灵石换来一层青锋石，绕过灯场，顺着河岸继续行路。
  - id: RE009-C
    label: 提灯离开河岸
    quick: 提灯离台，保留气血与灵石。
    requirements: []
    costs: []
    rewards: []
    outcome: 你不接试诀，也没有花费灵石，提灯离开石台。
    story_echo: 你提灯沿河岸离开，气血与灵石留在身边，灯影渐远。
