name: 河灯试诀
status: design_target
summary: 在河岸灯场试取五毒经、付灵石取青锋石，或收灯保存气力。
description: 河道边的灯场以一场非致死试诀作通行约定，胜者取得五毒经；失手至少保留 1 点气血且无奖励，也可付石绕开试场。
tags: [ordinary, nonlethal, encounter, rare_method]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；稀有法本不是稀有法宝预算，不自动换法。
balance:
  target:
    gross_U: [1.0, 1.8]
    J: null
  measured: null
event_type: ordinary
acts: [1, 2]
scene: 水线逼近灯场，主持试诀的人把五毒经置于干燥石台。你可以参加非致死比试、付灵石带走青锋石，或提灯离开。
options:
  - id: RE009-A
    label: 接下河岸试诀
    quick: 参加非致死试诀，胜利取得五毒经；失手后至少保留 1 点气血且无奖励。
    requirements: []
    costs: []
    rewards:
      - {type: method, id: RKF06}
    encounter:
      enemy_id: EN-A1-L1
      mode: nonlethal
      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 你被主持人逼回石台下，至少保留 1 点气血；五毒经没有交到你手上。
    outcome: 你赢下非致死试诀，五毒经落入囊中，暂时仍可沿用原先功法。
    story_echo: 你赢下灯场试诀并带走五毒经，河灯照出的浅滩可供继续辨路。
    story_failure_echo: 你被逼回灯场石台外，至少保留 1 点气血；五毒经没有交到你手上。
  - id: RE009-B
    label: 付石绕开试场取锋
    quick: 付出标价灵石，带走一层青锋石以增强攻击；灵石不足或该法宝已满层时不能选。
    requirements:
      - {type: can_pay}
