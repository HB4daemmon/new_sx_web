kind: event
id: RE026
name: 雷骨难题
status: design_target
summary: 在火流旁按价选镇心玉或凝气珠，或保留灵石和当前法宝。
description: 被热流磨亮的雷骨里封着两种力量：高价镇心玉提升防御并在战斗中积攒攻击，较便宜的凝气珠提升攻击但降低怒气上限。
tags: [ordinary, rare_artifact, purchase, attack, act3]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；稀有法宝有显著成本并按 B=2.4 预算记账。
balance:
  target:
    gross_U: [0.75, 2.4]
    J: null
  measured: null
event_type: ordinary
acts: [3]
scene: 雷骨被余火顶出裂纹，镇心玉和凝气珠分别落在石缝两侧。取镇心玉须付高价，取凝气珠标价较低但会降低怒气上限，也可把两件留在原处。
options:
  - id: RE026-A
    label: 付高价取镇心玉
    quick: 付出高价灵石，带走镇心玉以提升防御并在战斗中积攒攻击；灵石不足或该法宝已满层时不能选。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RR05, count: 1}
    costs:
      - {type: resource, resource: coins, amount: 2.0, basis: common_price}
    rewards:
      - {type: artifact, id: RR05, count: 1}
    outcome: 你付出高价灵石带走镇心玉，防御提升，战斗中的攻击积累仍待实际发生。
    story_echo: 你付高价带走镇心玉，护身之力随行，雷骨留在余火旁。
  - id: RE026-B
    label: 付较低标价取凝气珠
    quick: 付出较低标价灵石，带走一层凝气珠；攻击提高、怒气上限降低，灵石不足或该法宝已满层时不能选。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RC19, count: 1}
    costs:
      - {type: resource, resource: coins, amount: 0.75, basis: common_price}
    rewards:
      - {type: artifact, id: RC19, count: 1}
    outcome: 你付出较低标价灵石带走一层凝气珠，攻击提高而怒气上限降低。
    story_echo: 你按较低标价取走凝气珠，接受较低怒气上限，沿火流边继续走。
  - id: RE026-C
    label: 留下雷骨继续探路
    quick: 不取器物、不付灵石，观察雷骨裂纹后继续前行。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.1, basis: next_xp}
    outcome: 你把两件法宝留在雷骨旁，观察裂纹中的余火脉络后继续探路，积累少量修为。
    story_echo: 你观察雷骨裂纹与余火脉络后继续探路，没有取走法宝。
