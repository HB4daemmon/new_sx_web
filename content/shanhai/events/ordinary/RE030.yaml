name: 天门血契
status: design_target
summary: 到达天门前付气血取养气玉或长生结，或避开血契静坐修行。
description: 石缝里的血契写明取出要损失约138点气血，并各给两层法宝；静坐则让修为提高下一次进阶所需的两成。
tags: [ordinary, blood_price, two_layers, artifact, act4]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件。
balance:
  target:
    gross_U: [1.5, 2.0]
    J: null
  measured: null
event_type: ordinary
acts: [4]
scene: 天门外的石缝闪着血契纹路，石台上没有风。取任一血契都要付出气血，静坐可积累修为；眼前的抉择不会替你渡过天门。
options:
  - id: RE030-A
    label: 付血取两层养气玉
    quick: 损失约138点气血，带走两层养气玉并提高最大气血；该法宝须能再叠两层且能存活，否则不能选。
    requirements:
      - {type: capacity, id: RC05, count: 2}
    costs:
      - {type: resource, resource: hp, amount: 0.12, basis: reference_hp, must_survive: true}
    rewards:
      - {type: artifact, id: RC05, count: 2}
    outcome: 你付出气血撕开血契，取出两层养气玉，最大气血提高。
    story_echo: 你付出气血取下两层养气玉，血契散去，最后的天门仍未跨过。
  - id: RE030-B
    label: 付血取两层长生结
    quick: 损失约138点气血，带走两层长生结并提高最大气血；该法宝须能再叠两层且能存活，否则不能选。
    requirements:
      - {type: capacity, id: RC06, count: 2}
    costs:
      - {type: resource, resource: hp, amount: 0.12, basis: reference_hp, must_survive: true}
    rewards:
      - {type: artifact, id: RC06, count: 2}
    outcome: 你付出气血撕开血契，取出两层长生结，最大气血提高。
    story_echo: 你付出气血取下两层长生结，将散落的契文留在天门石缝。
  - id: RE030-C
    label: 不取血契静坐
    quick: 不损失气血、不取血契，静坐使修为提高下一次进阶所需的两成；已到当前境界尽头时收益有限。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.2, basis: next_xp}
    outcome: 你在石台上静坐，修为向下一次进阶推进两成；已到当前境界尽头时只留下修为记录。
    story_echo: 你没有动血契，在石台上静坐修行，天门依旧留给下一步决定。
