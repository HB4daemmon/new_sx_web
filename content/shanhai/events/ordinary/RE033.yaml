status: design_target
summary: 在最后一盏孤灯下付灵石留归元诀或返气环，也可不取。
description: 守灯人用余火照出一卷归元诀和一层返气环；前者不会自动改修，后者可在怒技后额外回怒。
tags: [ordinary, method, purchase, artifact, act4]
