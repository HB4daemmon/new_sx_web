schema_version: 1
content_version: shanhai-content-0.2
kind: event
id: RE031
name: 终程筹币
status: design_target
summary: 前往天门前分配行装：付灵石备下一战护盾、折取盘缠，或积累修为。
description: 旧阵里的筹牌留下几份余料，可付标价灵石留作下一场护盾准备，也能折成灵石或用于修行。
tags: [ordinary, shop_prep, preparation, act4]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；准备不增加节点、不生成免费商店物品。
balance:
  target:
    gross_U: [0.5, 1.0]
    J: null
  measured: null
event_type: ordinary
acts: [4]
scene: 昆仑前的风掠过空筹牌，牌面不再指向别处市集，只留下一份行路余料。你可付石备下一战护盾、折回盘缠，或将心神留给修行。
options:
  - id: RE031-A
    label: 付石修补护行灵材
    quick: 付少量灵石尝试修补护行灵材，成形后才可备战；未成不退灵石。
    requirements:
      - {type: can_pay}
    costs:
      - {type: resource, resource: coins, amount: 0.2, basis: common_price}
    rewards:
      - {type: preparation, effect: shield, amount: 0.1, basis: reference_hp}
    outcome: 你付出标价灵石，把护行灵材留作下一场战斗的一层护盾准备。
    story_echo: 你付石备好下一战护盾，收束行囊后仍要独自走完门前这段路。
    reveal: hint
    check:
      kind: chance
      hint: 余料可能无法成形，灵石不退；护体路数与持盾器物能提高成功机会。
      chance: 0.55
      bonuses:
        - {type: method, id: RKF05, amount: 0.1}
        - {type: artifact, id: RC22, amount: 0.1}
      failure_rewards: []
      failure_outcome: 灵材受损，未能留作护盾准备，标价灵石已经付出。
      failure_echo: 灵材没能撑住，未能制成护盾准备，标价灵石已付出。
  - id: RE031-B
    label: 折回盘缠带上路
    quick: 不付灵石，取得一笔灵石留给最后一段路。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: coins, amount: 0.25, basis: common_price}
    outcome: 你收下折回的灵石，没有预作护盾准备，最后一段路仍由自己安排。
    story_echo: 你把折回的灵石收进囊中，没有备盾，独自向前门行去。
  - id: RE031-C
    label: 静坐积累修为
    quick: 不耗灵石，静坐使修为提高下一次进阶所需的两成；已到当前境界尽头时收益有限。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.2, basis: next_xp}
    outcome: 你在门前静坐，让修为向下一次进阶推进两成；已到当前境界尽头时只留下修为记录。
    story_echo: 你在门前静坐积修，起身后继续独自走向最后的关口。
settlement:
  once: true
  internal_battle_package: false
  travel_triggers: 1
  fallback: coins
