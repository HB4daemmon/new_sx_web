id: RE008
name: 炉影换法
status: design_target
summary: 付灵石打开已学功法的重选机会、取玄铁甲，或熄影继续赶路。
description: 一处旧炉映出你曾学过的法门，余料还能换一层玄铁甲；改修仅能从已学功法中选择，且不会回血或洗点。
tags: [ordinary, method_swap, purchase, route]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；换法不回血、不洗点、不继承临时状态。
balance:
  target:
    gross_U: [0.6, 1.0]
    J: null
  measured: null
event_type: ordinary
acts: [1, 3]
scene: 旧炉里浮起熟悉的法脉投影，边上留着一层玄铁甲。炉火不辨来路，只给你一次选择：付石开重选、取甲，或让影子熄下。
options:
  - id: RE008-A
    label: 付石开启功法重选
    quick: 付出标价灵石后选择另一门已学功法改修；灵石不足或未学适用功法不能选，不回血、不洗点。
    requirements:
      - {type: known_method, id: RKF01}
      - {type: can_pay}
    costs:
      - {type: resource, resource: coins, amount: 0.75, basis: common_price}
    rewards:
      - {type: swap_method, pool: owned_methods}
    outcome: 炉影已开，灵石已经付出；接下来须从其他已学功法中选一门改修，伤势与各门已悟天赋保留。
    story_echo: 你付石请炉影照出旧法，重新择定修行方向，沿着炉边窄路离开。
  - id: RE008-B
    label: 付石取走玄铁甲
    quick: 付出标价灵石，带走一层玄铁甲以提升防御；灵石不足或该法宝已满层时不能选。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RC03, count: 1}
    costs:
      - {type: resource, resource: coins, amount: 0.75, basis: common_price}
    rewards:
      - {type: artifact, id: RC03, count: 1}
    outcome: 你付出灵石带走一层玄铁甲，炉火里的寒光沉入甲片。
    story_echo: 你付石取走一层玄铁甲，绕开炉旁的湿滑石面继续赶路。
  - id: RE008-C
    label: 熄影沿旧路前行
    quick: 熄灭炉影，保留当前功法和资源。
    requirements: []
    costs: []
    rewards: []
    outcome: 你让炉影归于寂静，熟悉的功法与手中资源都未改变。
    story_echo: 你没有动炉火或行囊，沿着熟悉的功法继续前行。
