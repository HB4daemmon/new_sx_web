name: 火门试手
status: design_target
summary: 在火口外试取蛇纹瓶或赤炎珠、付灵石取厚土环，或不入场。
description: 火口旁的非致死试场摆着两份可选法宝，失手只退至白线外并至少保留 1 点气血；付灵石可直接取厚土环避开比试。
tags: [ordinary, nonlethal, encounter, two_layers, act3]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；内部比试不发普通战包或 RR06。
balance:
  target:
    gross_U: [1.5, 2.0]
    J: null
  measured: null
event_type: ordinary
acts: [3]
scene: 余火逼近白线，守场弟子把蛇纹瓶与赤炎珠分别放在两端，厚土环留在冷石上。你可试取其中一件、付标价灵石取环，或退离试场。
options:
  - id: RE023-A
    label: 参加试场取蛇纹瓶
    quick: 参加非致死试手，胜利带走两层蛇纹瓶；失手至少保留 1 点气血且无奖励，该法宝须能再叠两层否则不能选。
    requirements:
