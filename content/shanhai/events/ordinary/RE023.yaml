      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 你被火门弟子逼退至白线外，至少保留 1 点气血；蛇纹瓶仍留在场中。
    outcome: 你赢下非致死试手，取走两层蛇纹瓶。
    story_echo: 你赢下白线内的试手，取走两层蛇纹瓶，火门弟子收起试场。
    story_failure_echo: 你被逼退至白线外，至少保留 1 点气血，蛇纹瓶仍留在试场。
  - id: RE023-B
    label: 参加试场取赤炎珠
    quick: 参加非致死试手，胜利带走两层赤炎珠；失手至少保留 1 点气血且无奖励，该法宝须能再叠两层否则不能选。
    requirements:
      - {type: capacity, id: RC15, count: 2}
    costs: []
    rewards:
      - {type: artifact, id: RC15, count: 2}
    encounter:
      enemy_id: EN-A3-C3
      mode: nonlethal
      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 你被火门弟子逼退至白线外，至少保留 1 点气血；赤炎珠仍留在场中。
    outcome: 你赢下非致死试手，取走两层赤炎珠。
    story_echo: 你赢下白线内的试手，取走两层赤炎珠，随后离开余火边缘。
