name: 驳船整甲
status: design_target
summary: 越过碎礁水道前，以灵石换锋势或护身，也可不取旧铁。
description: 驳船要沿着被逆流抬高的碎礁穿行，船工的旧铁片只够炼一件：剑穗能强化普攻，铁壁符能提升防御并增强护盾。
tags: [ordinary, purchase, attack, defense, act2]
