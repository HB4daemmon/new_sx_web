  target:
    gross_U: [0.75, 1.0]
    J: null
  measured: null
event_type: ordinary
acts: [2]
scene: 船底刮过露出水面的碎礁，旧铁片在船工手里只够炼成一件。付标价灵石取剑穗、取铁壁符，或不取器物直接过水。
options:
  - id: RE011-A
    label: 付石锻成剑穗
    quick: 付出标价灵石，带走一层剑穗以强化普攻；灵石不足或该法宝已满层时不能选。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RC09, count: 1}
    costs:
      - {type: resource, resource: coins, amount: 1.0, basis: common_price}
    rewards:
      - {type: artifact, id: RC09, count: 1}
    outcome: 你付石带走一层剑穗，系紧兵刃后仍需自己找出碎礁间的落脚处。
    story_echo: 你付石系上剑穗，普攻得到强化，驳船顺着礁间水道向前。
  - id: RE011-B
    label: 付石钉上铁壁符
    quick: 付出标价灵石，带走一层铁壁符以提升防御并增强护盾；灵石不足或该法宝已满层时不能选。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RC11, count: 1}
    costs:
      - {type: resource, resource: coins, amount: 1.0, basis: common_price}
    rewards:
      - {type: artifact, id: RC11, count: 1}
    outcome: 你付石带走一层铁壁符，护体更稳，碎礁仍需谨慎通过。
    story_echo: 你付石钉上铁壁符，驳船经过碎礁时护身之力随行。
  - id: RE011-C
    label: 不取旧铁过水
    quick: 不付灵石、不取法宝，保留现有资源继续过碎礁。
    requirements: []
    costs: []
    rewards: []
    outcome: 船工收起旧铁，驳船继续向前，你的灵石与法宝没有改变。
    story_echo: 你不取船工的旧铁，带着原有行装穿过碎礁水道。
