name: 商舟看牌
status: design_target
summary: 过河前分配一份船上余料：付灵石备下一战护盾，或留盘缠、修为。
description: 商舟要穿过被顶回的河面，船家手里只剩一份护行灵材，可抵下一场战斗的护盾、折作灵石或静坐修行。
tags: [ordinary, shop_prep, preparation, act2]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；准备效果只作用于后续明确窗口。
balance:
  target:
    gross_U: [0.5, 1.0]
    J: null
  measured: null
event_type: ordinary
acts: [2]
scene: 货牌被河风翻到背面，船家不再谈远处市集，只让你选如何处置一份余料：付石备护、拿灵石，或静坐积累修为。
options:
  - id: RE013-A
    label: 付石备好下一战
    quick: 付出标价灵石，为下一场战斗准备一层护盾；灵石不足不能选。
    requirements:
      - {type: can_pay}
    costs:
      - {type: resource, resource: coins, amount: 0.5, basis: common_price}
    rewards:
      - {type: preparation, effect: shield, amount: 0.1, basis: reference_hp}
    outcome: 你付出标价灵石，把护行灵材留作下一场战斗的一层护盾准备。
    story_echo: 你付石备下下一战护盾，商舟继续横渡，护盾尚待战前生效。
  - id: RE013-B
    label: 折回一笔盘缠
    quick: 不付灵石，取得一笔灵石留作之后行路。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: coins, amount: 0.25, basis: common_price}
    outcome: 你收下折回的灵石，船家把余料留在舱中。
    story_echo: 你收下船家折回的灵石，未作战备，在河面另一侧下船。
  - id: RE013-C
    label: 趁船平稳静坐
    quick: 不耗灵石；静坐使修为提高下一次进阶所需的两成。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.2, basis: next_xp}
    outcome: 你在船行平稳时静坐，修为向下一次进阶推进两成。
    story_echo: 你借横渡时的片刻平稳静坐修行，随后随商舟抵达对岸。
settlement:
