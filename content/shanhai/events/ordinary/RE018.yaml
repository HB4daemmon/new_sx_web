id: RE018
name: 落雷门槛
status: design_target
summary: 在逆流水线中试取奔雷诀、付灵石买先机符，或保存气力绕行。
description: 一段旧路被回流雷光横截，雷影守着奔雷诀；非致死试诀失手后至少保留 1 点气血，法本不会交出。
tags: [ordinary, nonlethal, encounter, rare_method, act2]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件；法本取得不折算稀有法宝 B，也不强制换法。
balance:
  target:
    gross_U: [0.8, 1.8]
    J: null
  measured: null
event_type: ordinary
acts: [2, 4]
scene: 雷光沿着被回流冲断的旧路来回游走，雷影守着一卷奔雷诀。你可参加试诀、付标价灵石取先机符，或绕开雷光继续找路。
options:
  - id: RE018-A
    label: 进入雷光试诀
    quick: 参加非致死试诀，胜利取得奔雷诀；失手至少保留 1 点气血且无奖励。
    requirements: []
    costs: []
    rewards:
      - {type: method, id: RKF07}
    encounter:
      enemy_id: EN-A2-L1
      mode: nonlethal
      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 你被雷影逼离雷光路段，至少保留 1 点气血；奔雷诀仍在原处。
    outcome: 你通过非致死试诀，取得奔雷诀，眼下仍可沿用原来的功法。
    story_echo: 你赢下雷光试诀，收下奔雷诀，之后是否改修仍由你决定。
    story_failure_echo: 你被雷影逼离雷光路段，至少保留 1 点气血，奔雷诀没有到手。
  - id: RE018-B
    label: 付石取先机符
    quick: 付出标价灵石，带走一层先机符并避开试诀；灵石不足或该法宝已满层时不能选。
    requirements:
      - {type: can_pay}
      - {type: capacity, id: RC22, count: 1}
    costs:
      - {type: resource, resource: coins, amount: 1.0, basis: common_price}
    rewards:
      - {type: artifact, id: RC22, count: 1}
    outcome: 你付出灵石带走一层先机符，没有参加雷光试诀。
    story_echo: 你付石收下先机符，绕开雷光截路处，继续循着回流方向探行。
  - id: RE018-C
    label: 沿安全边绕行
    quick: 不付灵石、不参加试诀，保留气血与资源绕行。
    requirements: []
    costs: []
    rewards: []
    outcome: 你没有参加试诀，绕开雷光路段，气血与资源都未改变。
    story_echo: 你从雷光边缘绕行，气血与资源仍在手中，旧路还需继续辨认。
