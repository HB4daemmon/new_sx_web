    outcome: 你付出灵石带走一层铁壁符，离开旧桥时没有参加试招。
    story_echo: 你付石取下铁壁符，避开白线试招，沿河岸寻找安全的接桥处。
  - id: RE014-C
    label: 退回岸边
    quick: 不参加试招、不付灵石，保留气血与资源另寻通路。
