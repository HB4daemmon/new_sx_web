scene: 旧桥的白线标出还能站稳的一段，守桥人亮出雷纹印。你可以参加试招、付标价灵石取铁壁符，或退回岸边另找通路。
options:
  - id: RE014-A
    label: 留在线内试雷纹
    quick: 参加非致死试招，胜利带走两层雷纹印；失手至少保留 1 点气血且无奖励，该法宝须能再叠两层否则不能选。
    requirements:
      - {type: capacity, id: RC10, count: 2}
    costs: []
    rewards:
      - {type: artifact, id: RC10, count: 2}
    encounter:
      enemy_id: EN-A2-C2
      mode: nonlethal
      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 你被守桥人逼回桥头，至少保留 1 点气血；雷纹印仍留在桥面。
    outcome: 你在白线内赢下非致死试招，带走两层雷纹印。
    story_echo: 你赢下白线内的试招，取走两层雷纹印，桥面仍需小心通过。
    story_failure_echo: 你被守桥人逼回桥头，至少保留 1 点气血，雷纹印没有到手。
  - id: RE014-B
    label: 付石取铁壁符绕行
    quick: 付出标价灵石，带走一层铁壁符并避开试招；灵石不足或该法宝已满层时不能选。
    requirements:
