name: 石桥点斗
status: design_target
summary: 沿旧桥试取雷纹印、付灵石换铁壁符，或保住气力退回河岸。
description: 桥面被逆流冲断一截，守桥人以非致死试招守着两层雷纹印；失手会退回桥头并至少保留 1 点气血。
tags: [ordinary, nonlethal, encounter, two_layers, act2]
