id: RE012
name: 锈锁双匣
status: design_target
summary: 在旧河墩前付气血撬开木匣，或不碰锁匣静坐修行。
description: 锈锁后的养气玉与厚土环都可取两层，但滚烫锁芯会割伤手；静坐所得修为提高下一次进阶所需的两成。
tags: [ordinary, blood_price, two_layers, artifact, act2]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件。
balance:
  target:
    gross_U: [1.5, 2.0]
    J: null
  measured: null
event_type: ordinary
acts: [2]
scene: 水流冲开旧河墩，锈锁下两只木匣仍紧扣不动。养气玉与厚土环隔板泛光，撬锁要损失约78点气血，旁边尚有一块可静坐的干石。
options:
  - id: RE012-A
    label: 以气血撬锁取养气玉
    quick: 损失约78点气血，带走两层养气玉并提高最大气血；该法宝须能再叠两层且能存活，否则不能选。
    requirements:
      - {type: capacity, id: RC05, count: 2}
    costs:
      - {type: resource, resource: hp, amount: 0.1, basis: reference_hp, must_survive: true}
    rewards:
      - {type: artifact, id: RC05, count: 2}
    outcome: 你付出气血撬开木匣，取出两层养气玉，气血根基随之提高。
    story_echo: 你忍痛撬开木匣取走两层养气玉，河墩上留下被水磨亮的锁片。
  - id: RE012-B
    label: 以气血撬锁取厚土环
    quick: 损失约78点气血，带走两层厚土环并提升防御；该法宝须能再叠两层且能存活，否则不能选。
    requirements:
      - {type: capacity, id: RC04, count: 2}
    costs:
      - {type: resource, resource: hp, amount: 0.1, basis: reference_hp, must_survive: true}
    rewards:
      - {type: artifact, id: RC04, count: 2}
    outcome: 你付出气血撬开木匣，取出两层厚土环，护身之力贴上肩背。
    story_echo: 你忍痛撬出两层厚土环，带着更稳的防护离开冲水的河墩。
  - id: RE012-C
    label: 放下锁匣静坐
    quick: 不耗气血、不碰木匣；静坐使修为提高下一次进阶所需的两成。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.2, basis: next_xp}
    outcome: 你没有撬锁，在干石上静坐，让修为向下一次进阶推进两成。
    story_echo: 你放下滚烫锁匣，在河墩干石上静坐片刻后重新上路。
