kind: event
id: RE003
name: 灰烬石匣
status: design_target
summary: 在熄灭的火痕里付气血取锋或护甲，也可不冒险捡起灵石。
description: 灰烬压住石匣，匣底仍烫，外沿则散着冷却的灵石。探入匣底会付出气血，是否值得要看你还剩多少余力。
tags: [ordinary, blood_price, two_layers, artifact]
source:
  basis: original
  reference: null
  note: 游戏原创普通事件。
balance:
  target:
    gross_U: [1.5, 2.0]
    J: null
  measured: null
event_type: ordinary
acts: [1, 2]
scene: 逆流掀开的火灰盖住匣沿，青锋石与玄铁甲压在最深处，几枚灵石滚到冷灰边。伸手取宝会损失约定比例的气血，拾石不必受伤。
options:
  - id: RE003-A
    label: 忍灼取出青锋石
    quick: 损失约75点气血（第二幕约93点），带走两层青锋石；该法宝须能再叠两层且能存活，否则不能选。
    requirements:
      - {type: capacity, id: RC01, count: 2}
    costs:
      - {type: resource, resource: hp, amount: 0.12, basis: reference_hp, must_survive: true}
    rewards:
      - {type: artifact, id: RC01, count: 2}
    outcome: 你付出气血从匣底取出两层青锋石，锋芒沾灰，去路仍被逆水截断。
    story_echo: 灼痛过后，两层青锋石落入你手中；你留着气力继续寻找可走的岸线。
  - id: RE003-B
    label: 忍灼取出玄铁甲
    quick: 损失约75点气血（第二幕约93点），带走两层玄铁甲；该法宝须能再叠两层且能存活，否则不能选。
    requirements:
      - {type: capacity, id: RC03, count: 2}
    costs:
      - {type: resource, resource: hp, amount: 0.12, basis: reference_hp, must_survive: true}
    rewards:
      - {type: artifact, id: RC03, count: 2}
    outcome: 你付出气血从匣底取出两层玄铁甲，沉重的护意贴上肩背。
    story_echo: 你忍痛取出两层玄铁甲，穿过落灰的窄路时护甲贴紧肩背。
  - id: RE003-C
    label: 捡起冷灰边的灵石
    quick: 拾走外沿灵石，不必损失气血。
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: coins, amount: 0.2, basis: common_price}
    outcome: 你拾起外沿冷石折成灵石，没有再伸手碰滚烫的匣底。
    story_echo: 你捡起冷灰边的灵石，避开烫匣，沿石阶继续探路。
settlement:
