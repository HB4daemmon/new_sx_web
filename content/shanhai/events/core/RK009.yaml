schema_version: 1
content_version: shanhai-content-0.2
kind: event
id: RK009
name: 哪吒先过阵
status: design_target
summary: 哪吒邀你先闯第一阵；须付 8% 基准气血，胜利才有后段资格，失手至少保留 1 点且无奖。
description: 断桥上游的水势逼人，哪吒在旁路摆下两阵，一阵重击、一阵连招。他先说明第一阵的代价与收手处，不会因你应战就先给器物。
tags: [core, character_encounter, nezha, first_meeting, staged_trial]
source:
  basis: myth_adaptation
  reference: canon.fengjian_chunqiu.character.e8205e7a1
  note: 原典库以draft实体确认哪吒的神将身份；过阵、失败线和奖励是游戏原创改编。
  identity: 哪吒知识库摘要包含三头六臂、风火二轮和火尖枪等身份信息。
  game_original: 两段过阵、先胜后可回访和普通付石替代均为游戏改编。
balance:
  target:
    gross_U: [0, 0.5]
  measured: null
event_type: core
acts: [2]
scene: 山场水声穿过两面阵旗，哪吒把重阵留在前、连阵留在后。先付 8% 基准气血再挑战；实际伤害随交手变化，胜利才可回访，失手至少保留 1 点。
options:
  - id: RK009-enter-first-array
    label: 先接重阵
    quick: 付 8% 基准气血挑战，胜利留第二阵资格；失手至少保留 1 点气血且无奖。
    requirements: []
    costs:
      - {type: resource, resource: hp, amount: 0.08, basis: reference_hp, must_survive: true}
    rewards: []
    set_flags:
      RS05-promised: true
    outcome: 你过了第一阵，哪吒没有发宝，只留下第四幕继续接阵的资格。
    story_echo: 你闯过重阵，哪吒只留下后段的第二阵资格；器物还不属于你。
    encounter:
      enemy_id: EN-A2-L2
      mode: nonlethal
      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 重阵把你逼退，哪吒收起第二阵的牌；气血至少保留 1 点，后段不再开第二阵，也没有战斗奖励。
    story_failure_echo: 你没闯过重阵，气血至少保留 1 点；哪吒收起第二阵的牌，没有给你战斗奖励。
  - id: RK009-take-safe
    label: 收下小修行
    quick: 获得一笔修为，放弃两阵约定，不参加挑战
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.1, basis: next_xp}
    outcome: 你不把气血押在阵门上，先拿修为继续赶路。
    story_echo: 你拿了修为，哪吒收起阵旗；这段路不再要求你闯阵。
  - id: RK009-leave
    label: 退出阵门
    quick: 不付气血、不取修为或法宝，退出阵门回主路
    requirements: []
    costs: []
    rewards: []
    outcome: 你看清两阵的锋口后转身，哪吒让开公共路线。
    story_echo: 你看清阵门便转身离开，哪吒让开路；这次不留下任何挑战结果。
settlement:
  once: true
  internal_battle_package: false
  travel_triggers: 1
  fallback: coins
