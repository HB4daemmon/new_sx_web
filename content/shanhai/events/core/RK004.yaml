schema_version: 1
content_version: shanhai-content-0.2
kind: event
id: RK004
name: 精卫清礁回访
status: design_target
summary: 回到近礁后可试着清出窄路，胜利取毒牙钉；也可付 20 灵石取蛇纹瓶，或就此收手。
description: 精卫带你认出初遇标下的礁口。她没把试炼说成必胜：清礁失手不会有奖，付石可绕开最险的一段，不继续也能回到主路。
tags: [core, character_encounter, jingwei, follow_up, dangerous_trial]
source:
  basis: myth_adaptation
  reference: null
  note: 原典身份待知识库核验；清礁回访和奖励为游戏原创。
  identity: 精卫填海故事本次离线检索未命中可追溯实体或段落。
  game_original: 非致命清礁战、普通付石替代和回访旗标均为游戏改编。
balance:
  target:
    gross_U: [2.4, 4.0]
  measured: null
event_type: core
acts: [3]
scene: 潮线退开一瞬，礁石露出锋口；精卫指明回到堤边的路。你可直接挑战、付 20 灵石取蛇纹瓶，或不再投入而离开。
options:
  - id: RK004-clear-reef
    label: 迎潮清礁
    quick: 参加清礁战，胜利取毒牙钉；战斗伤害随实战变化，失手至少保留 1 点气血且无奖。
    requirements:
      - {type: flag, id: RS02-promised, value: true}
    costs: []
    rewards:
      - {type: artifact, id: RR03, count: 1}
    outcome: 你把礁口清成一条窄路，胜利后得到毒牙钉；它的攻击提升立即计入，下一场战斗的普攻首击会带毒。
    story_echo: 你清开礁口，精卫收起路标；胜利让你带走毒牙钉，窄路也留给后来的人通行。
    encounter:
      enemy_id: EN-A3-B1
      mode: nonlethal
      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 你没能清开礁口，精卫把剩下的路标回公共道路；气血至少保留 1 点，毒牙钉没有到手。
    story_failure_echo: 礁口仍没清开，你负伤退回堤边；毒牙钉未得，精卫为你指回主路。
  - id: RK004-pay-route
    label: 付石走堤
    quick: 支付 20 灵石，不打清礁战并取蛇纹瓶
    requirements:
      - {type: flag, id: RS02-promised, value: true}
      - {type: can_pay}
    costs:
      - {type: resource, resource: coins, amount: 20, basis: flat}
    rewards:
      - {type: artifact, id: RC14, count: 1}
    outcome: 你用盘缠买到蛇纹瓶；它的攻击提升立即计入，下一场战斗中的中毒会更猛烈。
    story_echo: 你付出 20 灵石取走蛇纹瓶，精卫把最险的礁群留在身后，不逼你涉险。
  - id: RK004-stop
    label: 收手回公共路
    quick: 收手回公共道路，不挑战、不付灵石，也不取器物
    requirements:
      - {type: flag, id: RS02-promised, value: true}
    costs: []
    rewards: []
    outcome: 你不再把气血压在潮下，承诺到此结束，毒牙钉和蛇纹瓶都留在堤边。
    story_echo: 你收起追礁的心思，精卫收好器物；这次回访到此为止。
settlement:
  once: true
  internal_battle_package: false
  travel_triggers: 1
  fallback: coins
