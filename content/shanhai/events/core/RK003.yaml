kind: event
id: RK003
name: 精卫筑堤
status: design_target
summary: 精卫在堤口补缺，你可拿眼前修为，也可承受潮击并存活，约好后段再清礁。
description: 精卫沿着潮线一块块垒石，近礁仍挡着逆流的旧路。她不替你担保清礁能成，只把眼前修为与后段的险路交给你选。
tags: [core, character_encounter, jingwei, first_meeting, dangerous_trial]
source:
  basis: myth_adaptation
  reference: null
  note: 本次离线古籍库未命中精卫实体或填海段落，原典身份待核验；筑堤、试炼与奖励是游戏原创。
  identity: 精卫的原典身份未由本次只读知识库确认。
  game_original: 潮堤承诺、清礁战和回访奖励均为游戏改编。
balance:
  target:
    gross_U: [0, 0.5]
  measured: null
event_type: core
acts: [1]
scene: 海堤缺口正扩大，精卫递来一块木石。你可先收修为，或承受相当于基准气血 8% 的潮击并存活，约好第三幕再来清礁。
options:
  - id: RK003-take-xp
    label: 先取修为
    quick: 获得一笔修为，不接后段清礁约定
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.1, basis: next_xp}
    outcome: 你把这一步修为收进体内，海堤由精卫继续看守。
    story_echo: 你先把修为收下，精卫继续守着缺口；清礁的事留给别的时机。
  - id: RK003-pursue-trial
    label: 答应追礁
    quick: 支付 8% 基准气血并存活，约定后段清礁；不预领挑战奖励。
    requirements: []
    costs:
      - {type: resource, resource: hp, amount: 0.08, basis: reference_hp, must_survive: true}
    rewards: []
    set_flags:
      RS02-promised: true
    outcome: 你承受潮水冲击并站稳，记下潮后清礁的位置；后段挑战胜利才有毒牙钉，失手不发战斗奖励。
    story_echo: 你站稳后记下礁口位置；精卫答应留路，但回访的成败还没定。
  - id: RK003-leave
    label: 拾取散石离开
    quick: 获得一小笔灵石，不接堤路约定
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: coins, amount: 0.1, basis: common_price}
    outcome: 你把散石换成盘缠，沿公共路线离开海口。
    story_echo: 你把散石收作盘缠，沿堤边的公共道路继续赶路。
settlement:
