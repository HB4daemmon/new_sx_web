id: RK005
name: 后羿校目
status: design_target
summary: 后羿请持有明目珠的人带它越过山火；初遇应约且回访仍持有它，才有试射资格。
description: 山火把旧路照成两重影，后羿正校看远处的风标。他请持有明目珠的人留珠到后段，但不替你造器，也不要求你留下；若你已有此物，要不要放弃眼前修为应约，由你决定。
tags: [core, character_encounter, houyi, first_meeting, attribute_artifact]
source:
  basis: myth_adaptation
  reference: null
  note: 本次离线古籍库未命中后羿实体或射日段落，原典身份待核验；明目珠前置和奖励为游戏原创。
  identity: 后羿射日身份本次只读知识库未确认。
  game_original: 携带明目珠、回访试射和暴击器物奖励均为游戏改编。
balance:
  target:
    gross_U: [0, 0.5]
  measured: null
