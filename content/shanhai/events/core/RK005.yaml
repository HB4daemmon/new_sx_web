scene: 山火将路影拉长，后羿说起能校准风路的明目珠。若你已有此物，可应约带它走到第四幕；他不会另送一枚，也不拦你取修为或盘缠离开。
options:
  - id: RK005-carry-sight
    label: 带明目珠上路
    quick: 已持有明目珠；放弃眼前修为并保留此物到试射
    requirements:
      - {type: owned_artifact, id: RC07, count: 1}
    costs: []
    rewards: []
    set_flags:
      RS03-promised: true
    outcome: 你把明目珠系在行囊上，后羿只说一句：别在回访前换掉它。
    story_echo: 你决定把已有的明目珠带过山火；若回访时仍持有它，才可选择试射。
  - id: RK005-take-xp
    label: 取修为离火
    quick: 获得一笔修为，不保留明目珠试射约定
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.1, basis: next_xp}
    outcome: 你把修为收进气海，后羿让开火线，不再为你保留试射位。
    story_echo: 你把修为留在自己身上，后羿收起试射的安排，山路仍可照常通行。
  - id: RK005-leave
    label: 留石观火
    quick: 获得一小笔灵石，不更换身上的法宝
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: coins, amount: 0.1, basis: common_price}
    outcome: 你不改弓、不改器，拿着盘缠沿公共路线继续走。
    story_echo: 你收好盘缠，没有换掉身上的法宝，照自己的路线继续赶路。
