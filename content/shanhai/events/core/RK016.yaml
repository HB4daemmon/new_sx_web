name: 烛龙垂天
status: design_target
summary: 昆仑旧路旁的云门只向学过太阴经的人显出法本；付 15% 基准气血挑战或付 36 灵石可取烛龙真经。
description: 云门是通往天门主路旁的一段岔路，不是打开封锁的必需步骤。石碑把读卷资格、投入和失手后果写明；不入门，也不会耽误你继续上路。
tags: [core, independent_core, legendary_method, RKF10, phase, high_risk]
