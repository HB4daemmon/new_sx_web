    story_echo: 你赢下云门岔路的试炼，取得烛龙真经；通往天门的主路仍须亲自走完。
    encounter:
      enemy_id: EN-A4-B2
      mode: nonlethal
      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 昼夜交替打乱你的节奏，烛龙真经闭门；气血至少保留 1 点，法本没有到手，战斗损伤不会补回。
    story_failure_echo: 昼夜换相令你失了节奏，至少保留 1 点气血；烛龙真经闭门，天门主路仍可继续。
