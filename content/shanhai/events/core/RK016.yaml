  basis: original
  reference: null
  note: 烛龙垂天、法本取得、挑战和昼夜相位均为游戏原创；RKF10是现有游戏原创功法，不声称原典修炼体系。
  identity: 本事件不宣称烛龙垂天或RKF10具有已核验的原典修炼身份。
  game_original: 烛龙机缘、RKF08前置、两种公开投入和RKF10取得均为游戏原创。
