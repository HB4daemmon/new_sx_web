  reference: canon.xiyou_ji.character.e46529d4c
  note: 原典库以draft实体确认铁扇公主与翠云山芭蕉洞、献扇救夫等关系；火山承诺与本作奖励为游戏原创。
  identity: 铁扇公主为《西游记》知识库实体，当前校对状态draft。
  game_original: 显性气血承诺、风止石回访、火系法宝和内部战均为游戏改编。
