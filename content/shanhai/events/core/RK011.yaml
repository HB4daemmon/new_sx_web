name: 铁扇借一阵风
status: design_target
summary: 铁扇公主给你一阵短风；支付 10% 基准气血并存活，才留下第四幕回访火根的机会。
description: 山腹热流将路口堵成窄缝，铁扇公主送来一阵只能带你越过眼前火口的风。是否承受火伤、把回访机会留到后段，仍由你自己定。
tags: [core, character_encounter, princess_iron_fan, first_meeting, hp_commitment]
