kind: event
id: RK015
name: 扶桑倒悬
status: design_target
summary: 火海旁的扶桑岔路只向学过御火诀的人显出法本；付 15% 基准气血挑战或付 36 灵石可取金乌真经。
description: 扶桑倒悬在主路一侧，是可来可不来的机缘，不是穿过火海的必经关口。石碑说明了资格、投入与失手结果；未学御火诀也可以转身离开。
tags: [core, independent_core, legendary_method, RKF09, fire, high_risk]
source:
  basis: original
  reference: null
  note: 扶桑倒悬、传奇法本取得方式和敌战均为游戏原创；RKF09是现有游戏原创功法，不声称古籍法门。
  identity: 本事件不宣称扶桑倒悬或RKF09具有已核验的原典法本身份。
  game_original: 扶桑机缘、RKF04前置、两种公开投入和RKF09取得均为游戏原创。
balance:
  target:
    gross_U: [2.4, 4.0]
    method_value: legendary_method_quality
  measured: null
event_type: core
acts: [3]
scene: 倒悬扶桑把火潮照成金色，石碑写明只有学过御火诀的人能读卷。挑战先付 15% 基准气血，战斗损伤随实战变化、失手至少保留 1 点；付 36 灵石可免战取金乌真经。
options:
  - id: RK015-climb-fusang
    label: 登树取真经
    quick: 学过御火诀，付 15% 基准气血挑战；胜取金乌真经，失手至少保留 1 点且无奖。
    requirements:
      - {type: known_method, id: RKF04}
    costs:
      - {type: resource, resource: hp, amount: 0.15, basis: reference_hp, must_survive: true}
    rewards:
      - {type: method, id: RKF09}
    outcome: 你顶住倒悬火潮，胜利后取得金乌真经；之后仍可再决定是否换功法或突破。
    story_echo: 你赢下扶桑岔路的试炼，取到金乌真经；火海主路仍按原来的方向通向云阶。
    encounter:
      enemy_id: EN-A3-B2
      mode: nonlethal
      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 你没能登上扶桑，火卷重新闭合；气血至少保留 1 点，金乌真经没有到手，战斗损伤不会补回。
    story_failure_echo: 火卷重新闭合，你至少保留 1 点气血；金乌真经未得，通往云阶的主路仍在。
  - id: RK015-buy-sun-path
    label: 付石问真经
    quick: 学过御火诀，支付 36 灵石，免战取金乌真经
    requirements:
      - {type: known_method, id: RKF04}
      - {type: can_pay}
    costs:
      - {type: resource, resource: coins, amount: 36, basis: flat}
    rewards:
      - {type: method, id: RKF09}
    outcome: 你用一大笔盘缠取到金乌真经；之后仍可再决定是否换功法。
    story_echo: 你用 36 灵石取走金乌真经，绕过攀树挑战；这份机缘没有改变主路。
  - id: RK015-turn-back
    label: 放弃扶桑
    quick: 不挑战、不付灵石、不取法本，保留当前功法回主路
    requirements: []
    costs: []
    rewards: []
    outcome: 你让扶桑火潮继续倒悬，金乌真经不是这一局的必经之法。
    story_echo: 你绕过扶桑岔路，既不改功法也不再投入；火海主路仍向前延伸。
