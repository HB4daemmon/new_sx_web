id: RK007
name: 禹让修为
status: design_target
summary: 禹请你把眼前一笔修为让给旧河道；你也可以先取修为或从高地绕行。
description: 断河口的水顶着旧桥倒灌，禹想把它分回原来的河床。让出修为并不是奖赏承诺，只是给后段堤口留一份约定；你仍可先照顾自己的修行。
tags: [core, character_encounter, yu, first_meeting, forgo_growth]
source:
  basis: myth_adaptation
  reference: null
  note: 本次离线古籍库未命中禹人物或治水段落，原典身份待核验；让出修为与回访奖励为游戏原创。
  identity: 禹治水身份本次只读知识库未确认；库中仅有九鼎叙事相关命中，不能替代人物出处。
  game_original: 舍弃眼前修为、守堤回访和器物效果均为游戏改编。
balance:
  target:
    gross_U: [0, 0.5]
  measured: null
event_type: core
acts: [2]
scene: 断河口的水把石阶冲得发亮，禹守着一段旧河床。你可立即取一笔修为，或放弃它替河口疏流，约好第四幕再到堤边相见。
