    quick: 获得一笔修为，不接后段治水约定
    requirements: []
    costs: []
    rewards:
      - {type: resource, resource: xp, amount: 0.1, basis: next_xp}
    outcome: 你先把境界往前推一步，禹把剩下的水口交给公共路线。
    story_echo: 你把修为收进气海，禹继续守着旧河口；这次没有留下后段约定。
  - id: RK007-forgo-growth
    label: 让出这一步
    quick: 放弃一笔眼前修为，约定后段回堤口
    requirements: []
    costs: []
    rewards: []
    set_flags:
      RS04-promised: true
    outcome: 你把修为让给河口，禹记下你的选择：第四幕堤口再见，守堤结果到时再说。
    story_echo: 你把这一步修为让给河口，禹记下约定；守堤成败与回报仍待后段决定。
  - id: RK007-leave
