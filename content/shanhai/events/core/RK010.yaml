schema_version: 1
content_version: shanhai-content-0.1
kind: event
id: RK010
name: 哪吒再接一阵
status: design_target
summary: 带着第一阵的真实伤势回访，可再付 12% 基准气血闯阵取如意钱，或付 24 灵石取雷纹印。
description: 哪吒记得你在重阵前的选择，却不替你抹掉留下的伤势或护盾消耗。第二阵、付石取印与收手三条路都在，胜负只由这一场交手决定。
tags: [core, character_encounter, nezha, follow_up, staged_trial]
source:
  basis: myth_adaptation
  reference: canon.fengjian_chunqiu.character.e8205e7a1
  note: 哪吒身份由知识库draft实体支持；第二阵和器物奖励为游戏原创改编。
  identity: 哪吒为知识库所收录的神将人物，原典摘要不等于本作阵法或法宝规则。
  game_original: 回访旗标、第二阵、失败不补奖励和RR04奖励均为游戏改编。
balance:
  target:
    gross_U: [2.4, 4.0]
  measured: null
event_type: core
acts: [4]
scene: 第二面阵旗在风里轻响，哪吒提醒第一阵留下的伤势与护盾消耗不会免费重置。挑战须再付 12% 基准气血，实际战损随交手变化、失手至少保留 1 点；也可付 24 灵石取雷纹印。
options:
  - id: RK010-enter-second-array
    label: 接第二阵
    quick: 伤势不重置，再付 12% 基准气血挑战；胜取如意钱，失手至少保留 1 点且无奖。
    requirements:
      - {type: flag, id: RS05-promised, value: true}
    costs:
      - {type: resource, resource: hp, amount: 0.12, basis: reference_hp, must_survive: true}
    rewards:
      - {type: artifact, id: RR04, count: 1}
    outcome: 你把两阵都走完，胜利后取下如意钱；它的攻击与暴击属性立即计入，下一场战斗可触发追加一击。
    story_echo: 你走完两阵并获胜，哪吒取下如意钱交给你；第一阵留下的伤势没有被抹去。
    encounter:
      enemy_id: EN-A4-L1
      mode: nonlethal
      failure_hp_floor: 1
      failure_rewards: []
      failure_outcome: 第二阵压住了你的出手，哪吒收阵；气血至少保留 1 点，如意钱没有到手，战斗损伤不会补回。
    story_failure_echo: 第二阵没有走完，你至少保留 1 点气血；哪吒收起阵旗，如意钱仍留在阵旁。
  - id: RK010-pay-artifact
    label: 付石收锋
    quick: 支付 24 灵石，不闯第二阵并取雷纹印
    requirements:
      - {type: flag, id: RS05-promised, value: true}
      - {type: can_pay}
    costs:
      - {type: resource, resource: coins, amount: 24, basis: flat}
    rewards:
      - {type: artifact, id: RC10, count: 1}
    outcome: 你用盘缠换下雷纹印；它的攻击提升立即计入，下一场战斗的怒技会更强，你不再接第二阵。
    story_echo: 你付出 24 灵石换下雷纹印，哪吒收起第二阵；第一阵的伤势仍在。
  - id: RK010-stop
    label: 收手离阵
    quick: 不再挑战、不付灵石、不取器物，带着第一阵的伤势离阵
    requirements:
      - {type: flag, id: RS05-promised, value: true}
    costs: []
    rewards: []
    outcome: 你在第二阵前收手，哪吒点头：知道什么时候停，也算过阵；如意钱和雷纹印都留在阵旁。
    story_echo: 你在第二阵前收手，哪吒让开主路；先前的伤势照旧，未得任何法宝。
settlement:
  once: true
  internal_battle_package: false
  travel_triggers: 1
  fallback: coins
