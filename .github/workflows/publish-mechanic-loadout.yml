name: Publish mechanic loadout

on:
  push:
    branches:
      - feat/mechanic-loadout
    paths:
      - .github/workflows/publish-mechanic-loadout.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare clean source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          if git ls-remote --exit-code --heads origin feat/mechanic-loadout-runtime >/dev/null 2>&1; then
            echo 'Using directly pushed runtime branch'
            git fetch origin feat/mechanic-loadout-runtime
            git checkout -B mechanic-publish FETCH_HEAD
          else
            echo 'Using staged patch chunks'
            for i in 00 01 02 03 04 05; do
              test -s ".automation/mechanic.patch.gz.b64.part-${i}"
            done
            cat .automation/mechanic.patch.gz.b64.part-* > /tmp/mechanic.patch.gz.b64
            base64 -d /tmp/mechanic.patch.gz.b64 > /tmp/mechanic.patch.gz
            gzip -dc /tmp/mechanic.patch.gz > /tmp/mechanic.patch
            git checkout -B mechanic-publish origin/main
            git apply --check /tmp/mechanic.patch
            git apply /tmp/mechanic.patch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m 'feat: rebuild combat loadout around mechanics'
          fi

          test -z "$(git status --porcelain)"
          git diff --quiet origin/main HEAD && { echo 'No source diff to publish'; exit 3; } || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Balance audit
        run: npm run check:balance

      - name: Publish clean branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:feat/mechanic-loadout-publish

      - name: Open and merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR=$(gh pr list --head feat/mechanic-loadout-publish --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create \
              --base main \
              --head feat/mechanic-loadout-publish \
              --title 'feat: rebuild combat loadout around mechanics' \
              --body $'重构构筑与战斗骨架：\n\n- 唯一普攻 + 唯一怒气技 + 4 自由组件 + 1 命器 + 1 战策\n- 槽位约束与 Mechanic Tag 分离\n- 移除预设流派/共鸣隐藏战斗加成\n- Mechanic Tag 进入真实战斗事件链和法宝触发\n- 补齐开局战策、命器转换、自动构筑评估和新平衡曲线\n\n发布前已重新执行 npm test 与 npm run check:balance。' >/dev/null
            PR=$(gh pr list --head feat/mechanic-loadout-publish --base main --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$PR" --squash --delete-branch
