name: Verify mechanic publish

on:
  push:
    branches:
      - feat/mechanic-loadout
    paths:
      - .github/workflows/verify-mechanic-publish.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify publish branch and main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/verify
          cd /tmp/verify
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/HB4daemmon/new_sx_web.git
          git fetch origin main

          if git ls-remote --exit-code --heads origin feat/mechanic-loadout-publish >/dev/null 2>&1; then
            git fetch origin feat/mechanic-loadout-publish
            PUB=$(git rev-parse FETCH_HEAD)
            PR=$(gh pr list --repo HB4daemmon/new_sx_web --head feat/mechanic-loadout-publish --base main --state open --json number --jq '.[0].number // empty')
            if [ -n "$PR" ]; then
              gh pr merge "$PR" --repo HB4daemmon/new_sx_web --squash --delete-branch
            fi
            git fetch origin main
            git diff --quiet "$PUB" origin/main
          else
            git fetch origin main
            if git ls-remote --exit-code --heads origin feat/mechanic-loadout-runtime >/dev/null 2>&1; then
              git fetch origin feat/mechanic-loadout-runtime
              RUNTIME=$(git rev-parse FETCH_HEAD)
              git diff --quiet "$RUNTIME" origin/main
            else
              echo 'No publish/runtime branch available for tree verification'
              exit 4
            fi
          fi

          MAIN=$(git rev-parse origin/main)
          git tag -f mechanic-loadout-published "$MAIN"
          git push --force origin refs/tags/mechanic-loadout-published
          echo "Verified main at $MAIN"
