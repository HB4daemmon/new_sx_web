name: Finalize mechanic loadout

on:
  push:
    branches:
      - feat/mechanic-loadout
    paths:
      - .github/workflows/finalize-mechanic-loadout.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require verified source commit
        shell: bash
        run: |
          set -euo pipefail
          git log --format='%s' | grep -Fxq 'feat: rebuild combat loadout around mechanics'
          test ! -d .automation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Final test
        run: npm test

      - name: Final balance audit
        run: npm run check:balance

      - name: Remove temporary publish workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/apply-mechanic-loadout-v2.yml .github/workflows/finalize-mechanic-loadout.yml
          git commit -m "chore: remove temporary publish workflows"
          git push origin HEAD:feat/mechanic-loadout

      - name: Open and merge pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR=$(gh pr list --head feat/mechanic-loadout --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create \
              --base main \
              --head feat/mechanic-loadout \
              --title 'feat: rebuild combat loadout around mechanics' \
              --body $'重构构筑与战斗骨架：\n\n- 唯一普攻 + 唯一怒气技 + 4 自由组件 + 1 命器 + 1 战策\n- 槽位约束与 Mechanic Tag 分离\n- 移除预设流派/共鸣隐藏战斗加成\n- Mechanic Tag 进入真实战斗事件链和法宝触发\n- 补齐开局战策、命器转换、自动构筑评估和新平衡曲线\n\nCI 已重新执行 npm test 与 npm run check:balance。' >/dev/null
            PR=$(gh pr list --head feat/mechanic-loadout --base main --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$PR" --squash --delete-branch
