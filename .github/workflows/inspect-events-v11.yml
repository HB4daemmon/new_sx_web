name: Inspect Events V11

on:
  push:
    paths:
      - '.github/workflows/inspect-events-v11.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore source and inspect event system
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v11-inspect
          mkdir -p /tmp/fengshen-v11-inspect
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v11-inspect
          cd /tmp/fengshen-v11-inspect
          echo '=== EXTENDED EVENTS 135-220 ==='
          sed -n '135,220p' scripts/create-content.py
          echo '=== WORLD CONDITIONS ==='
          sed -n '125,138p' src/engine.ts
          echo '=== EVENT CSS ==='
          grep -n -E "event-page|story-choice|event-phase|check-badge|event-outcome|timeline" src/style.css | head -n 120 || true
