name: Inspect Events V11

on:
  push:
    paths:
      - '.github/workflows/inspect-events-v11.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore source and inspect event system
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v11-inspect
          mkdir -p /tmp/fengshen-v11-inspect
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v11-inspect
          cd /tmp/fengshen-v11-inspect
          echo '=== AUTHORED EVENTS 95-150 ==='
          sed -n '95,150p' scripts/create-content.py
          echo '=== EVENT TYPES ==='
          sed -n '1,45p' src/engine.ts
          echo '=== EVENT ENTRY ==='
          grep -n -A 70 -B 20 "case 'event'" src/engine.ts | head -n 150 || true
          echo '=== EVENT ADVANCE / NODE ENTRY ==='
          grep -n -A 100 -B 20 "enter(id:string)" src/engine.ts | head -n 180 || true
          echo '=== EVENT METHODS ==='
          grep -n -A 45 -B 5 "eventPhase()" src/engine.ts
