name: Inspect Events V11

on:
  push:
    paths:
      - '.github/workflows/inspect-events-v11.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore source and inspect event system
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v11-inspect
          mkdir -p /tmp/fengshen-v11-inspect
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v11-inspect
          cd /tmp/fengshen-v11-inspect
          echo '=== EVENT CONTENT DEFINITIONS ==='
          grep -nE "^EVENT=|^major=|dict\(id='event\.|dict\(id='major\." scripts/create-content.py | head -n 260 || true
          echo '=== EVENT HELPERS ==='
          grep -nE "^def option|^def phase|^def event|^def eff|^def cond" scripts/create-content.py | head -n 120 || true
          echo '=== EVENT ENGINE METHODS ==='
          grep -n -A 160 -B 15 "eventPhase()" src/engine.ts | head -n 260 || true
          echo '=== EVENT CHOICE / LEAVE METHODS ==='
          grep -n -A 180 -B 10 "eventChoices()" src/engine.ts | head -n 300 || true
          echo '=== EVENT UI ==='
          grep -n -A 20 -B 5 "event(){" src/app.ts | head -n 120 || true
          echo '=== STORY LOG UI ==='
          grep -n -A 20 -B 5 "storyLog" src/app.ts | head -n 120 || true
          echo '=== CURRENT EVENT TESTS ==='
          grep -n -A 6 -B 2 -E "event |event check|hidden limit|major fate|causality" tests/engine.test.mjs | tail -n 220 || true
