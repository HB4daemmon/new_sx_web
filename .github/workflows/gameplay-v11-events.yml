name: Gameplay V11 Event Redesign

on:
  push:
    paths:
      - 'tools/v11-events.py'
      - '.github/workflows/gameplay-v11-events.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gameplay-v11-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore current game source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v11-events
          mkdir -p /tmp/fengshen-v11-events
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v11-events
      - name: Apply Gameplay V11 event redesign
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/v11-events.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace('insert_marker="  enter(', 'insert_marker=" enter(')
          t=t.replace('old_choices="  eventChoices()', 'old_choices=" eventChoices()')
          t=t.replace('r"  event\\(\\)\\{.*?\\n  shop\\(\\)\\{"', 'r" event\\(\\)\\{.*?\\n shop\\(\\)\\{"')
          p.write_text(t,encoding='utf-8')
          PY
          python tools/v11-events.py /tmp/fengshen-v11-events
          cd /tmp/fengshen-v11-events
          python scripts/create-content.py
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tests/engine.test.mjs')
          t=p.read_text(encoding='utf-8')
          t=t.replace("'2.7.0'","'2.8.0'")
          pat=re.compile(r"(?m)^test\('event checks are deterministic under the same seed and action sequence'.*$")
          ms=list(pat.finditer(t))
          if len(ms)!=1:
              raise RuntimeError(f'deterministic event test matches: {len(ms)}')
          repl="test('event checks are deterministic under the same seed and action sequence',()=>{const play=()=>{const g=fresh('CHECK-DETERMINISTIC'),ev=c.events.find(e=>e.id==='event.0.omen');g.s.phase='event';g.s.eventId=ev.id;g.s.eventPhase=ev.startPhase;g.s.seenEvents[ev.id]=1;g.chooseEvent('enter');const picked=g.eventChoices().find(x=>x.choice.check);assert(picked);g.chooseEvent(picked.choice.id);return {check:g.s.lastCheck,result:g.s.resultText,rng:clone(g.s.rng)};};assert.deepEqual(play(),play());});"
          m=ms[0]
          t=t[:m.start()]+repl+t[m.end():]
          p.write_text(t,encoding='utf-8')
          PY
      - name: Install build simulate and test
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v11-events
          npm install --no-audit --no-fund
          npm run build
          node tests/simulate.mjs
          node --test tests/engine.test.mjs
      - name: Verify V11 event markers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v11-events
          grep -q "resolveStory" src/engine.ts
          grep -q "hiddenOnly" src/engine.ts
          grep -q "conditionLabel" src/engine.ts
          grep -q "check-stakes" src/app.ts
          grep -q "consequence-badge" src/app.ts
          grep -q "Gameplay V11" docs/GAMEPLAY_V11_EVENTS.md
          grep -q "C\['version'\]='2.8.0'" scripts/create-content.py
          grep -q "C\['rulesVersion'\]='2.8.0'" scripts/create-content.py
          grep -q "assert len(A)==43 and len(E)==20 and len(C\['events'\])==24" scripts/create-content.py
      - name: Repack V11 source baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v11-events/node_modules /tmp/fengshen-v11-events/dist /tmp/fengshen-v11-events/build /tmp/fengshen-v11-events/verification
          tar -C /tmp/fengshen-v11-events -cJf /tmp/fengshen-source.tar.xz .
          rm -f bootstrap/source.part.*.b64
          split -b 16000 -d -a 2 /tmp/fengshen-source.tar.xz /tmp/source.part.
          for part in /tmp/source.part.*; do base64 -w 76 "$part" > "bootstrap/$(basename "$part").b64"; done
      - name: Commit V11 source baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bootstrap
          if git diff --cached --quiet; then
            echo "No source archive changes"
            exit 0
          fi
          git commit -m "feat: redesign events and causality for gameplay v11"
          git push origin HEAD:main
