name: Apply Gameplay V7

on:
  push:
    paths:
      - 'tools/build-v7.py'
      - '.github/workflows/gameplay-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gameplay-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v7
          mkdir -p /tmp/fengshen-v7
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v7
      - name: Apply resource-engine design
        shell: bash
        run: |
          set -euo pipefail
          python tools/build-v7.py /tmp/fengshen-v7
          cd /tmp/fengshen-v7
          python scripts/create-content.py
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v7
          npm install --no-audit --no-fund
          npm run build
          node tests/simulate.mjs
          node --test tests/engine.test.mjs
      - name: Verify V7 markers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v7
          grep -q "consume_status" src/engine.ts
          grep -q "consume_shield" src/engine.ts
          grep -q "playerConversions" src/engine.ts
          grep -q "资源炼化" src/app.ts
          grep -q "'2.4.0'" scripts/create-content.py
          test -f docs/GAMEPLAY_V7.md
      - name: Repack complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v7/node_modules /tmp/fengshen-v7/dist /tmp/fengshen-v7/build /tmp/fengshen-v7/verification
          tar -C /tmp/fengshen-v7 -cJf /tmp/fengshen-source.tar.xz .
          rm -f bootstrap/source.part.*.b64
          split -b 16000 -d -a 2 /tmp/fengshen-source.tar.xz /tmp/source.part.
          for part in /tmp/source.part.*; do base64 -w 76 "$part" > "bootstrap/$(basename "$part").b64"; done
      - name: Commit gameplay source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bootstrap
          if git diff --cached --quiet; then
            echo "No source archive changes"
            exit 0
          fi
          git commit -m "feat: turn four build schools into resource engines"
          git push origin HEAD:main
