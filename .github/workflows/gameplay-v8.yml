name: Gameplay V8 Ability Identity

on:
  push:
    paths:
      - 'tools/v8-refactor.py'
      - '.github/workflows/gameplay-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gameplay-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore current game source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v8
          mkdir -p /tmp/fengshen-v8
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v8
      - name: Apply V8 ability identity pass
        shell: bash
        run: |
          set -euo pipefail
          python tools/v8-refactor.py /tmp/fengshen-v8
          cd /tmp/fengshen-v8
          python scripts/create-content.py
      - name: Install build simulate and test
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v8
          npm install --no-audit --no-fund
          npm run build
          node tests/simulate.mjs
          node --test tests/engine.test.mjs
      - name: Verify V8 authored markers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v8
          grep -q "resource_damage" src/engine.ts
          grep -q "mechanicRole" src/engine.ts
          grep -q "MECHANIC_GROUPS" scripts/create-content.py
          grep -q "'2.5.0'" scripts/create-content.py
          grep -q "Gameplay V8" docs/GAMEPLAY_V8.md
      - name: Repack V8 source baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v8/node_modules /tmp/fengshen-v8/dist /tmp/fengshen-v8/build /tmp/fengshen-v8/verification
          tar -C /tmp/fengshen-v8 -cJf /tmp/fengshen-source.tar.xz .
          rm -f bootstrap/source.part.*.b64
          split -b 16000 -d -a 2 /tmp/fengshen-source.tar.xz /tmp/source.part.
          for part in /tmp/source.part.*; do base64 -w 76 "$part" > "bootstrap/$(basename "$part").b64"; done
      - name: Commit V8 source baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bootstrap
          if git diff --cached --quiet; then
            echo "No source archive changes"
            exit 0
          fi
          git commit -m "feat: refactor ability identities for gameplay v8"
          git push origin HEAD:main
