name: Apply Gameplay V4

on:
  push:
    paths:
      - 'tools/build-v4.py'
      - '.github/workflows/gameplay-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gameplay-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v4
          mkdir -p /tmp/fengshen-v4
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do
            base64 -d "$part" >> /tmp/fengshen-source.tar.xz
          done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v4

      - name: Apply log and build-depth architecture
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/start_marker = f'  {name}('/start_marker = f' {name}('/; s/next_marker = f'  {next_name}('/next_marker = f' {next_name}('/; s/app.find(\"   else if(this.modal==='settings')body=\")/app.find(\"else if(this.modal==='settings')body=\")/; s/app.find(\"   else if(this.modal==='ability')\"/app.find(\"else if(this.modal==='ability')\"/" tools/build-v4.py
          python tools/build-v4.py /tmp/fengshen-v4
          cd /tmp/fengshen-v4
          python scripts/create-content.py

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v4
          npm install --no-audit --no-fund
          npm test
          npm run build
          node tests/simulate.mjs

      - name: Verify v4 markers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v4
          grep -q "export function buildProfile" src/engine.ts
          grep -q "fengshen-detailed-log" src/app.ts
          grep -q "仅伤害与状态" src/app.ts
          grep -q "流派共鸣" src/app.ts
          grep -q "Gameplay v4" src/style.css
          grep -q "'2.1.0'" scripts/create-content.py

      - name: Repack complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v4/node_modules /tmp/fengshen-v4/dist /tmp/fengshen-v4/build /tmp/fengshen-v4/verification
          tar -C /tmp/fengshen-v4 -cJf /tmp/fengshen-source.tar.xz .
          rm -f bootstrap/source.part.*.b64
          split -b 16000 -d -a 2 /tmp/fengshen-source.tar.xz /tmp/source.part.
          for part in /tmp/source.part.*; do
            base64 -w 76 "$part" > "bootstrap/$(basename "$part").b64"
          done

      - name: Commit gameplay source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bootstrap
          if git diff --cached --quiet; then
            echo "No source archive changes"
            exit 0
          fi
          git commit -m "feat: improve combat logs and deepen build resonance"
          git push origin HEAD:main
