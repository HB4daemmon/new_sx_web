name: Reward rarity floor fix
on:
  push:
    branches: [feature/ui16-2-copy]
    paths: [tools/reward-rarity-fix.py, .github/workflows/reward-rarity-fix.yml]
permissions:
  contents: write
concurrency:
  group: reward-rarity-floor
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reward rarity patch
        run: python tools/reward-rarity-fix.py
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Full rules and presentation suite
        run: npm test
      - name: Balance regression
        run: npm run balance
      - name: Reward rarity audit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {Game,fateOptions} from './build/engine.js';
          const c=JSON.parse(await readFile('./data/game.json','utf8'));
          const result={elite:{runs:0,minRare:99,allCommon:0},boss:{runs:0,minRare:99,allCommon:0},mythic:0};
          for(let i=0;i<400;i++)for(const [type,min] of [['elite',1],['boss',2]]){
            const seed=`RARITY-AUDIT-${type}-${i}`;
            const g=Game.create(c,seed,c.origins[i%c.origins.length].id,fateOptions(c,seed)[0].id,'Audit');
            const ids=g.rollAbilities(3,'reward',undefined,min);
            const rare=ids.filter(id=>g.ability(id).rarity==='rare').length;
            result[type].runs++;result[type].minRare=Math.min(result[type].minRare,rare);if(!rare)result[type].allCommon++;
            result.mythic+=ids.filter(id=>g.ability(id).rarity==='mythic').length;
          }
          console.log(JSON.stringify(result,null,2));
          if(result.elite.minRare<1||result.boss.minRare<2||result.elite.allCommon||result.boss.allCommon||result.mythic)process.exit(1);
          JS
      - name: HTTP browser regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/reward-rarity-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          python tests/ancestry-browser.py --url http://127.0.0.1:4173/ --output /tmp/reward-rarity-browser
      - name: Commit verified fix and remove staging tools
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine.ts tests/engine.test.mjs
          git rm .github/workflows/reward-rarity-fix.yml tools/reward-rarity-fix.py
          git commit -m 'fix: guarantee rare elite and boss rewards'
          git push origin HEAD:feature/ui16-2-copy
