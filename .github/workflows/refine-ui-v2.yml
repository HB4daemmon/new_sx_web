name: Refine game UI v2

on:
  push:
    paths:
      - '.github/workflows/refine-ui-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-src
          mkdir -p /tmp/fengshen-src
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do
            base64 -d "$part" >> /tmp/fengshen-source.tar.xz
          done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-src

      - name: Apply UI refinements
        run: python tools/refine-ui-v2.py /tmp/fengshen-src

      - name: Verify and build
        working-directory: /tmp/fengshen-src
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm test
          npm run build
          grep -q 'battle-log-head' src/app.ts
          grep -q 'rarity-label' src/app.ts
          grep -q 'run-metrics' src/app.ts
          grep -q 'UI refinement v2' src/style.css

      - name: Repack source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./node_modules' --exclude='./.git' -cJf /tmp/fengshen-source-v2.tar.xz -C /tmp/fengshen-src .
          xz -t /tmp/fengshen-source-v2.tar.xz
          python - <<'PY'
          from pathlib import Path
          import base64
          src = Path('/tmp/fengshen-source-v2.tar.xz').read_bytes()
          encoded = base64.b64encode(src).decode('ascii')
          out = Path('bootstrap')
          for p in out.glob('source.part.*.b64'):
              p.unlink()
          chunk = 16000
          for i in range(0, len(encoded), chunk):
              (out / f'source.part.{i//chunk:02d}.b64').write_text(encoded[i:i+chunk], encoding='ascii')
          print(f'archive={len(src)} bytes, parts={(len(encoded)+chunk-1)//chunk}')
          PY

      - name: Commit updated game source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap
          if git diff --cached --quiet; then
            echo 'No source archive changes.'
            exit 0
          fi
          git commit -m 'feat: refine stats slots rarity and battle report'
          git push origin HEAD:main
