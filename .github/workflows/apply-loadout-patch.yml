name: Apply loadout redesign patch

on:
  push:
    branches:
      - feat/loadout-6-1-1
    paths:
      - '.automation/loadout.patch.gz.b64'
      - '.github/workflows/apply-loadout-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loadout-6-1-1
          fetch-depth: 0
      - name: Restore and apply patch
        shell: bash
        run: |
          base64 -d .automation/loadout.patch.gz.b64 | gzip -d > /tmp/loadout.patch
          git apply --check /tmp/loadout.patch
          git apply /tmp/loadout.patch
          rm -f .automation/loadout.patch .automation/loadout.patch.gz.b64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify
        run: |
          npm ci
          npm test
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: redesign loadout and combat feedback'
          git push origin HEAD:feat/loadout-6-1-1

# trigger compressed-patch application
