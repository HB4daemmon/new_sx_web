name: Apply loadout redesign patch

on:
  push:
    branches:
      - feat/loadout-6-1-1
    paths:
      - '.automation/loadout.patch'
      - '.github/workflows/apply-loadout-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/loadout-6-1-1
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          if [ ! -f .automation/loadout.patch ]; then
            echo 'Patch already applied; nothing to do.'
            exit 0
          fi
          git apply --check .automation/loadout.patch
          git apply .automation/loadout.patch
          rm .automation/loadout.patch
      - uses: actions/setup-node@v4
        if: hashFiles('.automation/loadout.patch') == ''
        with:
          node-version: '22'
          cache: npm
      - name: Verify
        if: hashFiles('.automation/loadout.patch') == ''
        run: |
          npm ci
          npm test
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: redesign loadout and combat feedback'
          git push origin HEAD:feat/loadout-6-1-1
