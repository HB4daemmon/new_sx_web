name: Materialize game source

on:
  push:
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do
            echo "Decoding ${part}"
            base64 -d "${part}" >> /tmp/fengshen-source.tar.xz
          done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz
          test -f src/app.ts
          test -f src/engine.ts
          test -f data/game.json
          test -f .github/workflows/pages.yml

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialization changes.'
            exit 0
          fi
          git commit -m 'feat: materialize complete Fengshen web game'
          git push origin HEAD:main
