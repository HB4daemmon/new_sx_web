name: UI 16.2 copy and reward audit
on:
  push:
    branches: [feature/ui16-2-copy]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI 16.2 copy pass
        run: python tools/ui16-2-copy.py
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Full rules and presentation suite
        run: npm test
      - name: Balance invariance
        run: npm run balance
      - name: Audit elite and boss reward pool
        run: node tools/reward-pool-audit.mjs
      - name: HTTP browser regression
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/ui16-2-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          python tests/ancestry-browser.py --url http://127.0.0.1:4173/ --output /tmp/ui16-2-browser
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui16-2-copy-audit
          path: |
            verification/reward-pool-audit.json
            verification/balance-audit.json
            /tmp/ui16-2-browser
            /tmp/ui16-2-http.log
          if-no-files-found: warn
      - name: Commit verified UI pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts src/presentation.ts data/presentation.json tests/combat-feedback.test.mjs tests/race-events.test.mjs tests/immersion-copy.test.mjs
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          git commit -m "ui: deepen immersion copy pass (UI 16.2)"
          git push
