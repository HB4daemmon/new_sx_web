name: Inspect gameplay source

on:
  push:
    paths:
      - '.github/workflows/inspect-ui.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz
      - name: Inspect gameplay source
        shell: bash
        run: |
          for f in src/engine.ts src/app.ts src/style.css scripts/create-content.py tests/engine.test.mjs tests/policy.mjs docs/GAMEPLAY_V3.md; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              sed -n '1,900p' "$f"
            fi
          done
