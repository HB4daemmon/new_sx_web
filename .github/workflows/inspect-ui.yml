name: Inspect gameplay source

on:
  push:
    paths:
      - '.github/workflows/inspect-ui.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          tar -xJf /tmp/fengshen-source.tar.xz
      - name: Inspect gameplay content
        shell: bash
        run: |
          for f in scripts/create-content.py data/game.json tests/engine.test.mjs tests/simulate.mjs tests/policy.mjs docs/IMPLEMENTATION.md; do
            if [ -f "$f" ]; then
              echo "=== $f ==="
              sed -n '1,760p' "$f"
            fi
          done
