name: Inspect Gameplay V7 Inputs

on:
  push:
    paths:
      - '.github/workflows/inspect-v7.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore source and inspect origin hooks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v7-inspect
          mkdir -p /tmp/fengshen-v7-inspect
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v7-inspect
          cd /tmp/fengshen-v7-inspect
          echo '=== ORIGIN TYPE ==='
          grep -nE "interface Origin|export interface Origin|origins:" src/engine.ts | head -n 20 || true
          echo '=== BATTLE START ==='
          grep -n -C 4 "battle_start" src/engine.ts | head -n 120 || true
          echo '=== CURRENT ORIGINS ==='
          grep -n "^origins=" scripts/create-content.py
          echo '=== CURRENT POLICY ==='
          head -n 20 tests/policy.mjs
