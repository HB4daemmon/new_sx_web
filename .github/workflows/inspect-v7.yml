name: Inspect Gameplay V7 Inputs

on:
  push:
    paths:
      - '.github/workflows/inspect-v7.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore source and inspect V7 policy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v7-inspect
          mkdir -p /tmp/fengshen-v7-inspect
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v7-inspect
          cd /tmp/fengshen-v7-inspect
          echo '=== POLICY ==='
          cat tests/policy.mjs
          echo '=== SIMULATOR ==='
          cat tests/simulate.mjs
          echo '=== V7 ABILITY LINES ==='
          grep -nE "basic.sword|rage.thunder|aux.qi|aux.ash|art.flag|strategy.rage|strategy.guard|strategy.fire|strategy.mountain|strategy.hunt" scripts/create-content.py
