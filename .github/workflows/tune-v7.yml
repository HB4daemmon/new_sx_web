name: Tune Gameplay V7

on:
  push:
    paths:
      - 'tools/tune-v7.py'
      - '.github/workflows/tune-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore V7 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v7-tuned
          mkdir -p /tmp/fengshen-v7-tuned
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v7-tuned
      - name: Apply balance calibration
        shell: bash
        run: |
          set -euo pipefail
          python tools/tune-v7.py /tmp/fengshen-v7-tuned
          cd /tmp/fengshen-v7-tuned
          python scripts/create-content.py
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v7-tuned
          npm install --no-audit --no-fund
          npm run build
          node tests/simulate.mjs
          node --test tests/engine.test.mjs
      - name: Verify calibrated markers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v7-tuned
          grep -q "starting=\['basic.thunder','rage.thunder','aux.qi'\]" scripts/create-content.py
          grep -q "炼化 1 层燃烧" scripts/create-content.py
          grep -q "Contextual build roles" tests/simulate.mjs
          grep -q "'2.4.0'" scripts/create-content.py
      - name: Repack calibrated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v7-tuned/node_modules /tmp/fengshen-v7-tuned/dist /tmp/fengshen-v7-tuned/build /tmp/fengshen-v7-tuned/verification
          tar -C /tmp/fengshen-v7-tuned -cJf /tmp/fengshen-source.tar.xz .
          rm -f bootstrap/source.part.*.b64
          split -b 16000 -d -a 2 /tmp/fengshen-source.tar.xz /tmp/source.part.
          for part in /tmp/source.part.*; do base64 -w 76 "$part" > "bootstrap/$(basename "$part").b64"; done
      - name: Commit calibrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bootstrap
          if git diff --cached --quiet; then
            echo "No source archive changes"
            exit 0
          fi
          git commit -m "balance: calibrate rage and burn resource engines"
          git push origin HEAD:main
