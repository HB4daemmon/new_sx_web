name: Apply Gameplay V3

on:
  push:
    paths:
      - 'tools/gameplay-v3.py'
      - '.github/workflows/gameplay-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gameplay-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v3
          mkdir -p /tmp/fengshen-v3
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do
            base64 -d "$part" >> /tmp/fengshen-source.tar.xz
          done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v3

      - name: Apply ssxx2-derived gameplay architecture
        shell: bash
        run: |
          set -euo pipefail
          python tools/gameplay-v3.py /tmp/fengshen-v3
          cd /tmp/fengshen-v3
          python scripts/create-content.py

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v3
          npm install --no-audit --no-fund
          npm test
          npm run build
          node tests/simulate.mjs

      - name: Verify gameplay markers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v3
          grep -q "combat.enemy_ai" src/engine.ts
          grep -q "eventChoices" src/engine.ts
          grep -q "BattleObjective" src/engine.ts
          grep -q "Gameplay v3" src/style.css
          grep -q '"version": "2.0.0"' data/game.json

      - name: Repack complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/fengshen-v3/node_modules/.package-lock.json || true
          rm -rf /tmp/fengshen-v3/node_modules /tmp/fengshen-v3/dist /tmp/fengshen-v3/build /tmp/fengshen-v3/verification
          tar -C /tmp/fengshen-v3 -cJf /tmp/fengshen-source.tar.xz .
          rm -f bootstrap/source.part.*.b64
          split -b 16000 -d -a 2 /tmp/fengshen-source.tar.xz /tmp/source.part.
          for part in /tmp/source.part.*; do
            base64 -w 76 "$part" > "bootstrap/$(basename "$part").b64"
          done

      - name: Commit gameplay source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/source.part.*.b64
          if git diff --cached --quiet; then
            echo "No source archive changes"
            exit 0
          fi
          git commit -m "feat: adopt ssxx2 gameplay engine and event model"
          git push origin HEAD:main
