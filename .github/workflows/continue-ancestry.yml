name: Continue ancestry stages
on:
  push:
    branches: [feature/ancestry-talents-v16]
    paths: [tools/continuation.json, .github/workflows/continue-ancestry.yml]
permissions:
  contents: write
concurrency:
  group: ancestry-continuation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,base64,zlib,hashlib,subprocess
          from pathlib import Path
          cfg=json.loads(Path('tools/continuation.json').read_text())
          if cfg.get('recover'):
              text=''.join(p.read_text().strip() for p in sorted(Path('tools/stages/02').glob('*.b64')))
              assert hashlib.sha256(text.encode()).hexdigest()=='a373f80398478f353c1e561c1d9e1ddace3a885d598917042ac081e1428ee5be'
              partial=zlib.decompressobj().decompress(base64.b64decode(text)).decode('utf8',errors='ignore')
              ops=[]; pos=1; dec=json.JSONDecoder()
              while True:
                  try: op,end=dec.raw_decode(partial,pos)
                  except json.JSONDecodeError: break
                  ops.append(op);pos=end+1
              assert len(ops)==7
              encoded=Path('tools/stages/02r/00.b64').read_text().strip()
              prefix='eNqtWn9zo8jR/irEf+xALcYgQAj52NTlssld6nK32d1U8patcg0wSKwRcAxYVlz67umeGSSQZa338t5VyTC/5+mnn+4Z9ubpoqbt6mJ+0TLe8qu6KvJka62/8AvzImZZ1TCoC5yZ5zizJMvc2Ett6s4mQZolnu9NbJsFNAxo4DtsGjM3i2duSmcZdQPbDieON8kCB8aiWcsaGCpjdk'
              encoded=prefix+encoded[encoded.index('qTLAgDL/'):]
              assert hashlib.sha256(encoded.encode()).hexdigest()=='6a4de3e2a587c181b74cab81b8bca0ce6be1bbc542b82d03903f201f5743d71c'
              ops+=json.loads(zlib.decompress(base64.b64decode(encoded,validate=True)))
              assert len(ops)==12
              for op in ops:
                  path=Path(op['path']);assert not path.is_absolute() and '..' not in path.parts
                  old=path.read_bytes() if path.exists() else b''
                  assert (hashlib.sha256(old).hexdigest() if old else None)==op['before'],str(path)+' baseline changed'
                  out=old.decode()
                  for a,b,new in reversed(op['edits']):out=out[:a]+new+out[b:]
                  data=out.encode();assert hashlib.sha256(data).hexdigest()==op['after'],str(path)+' hash mismatch'
                  path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          else:
              subprocess.run(['python',cfg['script']],check=True)
          PY
      - run: npm ci --no-audit --no-fund
      - name: Tests and simulation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ancestry-results
          npm test | tee /tmp/ancestry-results/tests.log
          npm run simulate | tee /tmp/ancestry-results/simulation.log
      - name: HTTP browser regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/ancestry-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          python tests/ancestry-browser.py --url http://127.0.0.1:4173/ --output /tmp/ancestry-results/ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ancestry-stage-${{ github.run_number }}
          path: /tmp/ancestry-results
          retention-days: 30
      - name: Commit verified stage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src tests data scripts docs package.json package-lock.json README.md .deploy-version
          python - <<'PY'
          import json,subprocess
          cfg=json.load(open('tools/continuation.json'))
          subprocess.run(['git','commit','-m',cfg['message']],check=True)
          subprocess.run(['git','push','origin','HEAD:feature/ancestry-talents-v16'],check=True)
          PY
