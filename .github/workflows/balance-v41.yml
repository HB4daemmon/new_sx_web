name: Balance v4.1 audit

on:
  push:
    branches: [feature/balance-v41]
    paths:
      - 'tests/balance-audit.mjs'
      - 'tests/policy.mjs'
      - 'tests/ancestry.test.mjs'
      - 'data/game.json'
      - 'src/**'
      - 'tools/tune-balance-v41.py'
      - 'tools/tune-warrior-v41.py'
      - '.github/workflows/balance-v41.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 4.1 calibration
        run: |
          python tools/tune-balance-v41.py
          python tools/tune-warrior-v41.py
      - run: npm ci --no-audit --no-fund
      - name: Full rules suite
        run: npm test
      - name: 500-run ancestry and vocation audit
        run: node tests/balance-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: balance-v41-audit
          path: verification/balance-audit.json
      - name: Commit verified calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game.json package.json package-lock.json src/app.ts tests/*.mjs README.md docs/ANCESTRY_TALENTS.md
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          git commit -m "balance: calibrate ancestry and vocation baselines for 4.1"
          git push
