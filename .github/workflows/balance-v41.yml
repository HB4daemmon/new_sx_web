name: Balance v4.1 audit

on:
  push:
    branches: [feature/balance-v41]
    paths:
      - 'package.json'
      - 'tests/balance-audit.mjs'
      - 'tests/policy.mjs'
      - 'tests/ancestry.test.mjs'
      - 'tests/ancestry-browser.py'
      - 'data/game.json'
      - 'src/**'
      - 'tools/tune-balance-v41.py'
      - 'tools/tune-warrior-v41.py'
      - '.github/workflows/balance-v41.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply 4.1 calibration
        run: |
          python tools/tune-balance-v41.py
          python tools/tune-warrior-v41.py
      - run: npm ci --no-audit --no-fund
      - name: Full rules suite
        run: npm test
      - name: 500-run ancestry and vocation audit
        run: npm run balance
      - name: HTTP browser regression
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/balance-v41-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          python tests/ancestry-browser.py --url http://127.0.0.1:4173/ --output /tmp/balance-v41-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-v41-verification
          path: |
            verification/balance-audit.json
            /tmp/balance-v41-ui
            /tmp/balance-v41-http.log
      - name: Commit verified calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game.json package.json package-lock.json src/app.ts tests/*.mjs README.md docs/ANCESTRY_TALENTS.md
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          git commit -m "balance: calibrate ancestry and vocation baselines for 4.1"
          git push
