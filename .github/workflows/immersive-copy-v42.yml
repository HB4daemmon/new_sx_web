# retry 3
name: Immersive copy v4.2

on:
  push:
    branches: [feature/immersive-copy-v42]
    paths:
      - '.github/workflows/immersive-copy-v42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply immersion copy pass
        run: |
          python tools/immersive-copy-v42.py
          python tools/immersive-copy-v42-finalize.py
      - run: npm ci --no-audit --no-fund
      - name: Full rules and presentation suite
        run: npm test
      - name: Balance invariance
        run: npm run balance
      - name: HTTP browser regression
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/immersive-copy-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          sleep 1
          python tests/ancestry-browser.py --url http://127.0.0.1:4173/ --output /tmp/immersive-copy-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immersive-copy-v42-verification
          path: |
            verification/balance-audit.json
            /tmp/immersive-copy-ui
            /tmp/immersive-copy-http.log
      - name: Commit verified copy pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts src/presentation.ts data/presentation.json package.json README.md tests/combat-feedback.test.mjs
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          git commit -m "ui: favor immersion over explanatory copy"
          git push
