name: Apply Gameplay V6

on:
  push:
    paths:
      - 'tools/build-v6.py'
      - '.github/workflows/gameplay-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gameplay-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v6
          mkdir -p /tmp/fengshen-v6
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v6

      - name: Apply build decision v6
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build-v6.py')
          t=p.read_text(encoding='utf-8')
          old='tests = replace_once(tests, "assert.equal(c.version,\'2.2.0\');assert.equal(c.rulesVersion,\'2.2.0\');", "assert.equal(c.version,\'2.3.0\');assert.equal(c.rulesVersion,\'2.3.0\');", \'v6 version assertion\')'
          new='tests = tests.replace("assert.equal(c.version,\'2.2.0\');assert.equal(c.rulesVersion,\'2.2.0\');", "assert.equal(c.version,\'2.3.0\');assert.equal(c.rulesVersion,\'2.3.0\');")'
          if old in t: t=t.replace(old,new,1)
          t=t.replace("as {eq:Equipped;a:Ability;role:any}[]","as {eq:Equipped;a:any;role:any}[]")
          old_reward="app = replace_method(app, 'rewards', 'event', new_rewards)"
          new_reward="app = replace_method(app, 'rewards', 'fighterFrame', new_rewards)"
          if old_reward not in t: raise SystemExit('v6 rewards patch marker missing')
          t=t.replace(old_reward,new_reward,1)
          p.write_text(t,encoding='utf-8')
          PY
          python tools/build-v6.py /tmp/fengshen-v6
          cd /tmp/fengshen-v6
          python scripts/create-content.py

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v6
          npm install --no-audit --no-fund
          npm run build
          node tests/simulate.mjs
          node --test tests/engine.test.mjs

      - name: Verify v6 markers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/fengshen-v6
          grep -q "AbilityBuildRole" src/engine.ts
          grep -q "directed-draft" src/app.ts
          grep -q "build-stage-path" src/app.ts
          grep -q "fighterFrame" src/app.ts
          grep -q "battleLogRow" src/app.ts
          grep -q "Gameplay v6" src/style.css
          grep -q "'2.3.0'" scripts/create-content.py
          test -f docs/GAMEPLAY_V6.md

      - name: Repack complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v6/node_modules /tmp/fengshen-v6/dist /tmp/fengshen-v6/build /tmp/fengshen-v6/verification
          tar -C /tmp/fengshen-v6 -cJf /tmp/fengshen-source.tar.xz .
          rm -f bootstrap/source.part.*.b64
          split -b 16000 -d -a 2 /tmp/fengshen-source.tar.xz /tmp/source.part.
          for part in /tmp/source.part.*; do base64 -w 76 "$part" > "bootstrap/$(basename "$part").b64"; done

      - name: Commit gameplay source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bootstrap
          if git diff --cached --quiet; then
            echo "No source archive changes"
            exit 0
          fi
          git commit -m "feat: add contextual build roles and directed drafts"
          git push origin HEAD:main
