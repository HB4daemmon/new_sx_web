name: Verify ancestry checkpoint
on:
  push:
    branches: [feature/ancestry-talents-v16]
    paths: [tools/stages/active.json, .github/workflows/verify-ancestry.yml]
permissions:
  contents: write
concurrency:
  group: ancestry-checkpoint
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact checkpoint delta
        run: |
          python - <<'PY'
          import json,base64,zlib,hashlib
          from pathlib import Path
          cfg=json.loads(Path('tools/stages/active.json').read_text())
          encoded=''.join(p.read_text().strip() for p in sorted(Path('tools/stages',cfg['stage']).glob('*.b64')))
          assert hashlib.sha256(encoded.encode()).hexdigest()==cfg['sha256'], 'Checkpoint hash mismatch'
          ops=json.loads(zlib.decompress(base64.b64decode(encoded,validate=True)))
          for op in ops:
              path=Path(op['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ['src','tests','data','scripts','docs','verification'] or str(path) in ['package.json','package-lock.json','README.md','.deploy-version']
              old=path.read_bytes() if path.exists() else b''
              assert (hashlib.sha256(old).hexdigest() if old else None)==op['before'], str(path)+' baseline changed'
              text=old.decode()
              for a,b,new in reversed(op['edits']):text=text[:a]+new+text[b:]
              data=text.encode()
              assert hashlib.sha256(data).hexdigest()==op['after'], str(path)+' output mismatch'
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          Path('/tmp/ancestry-paths.json').write_text(json.dumps([op['path'] for op in ops]))
          PY
      - run: npm ci --no-audit --no-fund
      - name: Verify rules and simulation
        run: |
          set -euo pipefail
          mkdir -p /tmp/ancestry-results
          npm test | tee /tmp/ancestry-results/tests.log
          npm run simulate | tee /tmp/ancestry-results/simulation.log
      - name: Browser regression when supplied
        run: |
          if python -c "import json,sys;sys.exit(not json.load(open('tools/stages/active.json')).get('browser'))"; then
            python -m pip install playwright==1.57.0
            python -m playwright install --with-deps chromium
            python -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/ancestry-http.log 2>&1 &
            server=$!
            trap 'kill "$server"' EXIT
            sleep 1
            python tests/ancestry-browser.py --url http://127.0.0.1:4173/ --output /tmp/ancestry-results/ui
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ancestry-checkpoint-${{ github.run_number }}
          path: /tmp/ancestry-results
          retention-days: 30
      - name: Commit verified implementation
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          cfg=json.loads(Path('tools/stages/active.json').read_text())
          paths=json.loads(Path('/tmp/ancestry-paths.json').read_text())
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','commit','-m',cfg['message']],check=True)
          subprocess.run(['git','push','origin','HEAD:feature/ancestry-talents-v16'],check=True)
          PY
