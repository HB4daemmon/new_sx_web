name: Inspect UI15 battle surface
on:
  push:
    branches: [feature/ui15-combat-stage]
    paths: [.github/workflows/inspect-ui15.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print battle UI and art identifiers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          app=Path('src/app.ts').read_text()
          data=json.loads(Path('data/game.json').read_text())
          print('=== ORIGIN ARTS ===')
          for x in data['origins']: print(x['id'],x['art'])
          print('=== ENEMY ARTS ===')
          values={}
          for x in data['enemies']: values.setdefault(x.get('art',''),[]).append((x['id'],x['name'],x.get('kind')))
          for art,items in values.items(): print(art, items)
          print('=== BATTLE HELPERS ===')
          for start,end in [('fighterFrame(', 'statusChanges('),('combatFeedback(', 'battleLogRow('),('battle(){','event(){')]:
              a=app.find(start); b=app.find(end,a+1); print('\n',app[a:b])
          PY
