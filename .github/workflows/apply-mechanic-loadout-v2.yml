name: Apply mechanic loadout patch v2

on:
  push:
    branches:
      - feat/mechanic-loadout
    paths:
      - .github/workflows/apply-mechanic-loadout-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all patch chunks exist
        shell: bash
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05; do
            test -s ".automation/mechanic.patch.gz.b64.part-${i}"
          done

      - name: Rebuild and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/mechanic.patch.gz.b64.part-* > /tmp/mechanic.patch.gz.b64
          base64 -d /tmp/mechanic.patch.gz.b64 > /tmp/mechanic.patch.gz
          gzip -dc /tmp/mechanic.patch.gz > /tmp/mechanic.patch
          git apply --check /tmp/mechanic.patch
          git apply /tmp/mechanic.patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Balance audit
        run: npm run check:balance

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .automation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild combat loadout around mechanics"
          git push origin HEAD:feat/mechanic-loadout
