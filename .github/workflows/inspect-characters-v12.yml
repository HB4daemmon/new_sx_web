name: Inspect Characters V12

on:
  push:
    paths:
      - '.github/workflows/inspect-characters-v12.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore source and inspect character event surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v12-inspect
          mkdir -p /tmp/fengshen-v12-inspect
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v12-inspect
          cd /tmp/fengshen-v12-inspect
          echo '=== BASE EVENTS ==='
          sed -n '105,165p' scripts/create-content.py
          echo '=== ART PORTRAIT FUNCTION ==='
          sed -n '48,74p' src/art.ts
          echo '=== APP EVENT / JOURNAL SURFACES ==='
          grep -n -E "event\(\)|karma-grid|thread-grid|timeline|因果|storyLog|final-echoes" src/app.ts | head -n 180
          echo '=== EVENT STYLE V11 ==='
          tail -n 38 src/style.css
