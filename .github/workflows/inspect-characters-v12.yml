name: Inspect Characters V12

on:
  push:
    paths:
      - '.github/workflows/inspect-characters-v12.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore source and inspect character event surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fengshen-v12-inspect
          mkdir -p /tmp/fengshen-v12-inspect
          : > /tmp/fengshen-source.tar.xz
          for part in bootstrap/source.part.*.b64; do base64 -d "$part" >> /tmp/fengshen-source.tar.xz; done
          xz -t /tmp/fengshen-source.tar.xz
          tar -xJf /tmp/fengshen-source.tar.xz -C /tmp/fengshen-v12-inspect
          cd /tmp/fengshen-v12-inspect
          echo '=== EVENT GENERATOR V11 TAIL ==='
          grep -n "Gameplay V11" scripts/create-content.py || true
          sed -n '135,310p' scripts/create-content.py
          echo '=== EVENT ENGINE ==='
          grep -n -E "interface Story|resolveStory|conditionLabel|chooseEvent|advance_thread|set_fact|add_counter|eventChoices" src/engine.ts | head -n 160
          echo '=== LABELS AND EXISTING CHARACTER NAMES ==='
          grep -n -E "threads|facts|申公豹|哪吒|杨戬|赵公明|太乙|闻仲" scripts/create-content.py | head -n 220 || true
          echo '=== PORTRAIT KEYS ==='
          grep -n -E "portrait|case '|nezha|yang|shen|zhao|taishi|hermit|jiang" src/art.ts | head -n 220 || true
          echo '=== TEST TAIL ==='
          tail -n 45 tests/engine.test.mjs
